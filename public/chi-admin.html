<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>위잉치킨 라이선스 관리</title>
<style>
  :root{--bg:#0f1522;--panel:#1a2234;--panel2:#212c44;--line:#2c3a58;--text:#e8edf7;--sub:#93a1bd;--blue:#3b82f6;--blue-d:#2563eb;--green:#34d399;--red:#f87171;--amber:#fbbf24;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Malgun Gothic","Pretendard",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px;}
  h1{font-size:20px;display:flex;align-items:center;gap:10px;}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;}
  .sub{color:var(--sub);font-size:12.5px;margin-top:4px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px;}
  input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;}
  button{cursor:pointer;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;}
  button.primary{background:var(--blue);color:#fff;} button.primary:hover{background:var(--blue-d);}
  button.mini{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:5px 9px;font-weight:600;font-size:12px;}
  button.mini.danger{color:var(--red);border-color:#7f1d1d;}
  button.mini.warn{color:var(--amber);border-color:#78591a;}
  .dl-btn{background:var(--green);color:#08301f;border-radius:8px;padding:10px 16px;font-weight:800;font-size:13px;text-decoration:none;}
  .dl-btn:hover{filter:brightness(1.08);}
  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th{text-align:left;color:var(--sub);font-size:12px;padding:8px;border-bottom:1px solid var(--line);}
  td{padding:8px;border-bottom:1px solid #1c2740;font-size:13px;vertical-align:middle;}
  .pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:11px;}
  .pill.ok{background:rgba(52,211,153,.15);color:var(--green);}
  .pill.bad{background:rgba(248,113,113,.15);color:var(--red);}
  .pill.warn{background:rgba(251,191,36,.15);color:var(--amber);}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .gate{max-width:360px;margin:80px auto;text-align:center;}
  .gate .card{text-align:left;}
  .msg{color:var(--sub);font-size:12.5px;margin-top:8px;min-height:16px;}
  .k{font-family:monospace;font-weight:700;}
  .muted{color:var(--sub);}
  .ver{font-size:12px;color:var(--sub);}
</style>
</head>
<body>
<!-- 로그인 게이트 -->
<div class="gate" id="gate">
  <h1 style="justify-content:center"><span class="logo">W</span> 라이선스 관리</h1>
  <div class="card">
    <label class="muted" style="font-size:12px">관리자 비밀번호</label>
    <input id="secret" type="password" placeholder="관리자 비밀번호" style="width:100%;margin-top:6px" />
    <button class="primary" id="loginBtn" style="width:100%;margin-top:10px">들어가기</button>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<!-- 관리 화면 -->
<div class="wrap" id="app" style="display:none">
  <div class="row" style="justify-content:space-between">
    <div>
      <h1><span class="logo">W</span> 위잉치킨 라이선스 관리</h1>
      <div class="sub">사용자(키) 등록 · 기간 관리 · 정지 · 기기 초기화 <span class="ver" id="verInfo"></span></div>
    </div>
    <button class="mini" id="logoutBtn">로그아웃</button>
  </div>

  <!-- 설치파일 다운로드 -->
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <div>
      <b>📥 위잉치킨 설치파일</b>
      <div class="muted" style="font-size:12px;margin-top:3px">고객에게 이 파일을 주세요. 설치 후 발급한 키로 인증합니다. (버전 <span id="dlVer">0.1.1</span>)</div>
    </div>
    <div class="row">
      <a class="dl-btn" id="dlBtn" href="https://github.com/NLIVEKOREA/n-live-website/releases/download/weeing-v0.1.1/weeing-setup-0.1.1.exe">설치파일 다운로드</a>
      <button class="mini" id="copyDlBtn">링크 복사</button>
    </div>
  </div>

  <!-- 신규 등록 -->
  <div class="card">
    <div class="row">
      <input id="nKey" placeholder="[생성] 버튼 클릭 (무작위 키)" style="width:220px" />
      <input id="nLabel" placeholder="이름/메모 (예: 홍길동)" style="width:200px" />
      <select id="nDays">
        <option value="0">무제한</option>
        <option value="30">30일</option>
        <option value="90">90일</option>
        <option value="180">180일</option>
        <option value="365">365일</option>
      </select>
      <button class="primary" id="addBtn">＋ 키 발급</button>
      <button class="mini" id="genBtn">키 자동생성</button>
      <button class="mini" id="trialBtn" title="무작위 키를 즉시 만들어 3일 무료체험으로 발급합니다">🎁 무료체험 3일</button>
    </div>
    <div class="msg" id="addMsg"></div>
  </div>

  <!-- 목록 -->
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>발급된 라이선스</b>
      <button class="mini" id="reloadBtn">새로고침</button>
    </div>
    <table>
      <thead><tr><th>키</th><th>이름</th><th>상태</th><th>기간</th><th>기기</th><th>조작</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const SB_URL = "https://qikvvqgxmquevzyykkcm.supabase.co";
const SB_ANON = "sb_publishable_7dB61aDLDjATF2PMWnS4dw_j506tmao";
const $ = (id) => document.getElementById(id);
let SECRET = localStorage.getItem("chi_admin_secret") || "";

async function rpc(fn, body) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SB_ANON, authorization: "Bearer " + SB_ANON, "content-type": "application/json" },
    body: JSON.stringify(body)
  });
  try { return await r.json(); } catch (_) { return { ok: false, reason: "응답 오류" }; }
}

function fmtDate(s){ if(!s) return ""; const d=new Date(s); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; }
function daysLeft(s){ if(!s) return null; return Math.ceil((new Date(s)-new Date())/86400000); }

function periodCell(r){
  if(!r.expires_at) return '<span class="pill">무제한</span>';
  const d = daysLeft(r.expires_at);
  if(d<0) return `<span class="pill bad">만료</span> <span class="muted">${fmtDate(r.expires_at)}</span>`;
  const cls = d<=7 ? "warn" : "ok";
  return `<span class="pill ${cls}">${d}일 남음</span> <span class="muted">~${fmtDate(r.expires_at)}</span>`;
}

let LAST_ROWS = [];
async function load(){
  const res = await rpc("admin_list_licenses", { p_secret: SECRET });
  if(!res.ok){ $("rows").innerHTML = `<tr><td colspan="6" class="bad">${res.reason||"불러오기 실패"}</td></tr>`; return; }
  const rows = res.rows||[];
  LAST_ROWS = rows;
  $("rows").innerHTML = rows.map(r=>{
    const active = r.active && (!r.expires_at || daysLeft(r.expires_at)>=0);
    const status = !r.active ? '<span class="pill bad">정지</span>' : (active ? '<span class="pill ok">사용중</span>' : '<span class="pill bad">만료</span>');
    const machine = r.machine ? '<span class="pill ok">등록됨</span>' : '<span class="pill">미사용</span>';
    return `<tr>
      <td class="k">${esc(r.key)}</td>
      <td>${esc(r.label||"")}</td>
      <td>${status}</td>
      <td>${periodCell(r)}</td>
      <td>${machine}</td>
      <td class="row">
        ${r.active ? `<button class="mini warn" data-act="off" data-k="${esc(r.key)}">정지</button>` : `<button class="mini" data-act="on" data-k="${esc(r.key)}">활성</button>`}
        <button class="mini" data-act="ext" data-k="${esc(r.key)}">+30일</button>
        <button class="mini" data-act="reset" data-k="${esc(r.key)}">기기초기화</button>
        <button class="mini ${r.erp_url ? "ok" : ""}" data-act="erp" data-k="${esc(r.key)}" title="${esc(r.erp_url||"고객 ERP 접속정보 미지정")}">ERP${r.erp_url ? "✓" : ""}</button>
        <button class="mini danger" data-act="del" data-k="${esc(r.key)}">삭제</button>
      </td></tr>`;
  }).join("") || '<tr><td colspan="6" class="muted">발급된 키 없음</td></tr>';
}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

async function checkVersion(){
  // GitHub Releases 최신본을 읽어 버전 표시 + 다운로드 링크를 자동 갱신(새 버전 발행 시 수정 불필요)
  try{
    const r = await fetch("https://api.github.com/repos/NLIVEKOREA/n-live-website/releases/latest?t="+Date.now(),{headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok) return;
    const j = await r.json();
    const ver = String(j.tag_name||"").replace(/^weeing-v/i,"");
    const exe = (j.assets||[]).find(a=>/weeing-setup.*\.exe$/i.test(a.name||""));
    if(ver){ $("verInfo").textContent = "· 현재 배포버전 v"+ver; if($("dlVer")) $("dlVer").textContent = ver; }
    if(exe && $("dlBtn")) $("dlBtn").setAttribute("href", exe.browser_download_url);
  }catch(_){}
}

// 로그인
$("loginBtn").addEventListener("click", tryLogin);
$("secret").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
async function tryLogin(){
  SECRET = $("secret").value.trim();
  $("gateMsg").textContent = "확인 중...";
  const res = await rpc("admin_list_licenses", { p_secret: SECRET });
  if(res.ok){ localStorage.setItem("chi_admin_secret", SECRET); showApp(); }
  else $("gateMsg").textContent = "❌ " + (res.reason||"비밀번호 오류");
}
function showApp(){ $("gate").style.display="none"; $("app").style.display="block"; load(); checkVersion(); }
$("logoutBtn").addEventListener("click", ()=>{ localStorage.removeItem("chi_admin_secret"); location.reload(); });
$("copyDlBtn").addEventListener("click", ()=>{
  const url = $("dlBtn").getAttribute("href");
  navigator.clipboard.writeText(url).then(()=>{ $("copyDlBtn").textContent="복사됨!"; setTimeout(()=>$("copyDlBtn").textContent="링크 복사",1500); });
});

// 등록 — 암호학적 랜덤 키(추측/열거 불가). 혼동문자(O0I1) 제외한 30자 알파벳.
function genLicenseKey(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";  // 32→30자(O,0,I,1 제외)
  const buf=new Uint8Array(20); crypto.getRandomValues(buf);
  let s=""; for(let i=0;i<buf.length;i++) s+=A[buf[i]%A.length];
  return "WEEING-"+s.slice(0,5)+"-"+s.slice(5,10)+"-"+s.slice(10,15)+"-"+s.slice(15,20);
}
$("genBtn").addEventListener("click", ()=>{ $("nKey").value = genLicenseKey(); });
$("addBtn").addEventListener("click", async ()=>{
  const key = $("nKey").value.trim().toUpperCase();  // 앱이 대문자로 확인하므로 항상 대문자 저장
  if(!key) return $("addMsg").textContent="키를 입력하세요";
  // 약한 키(순차·짧은) 발급 차단 — 열거 공격 방지. 무작위 16자 이상 요구.
  var body = key.replace(/^WEEING-/,"").replace(/-/g,"");
  if(body.length < 16 || /^[0-9]+$/.test(body)){
    return $("addMsg").textContent="⚠️ 약한 키입니다. [생성] 버튼으로 무작위 키를 발급하세요 (순차·짧은 키는 남이 추측 가능).";
  }
  $("addMsg").textContent="발급 중...";
  const res = await rpc("admin_create_license", { p_secret:SECRET, p_key:key, p_label:$("nLabel").value.trim(), p_days:Number($("nDays").value) });
  if(res.ok){ $("addMsg").textContent="✅ 발급됨: "+key; $("nKey").value=""; $("nLabel").value=""; load(); }
  else $("addMsg").textContent="❌ "+(res.reason||"실패");
});

// 🎁 무료체험 3일: 무작위 키를 즉시 만들어 3일 만료로 발급(발급된 키는 화면에 남겨 고객 전달용으로 복사)
$("trialBtn").addEventListener("click", async ()=>{
  const key = genLicenseKey();               // 항상 강한 무작위 키(추측 불가)
  $("nKey").value = key;                       // 발급 키를 입력칸에 표시(복사용)
  const label = $("nLabel").value.trim() || "무료체험";
  $("addMsg").textContent="무료체험 발급 중...";
  const res = await rpc("admin_create_license", { p_secret:SECRET, p_key:key, p_label:label, p_days:3 });
  if(res.ok){ $("addMsg").textContent="✅ 3일 무료체험 발급됨 — 이 키를 고객에게 전달: "+key; $("nLabel").value=""; load(); }
  else $("addMsg").textContent="❌ "+(res.reason||"실패");
});

// 목록 조작
$("reloadBtn").addEventListener("click", load);
$("rows").addEventListener("click", async (e)=>{
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const key = b.dataset.k, act = b.dataset.act;
  if(act==="del" && !confirm(key+" 키를 삭제할까요?")) return;
  if(act==="reset" && !confirm(key+"의 기기 등록을 초기화할까요? (다른 기기에서 재인증 가능)")) return;
  let res;
  if(act==="off") res = await rpc("admin_update_license",{p_secret:SECRET,p_key:key,p_active:false,p_add_days:0,p_reset_machine:false});
  else if(act==="on") res = await rpc("admin_update_license",{p_secret:SECRET,p_key:key,p_active:true,p_add_days:0,p_reset_machine:false});
  else if(act==="ext") res = await rpc("admin_update_license",{p_secret:SECRET,p_key:key,p_active:null,p_add_days:30,p_reset_machine:false});
  else if(act==="reset") res = await rpc("admin_update_license",{p_secret:SECRET,p_key:key,p_active:null,p_add_days:0,p_reset_machine:true});
  else if(act==="del") res = await rpc("admin_delete_license",{p_secret:SECRET,p_key:key});
  else if(act==="erp"){
    // 고객 ERP 접속정보 지정 — 앱은 라이선스 확인 때 이 값을 자동 적용(앱 내 입력 불필요)
    const row = (LAST_ROWS||[]).find(x=>x.key===key)||{};
    const url = prompt("고객 ERP Supabase URL (예: https://xxxx.supabase.co)\n비우면 해제", row.erp_url||"");
    if(url===null) return;
    const anon = prompt("Anon Key — 그 Supabase 프로젝트의 공개 API 키 (Settings→API)", row.erp_anon_key||"");
    if(anon===null) return;
    const slug = prompt("방송 slug — 이 고객 방송 주문 구분자 (예: sunpick-live)", row.erp_slug||"");
    if(slug===null) return;
    // app_secret — 고객킷생성.js가 출력한 그 고객 전용 secret(고객 ERP 설치SQL에 박힌 값과 동일). 비우면 기존값 유지.
    const appSecret = prompt("app_secret — 고객 전용 앱 시크릿 (고객킷생성.js 출력값, 고객 설치SQL과 동일)\n비우면 기존값 유지", row.erp_app_secret||"");
    if(appSecret===null) return;
    res = await rpc("admin_set_license_erp",{p_secret:SECRET,p_key:key,p_url:url.trim(),p_anon:anon.trim(),p_slug:slug.trim(),p_app_secret:appSecret.trim()});
    if(res && !res.ok) alert(res.reason||"저장 실패");
  }
  load();
});

// 자동 로그인
if(SECRET) showApp(); else $("secret").focus();
</script>
</body>
</html>
