<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>N-LIVE · 방송 주문</title>
<style>
:root{--brand:#ff2e50;--brand-d:#e11d40;--brand-s:#fff1f3;--blue:#ff2e50;--ink:#14161c;--muted:#8b92a1;--line:#eef0f4;--bg:#f5f6f8;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic",-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;box-shadow:0 0 40px rgba(20,22,28,.06)}
.appbar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:900;font-size:16px;letter-spacing:-.3px;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(12px)}
.appbar .back{font-size:24px;background:none;border:0;color:#111;cursor:pointer;padding:4px 6px;margin-left:-6px}
.appbar .cart{margin-left:auto;background:var(--brand-s);color:var(--brand);border:0;border-radius:12px;padding:9px 13px;font-weight:900;cursor:pointer;font-size:13px}
.cover{height:220px;background:linear-gradient(135deg,#ff6a88 0%,#ff2e50 55%,#d31f42 100%);position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;color:#fff;overflow:hidden}
.cover:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 82% 0%,rgba(255,255,255,.3),transparent 58%);pointer-events:none}
.cover.img{background-size:cover;background-position:center}
.cover.img:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.55));z-index:0}
.cover>*{position:relative;z-index:1}
.live{position:absolute;left:14px;top:14px;background:#ff1f3d;color:#fff;border-radius:9px;padding:6px 12px;font-size:12px;font-weight:900;letter-spacing:.2px;box-shadow:0 0 0 0 rgba(255,31,61,.55);animation:livep 1.9s infinite;z-index:2}
@keyframes livep{0%{box-shadow:0 0 0 0 rgba(255,31,61,.5)}70%{box-shadow:0 0 0 13px rgba(255,31,61,0)}100%{box-shadow:0 0 0 0 rgba(255,31,61,0)}}
.sec{padding:16px}
.seller{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff8fa3,#ff2e50);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;flex:0 0 auto;box-shadow:0 4px 14px rgba(255,46,80,.32)}
.seller b{font-size:17px;letter-spacing:-.3px}.seller small{display:block;color:var(--muted);margin-top:3px;font-size:12.5px}
.notice{background:#fbfbfd;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:12.5px;line-height:1.65;margin-top:14px;white-space:pre-wrap;color:#4a5060}
.prodlist{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.product{border:0;border-radius:16px;overflow:hidden;text-align:left;background:#fff;cursor:pointer;padding:0;position:relative;box-shadow:0 4px 16px rgba(20,22,28,.07);transition:transform .12s}
.product:active{transform:scale(.98)}
.product.now{box-shadow:0 0 0 2.5px var(--brand),0 8px 22px rgba(255,46,80,.24)}
.product.now:before{content:"🔴 지금 소개중";position:absolute;z-index:2;left:8px;top:8px;background:var(--brand);color:#fff;padding:5px 9px;border-radius:9px;font-size:10px;font-weight:900;box-shadow:0 4px 12px rgba(255,46,80,.4)}
.pimg{aspect-ratio:3/4;background:#f4f5f8 center/contain no-repeat;display:grid;place-items:center;color:#aeb4c0;font-size:12px}
#ytfloat{position:fixed;z-index:80;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.5)}
#ytfloat.mini{width:172px;right:12px;bottom:14px}
#ytfloat:not(.mini){width:min(94vw,460px);left:50%;transform:translateX(-50%);top:58px}
#ytfloat .ythead{display:flex;align-items:center;gap:6px;padding:6px 9px;background:#111;color:#fff}
#ytfloat .ytlive{background:#ff1f3d;padding:2px 7px;border-radius:6px;font-weight:900;font-size:10px}
#ytfloat .ytbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px}
#ytfloat .ytbox{position:relative;width:100%;aspect-ratio:16/9;background:#000}
#ytfloat .ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ytreopen{position:fixed;right:12px;bottom:14px;z-index:80;background:#ff1f3d;color:#fff;border:0;border-radius:24px;padding:11px 16px;font-weight:900;font-size:13px;box-shadow:0 6px 20px rgba(255,31,61,.4);cursor:pointer}
.detimg{width:100%;max-height:74vh;object-fit:contain;background:#f4f5f8;display:block;cursor:zoom-in}
.ptxt{padding:11px 12px 13px}.ptxt b{display:block;font-size:14px;line-height:1.35;font-weight:700;letter-spacing:-.2px}.price{font-weight:900;margin-top:8px;font-size:17px;color:var(--brand);letter-spacing:-.3px}
.soldout{opacity:.5}.soldout-tag{position:absolute;inset:0;background:rgba(255,255,255,.6);display:grid;place-items:center;font-weight:900;color:#111;z-index:3}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.opt{border:1.5px solid #e2e6ec;background:#fff;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer}
.opt.sel{border:2px solid var(--brand);background:var(--brand-s);color:var(--brand);font-weight:800}
.opt.off{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.qtybox{display:inline-flex;align-items:center;gap:16px;border:1.5px solid var(--line);border-radius:12px;padding:8px 15px;font-weight:900}
.qtybox button{border:0;background:none;font-size:20px;cursor:pointer;color:#111;width:22px}
.cta{width:100%;border:0;background:var(--brand);color:#fff;border-radius:15px;padding:16px;font-weight:900;cursor:pointer;font-size:16px;letter-spacing:-.2px;box-shadow:0 8px 20px rgba(255,46,80,.28)}
.cta:active{transform:translateY(1px)}
.cta:disabled{background:#cfd4dd;box-shadow:none;cursor:not-allowed}
.cta.green{background:var(--green);box-shadow:0 8px 20px rgba(22,163,74,.26)}.cta.ghost{background:#fff;color:#475467;border:1.5px solid var(--line);box-shadow:none}
.field label{display:block;font-size:12.5px;color:#475467;font-weight:800;margin:14px 0 7px}
.field input,.field textarea{width:100%;border:1.5px solid #e2e6ec;border-radius:12px;padding:13px 13px;background:#fff}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.field input{height:48px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#475467;line-height:1.5;margin:14px 0 4px}
.agree input{width:19px;height:19px;margin-top:1px;flex:0 0 auto;accent-color:var(--brand)}
.cartrow{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.cthumb{width:66px;height:66px;border-radius:12px;background:#f0f2f6 center/cover;flex:0 0 auto}
.ci{flex:1;min-width:0}.ci b{font-size:13.5px}.ci small{display:block;color:var(--muted);font-size:11px;margin:3px 0}
.rm{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.sum{margin:16px 0}.sum div{display:flex;justify-content:space-between;font-size:13px;color:#475467;padding:6px 0}
.sum .total{font-size:18px;color:#111;font-weight:900;border-top:1.5px solid var(--line);margin-top:4px;padding-top:13px}
.sum .total span:last-child{color:var(--brand)}
.foot{position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.success{text-align:center;padding:44px 20px}
.check{width:78px;height:78px;background:#e9f8ee;color:var(--green);border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-size:42px;font-weight:900}
.success h3{margin:0 0 8px;font-size:21px;letter-spacing:-.4px}.success p{font-size:13px;color:var(--muted);line-height:1.65;margin:0}
.orderbox{text-align:left;background:#f7f8fb;border:1px solid var(--line);border-radius:14px;padding:15px;margin:20px 0;font-size:13px}
.orderbox div{display:flex;justify-content:space-between;padding:6px 0}
.paynote{text-align:left;background:var(--brand-s);border:1px solid #ffd3da;border-radius:14px;padding:14px;font-size:12.5px;line-height:1.7;color:#a51230}
.center{display:grid;place-items:center;min-height:70vh;padding:30px;text-align:center;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid #e6e9ef;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#14161c;color:#fff;padding:12px 17px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1}
.badge{display:inline-block;background:#e9f8ee;color:#15803d;border-radius:7px;padding:3px 8px;font-size:11px;font-weight:800;margin-left:6px}
.numtag{display:inline-block;background:var(--brand-s);color:var(--brand);border-radius:7px;padding:2px 7px;font-size:11px;font-weight:900;vertical-align:middle}
.remembered{background:#eef7ee;border:1px solid #cde8cd;border-radius:12px;padding:11px 13px;font-size:12px;color:#256029;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.remembered a{color:var(--brand);cursor:pointer;text-decoration:underline;margin-left:auto;white-space:nowrap;font-weight:700}
.paysel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paybtn{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid #e2e6ec;border-radius:13px;padding:14px 8px;background:#fff;font-size:14px;font-weight:800;cursor:pointer;color:#111}
.paybtn small{font-size:10px;font-weight:600;color:#98a2b3}
.paybtn.sel{border:2px solid var(--brand);background:var(--brand-s);color:var(--brand)}
.paybtn.sel small{color:var(--brand)}
/* ===== 프리미엄 홈 ===== */
.tbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;height:52px;padding:0 8px 0 16px;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.tbar b{font-size:15px;font-weight:900;letter-spacing:-.3px}
.tbar .tcart{margin-left:auto;width:40px;height:40px;border:0;background:none;font-size:19px;display:grid;place-items:center;position:relative;cursor:pointer}
.tbar .cnt{position:absolute;top:3px;right:2px;min-width:17px;height:17px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;border-radius:100px;display:grid;place-items:center;padding:0 4px}
.hero{position:relative;aspect-ratio:1/1;overflow:hidden;background:#0d0d10}
.hmedia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;display:block}
.hgrad{background:linear-gradient(140deg,#2a2140,#ff2e50 130%)}
.hshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,transparent 30%,transparent 52%,rgba(0,0,0,.84) 100%);pointer-events:none}
.htop{position:absolute;top:14px;left:14px;z-index:3;display:flex;gap:8px}
.livep{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;font-weight:800;font-size:12px;padding:6px 11px 6px 10px;border-radius:100px;box-shadow:0 4px 14px rgba(255,46,80,.5)}
.livep i{width:7px;height:7px;border-radius:50%;background:#fff;animation:hpl 1.6s infinite}
@keyframes hpl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.hbottom{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:18px 18px 20px;color:#fff}
.htitle{font-size:22px;font-weight:900;line-height:1.28;letter-spacing:-.04em;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.hseller{display:flex;align-items:center;gap:11px;margin-top:14px}
.hav{width:46px;height:46px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;flex:0 0 auto}
.hav img{width:100%;height:100%;object-fit:cover}
.hseller b{font-size:15px;font-weight:800}.hseller small{display:block;opacity:.85;font-size:12px;margin-top:1px;font-weight:600}
.homewrap{padding-bottom:150px}
.ndet{margin:14px 16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ndet summary{list-style:none;display:flex;align-items:center;gap:9px;padding:14px 15px;font-size:13.5px;font-weight:700;cursor:pointer}
.ndet summary::-webkit-details-marker{display:none}
.ndet .chip{background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px}
.ndet .arw{margin-left:auto;color:var(--muted);transition:.2s}.ndet[open] .arw{transform:rotate(180deg)}
.ndet .nbody{padding:0 15px 15px;font-size:12.5px;line-height:1.75;color:#54545c;white-space:pre-line}
.shead{display:flex;align-items:baseline;gap:9px;padding:24px 18px 12px}
.shead h2{margin:0;font-size:17px;font-weight:900;letter-spacing:-.03em}.shead small{color:var(--muted);font-size:12px;font-weight:600}
.feat{display:block;width:calc(100% - 32px);margin:0 16px;border:0;padding:0;border-radius:18px;overflow:hidden;position:relative;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.14);cursor:pointer}
.feat img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.feat .fimg-ph{width:100%;aspect-ratio:4/3;background:#f3f3f5;display:grid;place-items:center;color:#aeb4c0;font-size:13px}
.feat .nowtag{position:absolute;top:12px;left:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;font-weight:800;font-size:11.5px;padding:6px 11px;border-radius:100px;box-shadow:0 4px 14px rgba(255,46,80,.45)}
.feat .nowtag i{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block}
.feat .fmeta{position:absolute;left:0;right:0;bottom:0;padding:36px 15px 15px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.82));color:#fff;display:flex;align-items:flex-end;gap:12px;text-align:left}
.feat .fn{font-size:16px;font-weight:800;line-height:1.3}.feat .fp{font-size:19px;font-weight:900;margin-top:4px}
.feat .fadd{margin-left:auto;flex:0 0 auto;background:#fff;color:var(--ink);font-weight:800;font-size:14px;padding:11px 17px;border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px 8px}
.pcard{border:0;background:none;text-align:left;padding:0;cursor:pointer}
.pcard .pi{position:relative;aspect-ratio:1/1;border-radius:15px;overflow:hidden;background:#f3f3f5}
.pcard .pi img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pi-ph{width:100%;height:100%;display:grid;place-items:center;color:#aeb4c0;font-size:12px}
.pcard .num{position:absolute;top:8px;left:8px;z-index:2;background:rgba(19,19,22,.72);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px}
.pcard.sold .pi:after{content:"품절";position:absolute;inset:0;background:rgba(255,255,255,.66);display:grid;place-items:center;font-weight:900;color:var(--ink);font-size:15px}
.pcard .pn{font-size:13.5px;font-weight:600;line-height:1.35;margin:9px 2px 0;color:#2a2a30;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pp{font-size:16px;font-weight:900;margin:3px 2px 0;letter-spacing:-.03em}
.cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));width:min(480px,100%);padding:0 14px;z-index:40}
.cbar button{width:100%;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:16px;padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 30px rgba(255,46,80,.36);cursor:pointer}
.cbar .cb{background:rgba(255,255,255,.24);border-radius:8px;padding:2px 9px;font-size:13px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:39}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;cursor:pointer}
.tabbar a.on{color:var(--ink)}.tabbar a i{font-size:20px;font-style:normal}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="center"><div><div class="spinner"></div>방송을 불러오는 중...</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://qikvvqgxmquevzyykkcm.supabase.co';
const SUPA_KEY='sb_publishable_7dB61aDLDjATF2PMWnS4dw_j506tmao';
const SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false}});

// ---- 상태 ----
const SLUG=(location.pathname.match(/\/shop\/([^\/?#]+)/)||[])[1]||'';
let SHOP=null;        // get_live_shop 결과
let CART=[];          // {product_id,name,price,color,size,qty,image_url}
let VIEW='home';      // home | product | cart | form | done
let CURP=null;        // 현재 상세 상품
let SEL={color:null,size:null,qty:1};
let DONE=null;        // 주문완료 결과
let CUST={receiver:'',nick:'',phone:'',addr:'',addr_detail:'',agree:false};
let PAYM='현금';        // 결제방법: 현금 | 카드

const $=s=>document.querySelector(s);
const won=n=>'₩'+Number(n||0).toLocaleString();
/* 번호표 표시: 번호표(재고 tag) 또는 품번에서 숫자만 뽑아 "N번"으로. 숫자 없으면 원문 그대로 */
const numLabel=v=>{const d=String(v==null?'':v).replace(/[^0-9]/g,'');return d?parseInt(d,10)+'번':String(v==null?'':v);};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
const cartCount=()=>CART.reduce((s,x)=>s+x.qty,0);
const subtotal=()=>CART.reduce((s,x)=>s+x.price*x.qty,0);
function shipFee(){const sess=SHOP&&SHOP.session;if(!sess)return 0;if(sess.free_ship_min>0&&subtotal()>=sess.free_ship_min)return 0;return sess.ship_fee||0;}

async function load(){
  if(!SLUG){renderClosed('잘못된 주소입니다.');return;}
  try{
    const {data,error}=await SB.rpc('get_live_shop',{p_slug:SLUG});
    if(error){console.error(error);renderClosed('일시적인 오류입니다. 잠시 후 다시 시도해 주세요.');return;}
    SHOP=data;
    if(!SHOP||SHOP.status!=='open'){renderClosed();return;}
    render();
    window.addEventListener('scroll',updatePip,{passive:true});updatePip();
  }catch(e){console.error(e);renderClosed('연결에 실패했습니다. 인터넷을 확인해 주세요.');}
}
/* ---- 유튜브 라이브: 화면 넘나들어도 계속 재생되는 미니 플레이어(#app 바깥 body에 고정) ---- */
function ytEmbedUrl(v){v=(v||'').trim();if(!v)return '';
  let m=v.match(/[?&]v=([A-Za-z0-9_-]{6,})/)||v.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/)||v.match(/youtube\.com\/live\/([A-Za-z0-9_-]{6,})/)||v.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/);
  if(m)return 'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&mute=1&playsinline=1&rel=0';
  let c=v.match(/channel\/(UC[A-Za-z0-9_-]{18,})/)||v.match(/^(UC[A-Za-z0-9_-]{18,})$/);
  if(c)return 'https://www.youtube.com/embed/live_stream?channel='+c[1]+'&autoplay=1&mute=1&playsinline=1&rel=0';
  return '';/* @handle 등은 임베드 불가 → 채널ID/영상링크 안내 */}

// ---- 옵션 헬퍼 ----
function realOpts(p){return (p.options||[]).filter(o=>o.color||o.size);}
function colorsOf(p){const s=[];realOpts(p).forEach(o=>{if(o.color&&!s.includes(o.color))s.push(o.color);});return s;}
function sizesOf(p){const s=[];realOpts(p).forEach(o=>{if(o.size&&!s.includes(o.size))s.push(o.size);});return s;}
function optAvail(p,color,size){const os=realOpts(p);if(!os.length)return true;const m=os.find(o=>(o.color||null)===(color||null)&&(o.size||null)===(size||null));return m?m.available:false;}
function prodSoldOut(p){const os=realOpts(p);if(!os.length)return false;return os.every(o=>!o.available);}

function ytLoopUrl(v){const e=ytEmbedUrl(v);if(!e)return '';const id=(e.match(/embed\/([A-Za-z0-9_-]+)/)||[])[1];return e.replace('rel=0','loop=1&controls=0&modestbranding=1&rel=0')+(id?('&playlist='+id):'');}

      if(data&&(data.reason==='soldout'||data.reason==='bad_option'||data.reason==='bad_item'))await load();return;}

        · 담당 직원이 <b>페이히어 결제링크</b>를 방송 채팅/카톡으로 보내드립니다.<br>
        · 링크로 결제하시면 상품 준비·발송이 시작됩니다.<br>
        · <b>입금(결제) 순서대로</b> 재고가 배정돼요. 조금만 기다려주세요!</div>`
       :`<div class="paynote">💵 <b>계좌이체 안내</b>${d.pay_info?`<div style="background:#fff;border:1px solid #cfe0ff;border-radius:8px;padding:10px;margin:8px 0;font-size:14px;font-weight:800;color:#111;text-align:center">${esc(d.pay_info)}</div>`:'<br>· 방송 채팅/카톡으로 계좌번호를 안내드립니다.<br>'}
        · 위 <b>주문금액 ${won(d.total)}</b>을 입금해 주세요. (여러 번 주문하셨으면 <b>합계 한 번에</b>)<br>
        · <b>입금 확인 순서대로</b> 재고가 배정됩니다. 빠른 입금 부탁드려요!</div>`}
      <button class="cta ghost" style="margin-top:20px" onclick="CART=[];DONE=null;go('home')">쇼핑 계속하기</button>
     </div>`;
}
function shopZoom(url){if(!url)return;let o=document.getElementById('zoomOv');if(!o){o=document.createElement('div');o.id='zoomOv';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);display:grid;place-items:center;z-index:9999;cursor:zoom-out;padding:12px';o.onclick=function(){o.style.display='none';};o.innerHTML='<img style="max-width:96vw;max-height:96vh;border-radius:8px">';document.body.appendChild(o);}o.querySelector('img').src=url;o.style.display='grid';}
function go(v){VIEW=v;window.scrollTo(0,0);render();updatePip();}
window.openProduct=openProduct;window.pickColor=pickColor;window.pickSize=pickSize;window.qc=qc;window.addCart=addCart;
window.cqc=cqc;window.rmCart=rmCart;window.submitOrder=submitOrder;window.go=go;window.clearRemembered=clearRemembered;window.setPay=setPay;window.shopZoom=shopZoom;window.ytToggleSize=ytToggleSize;window.ytClose=ytClose;
try{const c=JSON.parse(localStorage.getItem('nlive_cust')||'null');if(c&&c.phone){CUST={...CUST,...c,agree:false};}}catch(e){}
load();
