<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>N-LIVE · 방송 주문</title>
<style>
:root{--brand:#ff2e50;--brand-d:#e11d40;--brand-s:#fff1f3;--blue:#ff2e50;--ink:#14161c;--muted:#8b92a1;--line:#eef0f4;--bg:#f5f6f8;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic",-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;box-shadow:0 0 40px rgba(20,22,28,.06)}
.appbar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:900;font-size:16px;letter-spacing:-.3px;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(12px)}
.appbar .back{font-size:24px;background:none;border:0;color:#111;cursor:pointer;padding:4px 6px;margin-left:-6px}
.appbar .cart{margin-left:auto;background:var(--brand-s);color:var(--brand);border:0;border-radius:12px;padding:9px 13px;font-weight:900;cursor:pointer;font-size:13px}
.cover{height:220px;background:linear-gradient(135deg,#ff6a88 0%,#ff2e50 55%,#d31f42 100%);position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;color:#fff;overflow:hidden}
.cover:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 82% 0%,rgba(255,255,255,.3),transparent 58%);pointer-events:none}
.cover.img{background-size:cover;background-position:center}
.cover.img:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.55));z-index:0}
.cover>*{position:relative;z-index:1}
.live{position:absolute;left:14px;top:14px;background:#ff1f3d;color:#fff;border-radius:9px;padding:6px 12px;font-size:12px;font-weight:900;letter-spacing:.2px;box-shadow:0 0 0 0 rgba(255,31,61,.55);animation:livep 1.9s infinite;z-index:2}
@keyframes livep{0%{box-shadow:0 0 0 0 rgba(255,31,61,.5)}70%{box-shadow:0 0 0 13px rgba(255,31,61,0)}100%{box-shadow:0 0 0 0 rgba(255,31,61,0)}}
.sec{padding:16px}
.seller{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff8fa3,#ff2e50);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;flex:0 0 auto;box-shadow:0 4px 14px rgba(255,46,80,.32)}
.seller b{font-size:17px;letter-spacing:-.3px}.seller small{display:block;color:var(--muted);margin-top:3px;font-size:12.5px}
.notice{background:#fbfbfd;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:12.5px;line-height:1.65;margin-top:14px;white-space:pre-wrap;color:#4a5060}
.prodlist{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.product{border:0;border-radius:16px;overflow:hidden;text-align:left;background:#fff;cursor:pointer;padding:0;position:relative;box-shadow:0 4px 16px rgba(20,22,28,.07);transition:transform .12s}
.product:active{transform:scale(.98)}
.product.now{box-shadow:0 0 0 2.5px var(--brand),0 8px 22px rgba(255,46,80,.24)}
.product.now:before{content:"🔴 지금 소개중";position:absolute;z-index:2;left:8px;top:8px;background:var(--brand);color:#fff;padding:5px 9px;border-radius:9px;font-size:10px;font-weight:900;box-shadow:0 4px 12px rgba(255,46,80,.4)}
.pimg{aspect-ratio:3/4;background:#f4f5f8 center/contain no-repeat;display:grid;place-items:center;color:#aeb4c0;font-size:12px}
#ytfloat{position:fixed;z-index:80;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.5)}
#ytfloat.mini{width:172px;right:12px;bottom:14px}
#ytfloat:not(.mini){width:min(94vw,460px);left:50%;transform:translateX(-50%);top:58px}
#ytfloat .ythead{display:flex;align-items:center;gap:6px;padding:6px 9px;background:#111;color:#fff}
#ytfloat .ytlive{background:#ff1f3d;padding:2px 7px;border-radius:6px;font-weight:900;font-size:10px}
#ytfloat .ytbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px}
#ytfloat .ytbox{position:relative;width:100%;aspect-ratio:16/9;background:#000}
#ytfloat .ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ytreopen{position:fixed;right:12px;bottom:14px;z-index:80;background:#ff1f3d;color:#fff;border:0;border-radius:24px;padding:11px 16px;font-weight:900;font-size:13px;box-shadow:0 6px 20px rgba(255,31,61,.4);cursor:pointer}
.detimg{width:100%;max-height:74vh;object-fit:contain;background:#f4f5f8;display:block;cursor:zoom-in}
.ptxt{padding:11px 12px 13px}.ptxt b{display:block;font-size:14px;line-height:1.35;font-weight:700;letter-spacing:-.2px}.price{font-weight:900;margin-top:8px;font-size:17px;color:var(--brand);letter-spacing:-.3px}
.soldout{opacity:.5}.soldout-tag{position:absolute;inset:0;background:rgba(255,255,255,.6);display:grid;place-items:center;font-weight:900;color:#111;z-index:3}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.opt{border:1.5px solid #e2e6ec;background:#fff;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer}
.opt.sel{border:2px solid var(--brand);background:var(--brand-s);color:var(--brand);font-weight:800}
.opt.off{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.qtybox{display:inline-flex;align-items:center;gap:16px;border:1.5px solid var(--line);border-radius:12px;padding:8px 15px;font-weight:900}
.qtybox button{border:0;background:none;font-size:20px;cursor:pointer;color:#111;width:22px}
.cta{width:100%;border:0;background:var(--brand);color:#fff;border-radius:15px;padding:16px;font-weight:900;cursor:pointer;font-size:16px;letter-spacing:-.2px;box-shadow:0 8px 20px rgba(255,46,80,.28)}
.cta:active{transform:translateY(1px)}
.cta:disabled{background:#cfd4dd;box-shadow:none;cursor:not-allowed}
.cta.green{background:var(--green);box-shadow:0 8px 20px rgba(22,163,74,.26)}.cta.ghost{background:#fff;color:#475467;border:1.5px solid var(--line);box-shadow:none}
.field label{display:block;font-size:12.5px;color:#475467;font-weight:800;margin:14px 0 7px}
.field input,.field textarea{width:100%;border:1.5px solid #e2e6ec;border-radius:12px;padding:13px 13px;background:#fff}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.field input{height:48px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#475467;line-height:1.5;margin:14px 0 4px}
.agree input{width:19px;height:19px;margin-top:1px;flex:0 0 auto;accent-color:var(--brand)}
.cartrow{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.cthumb{width:66px;height:66px;border-radius:12px;background:#f0f2f6 center/cover;flex:0 0 auto}
.ci{flex:1;min-width:0}.ci b{font-size:13.5px}.ci small{display:block;color:var(--muted);font-size:11px;margin:3px 0}
.rm{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.sum{margin:16px 0}.sum div{display:flex;justify-content:space-between;font-size:13px;color:#475467;padding:6px 0}
.sum .total{font-size:18px;color:#111;font-weight:900;border-top:1.5px solid var(--line);margin-top:4px;padding-top:13px}
.sum .total span:last-child{color:var(--brand)}
.foot{position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.success{text-align:center;padding:44px 20px}
.check{width:78px;height:78px;background:#e9f8ee;color:var(--green);border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-size:42px;font-weight:900}
.success h3{margin:0 0 8px;font-size:21px;letter-spacing:-.4px}.success p{font-size:13px;color:var(--muted);line-height:1.65;margin:0}
.orderbox{text-align:left;background:#f7f8fb;border:1px solid var(--line);border-radius:14px;padding:15px;margin:20px 0;font-size:13px}
.orderbox div{display:flex;justify-content:space-between;padding:6px 0}
.paynote{text-align:left;background:var(--brand-s);border:1px solid #ffd3da;border-radius:14px;padding:14px;font-size:12.5px;line-height:1.7;color:#a51230}
.center{display:grid;place-items:center;min-height:70vh;padding:30px;text-align:center;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid #e6e9ef;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#14161c;color:#fff;padding:12px 17px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1}
.badge{display:inline-block;background:#e9f8ee;color:#15803d;border-radius:7px;padding:3px 8px;font-size:11px;font-weight:800;margin-left:6px}
.numtag{display:inline-block;background:var(--brand-s);color:var(--brand);border-radius:7px;padding:2px 7px;font-size:11px;font-weight:900;vertical-align:middle}
.remembered{background:#eef7ee;border:1px solid #cde8cd;border-radius:12px;padding:11px 13px;font-size:12px;color:#256029;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.remembered a{color:var(--brand);cursor:pointer;text-decoration:underline;margin-left:auto;white-space:nowrap;font-weight:700}
.paysel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paybtn{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid #e2e6ec;border-radius:13px;padding:14px 8px;background:#fff;font-size:14px;font-weight:800;cursor:pointer;color:#111}
.paybtn small{font-size:10px;font-weight:600;color:#98a2b3}
.paybtn.sel{border:2px solid var(--brand);background:var(--brand-s);color:var(--brand)}
.paybtn.sel small{color:var(--brand)}
/* ===== 프리미엄 홈 ===== */
.tbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;height:52px;padding:0 8px 0 16px;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.tbar b{font-size:15px;font-weight:900;letter-spacing:-.3px}
.tbar .tcart{margin-left:auto;width:40px;height:40px;border:0;background:none;font-size:19px;display:grid;place-items:center;position:relative;cursor:pointer}
.tbar .cnt{position:absolute;top:3px;right:2px;min-width:17px;height:17px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;border-radius:100px;display:grid;place-items:center;padding:0 4px}
.hero{position:relative;aspect-ratio:1/1;overflow:hidden;background:#0d0d10}
.hmedia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;display:block}
.hero iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hero.vert{aspect-ratio:auto;height:min(80vh,700px);display:flex;justify-content:center;background:#0b0b0d}
.hero.vert .hmedia{position:relative;inset:auto;height:100%;width:auto;aspect-ratio:9/16;max-width:100%;object-fit:contain}
.hgrad{background:linear-gradient(140deg,#2a2140,#ff2e50 130%)}
.hshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,transparent 30%,transparent 52%,rgba(0,0,0,.84) 100%);pointer-events:none}
.htop{position:absolute;top:14px;left:14px;z-index:3;display:flex;gap:8px}
.livep{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;font-weight:800;font-size:12px;padding:6px 11px 6px 10px;border-radius:100px;box-shadow:0 4px 14px rgba(255,46,80,.5)}
.livep i{width:7px;height:7px;border-radius:50%;background:#fff;animation:hpl 1.6s infinite}
@keyframes hpl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.hbottom{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:18px 18px 20px;color:#fff}
.htitle{font-size:22px;font-weight:900;line-height:1.28;letter-spacing:-.04em;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.hseller{display:flex;align-items:center;gap:11px;margin-top:14px}
.hav{width:46px;height:46px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;flex:0 0 auto}
.hav img{width:100%;height:100%;object-fit:cover}
.hseller b{font-size:15px;font-weight:800}.hseller small{display:block;opacity:.85;font-size:12px;margin-top:1px;font-weight:600}
.homewrap{padding-bottom:150px}
.ndet{margin:14px 16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ndet summary{list-style:none;display:flex;align-items:center;gap:9px;padding:14px 15px;font-size:13.5px;font-weight:700;cursor:pointer}
.ndet summary::-webkit-details-marker{display:none}
.ndet .chip{background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px}
.ndet .arw{margin-left:auto;color:var(--muted);transition:.2s}.ndet[open] .arw{transform:rotate(180deg)}
.ndet .nbody{padding:0 15px 15px;font-size:12.5px;line-height:1.75;color:#54545c;white-space:pre-line}
.shead{display:flex;align-items:baseline;gap:9px;padding:24px 18px 12px}
.shead h2{margin:0;font-size:17px;font-weight:900;letter-spacing:-.03em}.shead small{color:var(--muted);font-size:12px;font-weight:600}
.feat{display:block;width:calc(100% - 32px);margin:0 16px;border:0;padding:0;border-radius:18px;overflow:hidden;position:relative;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.14);cursor:pointer}
.feat img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.feat .fimg-ph{width:100%;aspect-ratio:4/3;background:#f3f3f5;display:grid;place-items:center;color:#aeb4c0;font-size:13px}
.feat .nowtag{position:absolute;top:12px;left:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;font-weight:800;font-size:11.5px;padding:6px 11px;border-radius:100px;box-shadow:0 4px 14px rgba(255,46,80,.45)}
.feat .nowtag i{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block}
.feat .fmeta{position:absolute;left:0;right:0;bottom:0;padding:36px 15px 15px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.82));color:#fff;display:flex;align-items:flex-end;gap:12px;text-align:left}
.feat .fn{font-size:16px;font-weight:800;line-height:1.3}.feat .fp{font-size:19px;font-weight:900;margin-top:4px}
.feat .fadd{margin-left:auto;flex:0 0 auto;background:#fff;color:var(--ink);font-weight:800;font-size:14px;padding:11px 17px;border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px 8px}
.pcard{border:0;background:none;text-align:left;padding:0;cursor:pointer}
.pcard .pi{position:relative;aspect-ratio:1/1;border-radius:15px;overflow:hidden;background:#f3f3f5}
.pcard .pi img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pi-ph{width:100%;height:100%;display:grid;place-items:center;color:#aeb4c0;font-size:12px}
.pcard .num{position:absolute;top:8px;left:8px;z-index:2;background:rgba(19,19,22,.72);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px}
.pcard.sold .pi:after{content:"품절";position:absolute;inset:0;background:rgba(255,255,255,.66);display:grid;place-items:center;font-weight:900;color:var(--ink);font-size:15px}
.pcard .pn{font-size:13.5px;font-weight:600;line-height:1.35;margin:9px 2px 0;color:#2a2a30;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pp{font-size:16px;font-weight:900;margin:3px 2px 0;letter-spacing:-.03em}
.cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));width:min(480px,100%);padding:0 14px;z-index:40}
.cbar button{width:100%;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:16px;padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 30px rgba(255,46,80,.36);cursor:pointer}
.cbar .cb{background:rgba(255,255,255,.24);border-radius:8px;padding:2px 9px;font-size:13px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:39}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;cursor:pointer}
.tabbar a.on{color:var(--ink)}.tabbar a i{font-size:20px;font-style:normal}
.profwrap{text-align:center;padding:0 16px 2px;margin-top:-40px;position:relative;z-index:5}
.profav{width:80px;height:80px;border-radius:50%;margin:0 auto;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.16);overflow:hidden;background:linear-gradient(135deg,#ff8fa3,#ff2e50);display:grid;place-items:center;color:#fff;font-weight:900;font-size:27px}
.profav img{width:100%;height:100%;object-fit:cover}
.profname{font-size:19px;font-weight:900;letter-spacing:-.4px;margin-top:11px}
.proftitle{font-size:14px;color:#33333a;font-weight:600;margin-top:4px;line-height:1.32}
.profsub{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:600}
.noticerow{display:flex;gap:8px;align-items:stretch;margin:18px 16px 0}
.noticerow .ndet{margin:0;flex:1}
.ytbtn2{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:0 15px;border-radius:14px;background:#ff0000;color:#fff;font-weight:800;font-size:12.5px;text-decoration:none;white-space:nowrap}
.livewatch{position:absolute;right:12px;bottom:12px;z-index:4;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:100px;text-decoration:none;backdrop-filter:blur(4px)}
.livefallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;background:linear-gradient(140deg,#2a2140,#ff2e50 135%);color:#fff}
.livefallback .lfplay{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;font-size:26px;padding-left:4px;box-shadow:0 0 0 0 rgba(255,255,255,.5);animation:hpl 1.7s infinite}
.livefallback b{font-size:18px;font-weight:800;margin-top:8px}.livefallback small{font-size:12px;opacity:.85}
.hcollapse{position:absolute;left:12px;bottom:12px;z-index:4;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:12px;font-weight:700;padding:7px 12px;border-radius:100px;backdrop-filter:blur(4px);cursor:pointer}
#infoblock.collapsed{display:none}
.ndetwrap{margin:18px 16px 0}.ndetwrap .ndet{margin:0}
.social{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin:15px 16px 2px}
.sicon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;box-shadow:0 3px 11px rgba(20,22,28,.16);transition:transform .12s}
.sicon:active{transform:scale(.9)}.sicon svg{display:block}
/* 내 주문 조회 */
.mocard{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;background:#fff;box-shadow:0 3px 12px rgba(20,22,28,.05)}
.moh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.moh small{color:var(--muted);font-size:11px;text-align:right}
.mostage{font-size:12px;font-weight:800;padding:5px 11px;border-radius:100px;white-space:nowrap}
.mobar{height:5px;background:#eef0f4;border-radius:100px;margin:12px 0 8px;overflow:hidden}
.mobar i{display:block;height:100%;background:var(--brand);border-radius:100px;transition:width .3s}
.modesc{font-size:12px;color:#6b7280;margin-bottom:2px}
.moitems{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.moi{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;color:#374151}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://qikvvqgxmquevzyykkcm.supabase.co';
const SUPA_KEY='sb_publishable_7dB61aDLDjATF2PMWnS4dw_j506tmao';
const SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false}});

// ---- 상태 ----
const SLUG=(location.pathname.match(/\/shop\/([^\/?#]+)/)||[])[1]||'';
let SHOP=null;        // get_live_shop 결과
let CART=[];          // {product_id,name,price,color,size,qty,image_url}
let VIEW='home';      // home | product | cart | form | done
let CURP=null;        // 현재 상세 상품
let SEL={color:null,size:null,qty:1};

let PAYM='현금';        // 결제방법: 현금 | 카드
let INFO_OPEN=true;   // 홈 프로필/공지/소셜 블록 펼침 여부(영상 하단 접기버튼)

const $=s=>document.querySelector(s);
const won=n=>'₩'+Number(n||0).toLocaleString();
/* 번호표 표시: 번호표(재고 tag) 또는 품번에서 숫자만 뽑아 "N번"으로. 숫자 없으면 원문 그대로 */
const numLabel=v=>{const d=String(v==null?'':v).replace(/[^0-9]/g,'');return d?parseInt(d,10)+'번':String(v==null?'':v);};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
const cartCount=()=>CART.reduce((s,x)=>s+x.qty,0);
const subtotal=()=>CART.reduce((s,x)=>s+x.price*x.qty,0);
function shipFee(){const sess=SHOP&&SHOP.session;if(!sess)return 0;if(sess.free_ship_min>0&&subtotal()>=sess.free_ship_min)return 0;return sess.ship_fee||0;}

async function load(){
  if(!SLUG){renderClosed('잘못된 주소입니다.');return;}
  try{
    const {data,error}=await SB.rpc('get_live_shop',{p_slug:SLUG});
    if(error){console.error(error);renderClosed('일시적인 오류입니다. 잠시 후 다시 시도해 주세요.');return;}
    SHOP=data;
    if(!SHOP||SHOP.status!=='open'){renderClosed();return;}
    render();
    window.addEventListener('scroll',updatePip,{passive:true});updatePip();
  }catch(e){console.error(e);renderClosed('연결에 실패했습니다. 인터넷을 확인해 주세요.');}
}
/* ---- 유튜브 라이브: 화면 넘나들어도 계속 재생되는 미니 플레이어(#app 바깥 body에 고정) ---- */
function ytEmbedUrl(v){v=(v||'').trim();if(!v)return '';
  let m=v.match(/[?&]v=([A-Za-z0-9_-]{6,})/)||v.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/)||v.match(/youtube\.com\/live\/([A-Za-z0-9_-]{6,})/)||v.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/)||v.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/);
  if(m)return 'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&mute=1&playsinline=1&rel=0&origin='+encodeURIComponent(location.origin);
  let c=v.match(/channel\/(UC[A-Za-z0-9_-]{18,})/)||v.match(/^(UC[A-Za-z0-9_-]{18,})$/);
  if(c)return 'https://www.youtube.com/embed/live_stream?channel='+c[1]+'&autoplay=1&mute=1&playsinline=1&rel=0&origin='+encodeURIComponent(location.origin);
  return '';/* @handle 등은 임베드 불가 → 채널ID/영상링크 안내 */}
/* 라이브 영상ID 추출(watch?v=/youtu.be/live/embed/shorts). 채널ID만 있으면 '' */
function ytVideoId(v){v=(v||'').trim();const m=v.match(/[?&]v=([A-Za-z0-9_-]{6,})/)||v.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/)||v.match(/youtube\.com\/live\/([A-Za-z0-9_-]{6,})/)||v.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/)||v.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/);return m?m[1]:'';}
/* ===== 라이브 히어로: 임베드 되면 인라인 재생, 막히면(153/폰라이브) 'LIVE 보기' 커버로 자동전환 ===== */
let YT_API_LOADING=false,LIVE_PLAYER=null,LIVE_OK=null,LIVE_URL='';
function loadYTApi(cb){if(window.YT&&window.YT.Player){cb();return;}
  if(!YT_API_LOADING){YT_API_LOADING=true;const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);}
  const iv=setInterval(function(){if(window.YT&&window.YT.Player){clearInterval(iv);cb();}},120);setTimeout(function(){clearInterval(iv);},9000);}
/* 라이브 플레이어는 항상 1개만 존재(API가 컨테이너로 이동·재생성) → 2중임베드(153) 원천차단.
   raw iframe은 153 나므로 videoID는 반드시 YT API 플레이어로, 채널ID만 iframe. */
function mountLive(containerId){const el=document.getElementById(containerId);if(!el)return;
  const vid=ytVideoId(LIVE_URL);
  if(!vid){const src=ytEmbedUrl(LIVE_URL);if(src)el.innerHTML='<iframe src="'+src+'" allow="autoplay; encrypted-media; picture-in-picture" frameborder="0" style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>';return;}/* 채널ID 자동라이브 */
  LIVE_OK=null;
  loadYTApi(function(){if(!document.getElementById(containerId))return;
    if(LIVE_PLAYER){try{LIVE_PLAYER.destroy();}catch(e){}LIVE_PLAYER=null;}
    try{LIVE_PLAYER=new YT.Player(containerId,{videoId:vid,
      playerVars:{autoplay:1,mute:1,playsinline:1,rel:0,modestbranding:1,origin:location.origin},
      events:{onReady:function(){LIVE_OK=true;},onError:function(){LIVE_OK=false;if(document.getElementById('livehero'))heroLiveFallback();else ytHidePip();}}});
    }catch(e){LIVE_OK=false;if(document.getElementById('livehero'))heroLiveFallback();}});}
function ensureLivePlayer(raw){LIVE_URL=(raw||'').trim();mountLive('livehero');}
function heroLiveFallback(){const box=document.getElementById('livehero');if(!box)return;
  box.outerHTML='<a class="hmedia livefallback" href="'+esc(LIVE_URL)+'" target="_blank" rel="noopener"><span class="lfplay">▶</span><b>지금 LIVE 방송 중</b><small>눌러서 유튜브에서 보기</small></a>';
  ytHidePip();}
let PIP_CLOSED=false;/* 사용자가 미니창을 닫았는지(선택지) */
function buildPipShell(){if(document.getElementById('ytfloat'))return;const d=document.createElement('div');d.id='ytfloat';d.className='mini';
  d.innerHTML=`<div class="ythead"><span class="ytlive">● LIVE</span><span style="flex:1"></span>
      <button class="ytbtn" onclick="ytToggleSize()" title="크게/작게">⤢</button>
      <button class="ytbtn" onclick="pipClose()" title="닫기">✕</button></div>
    <div class="ytbox"><div id="pipplayer"></div></div>`;
  document.body.appendChild(d);}
function ytHidePip(){const d=document.getElementById('ytfloat');if(d)d.remove();}
function ytToggleSize(){const d=document.getElementById('ytfloat');if(d)d.classList.toggle('mini');}
function pipClose(){PIP_CLOSED=true;ytHidePip();}/* 선택지: 닫으면 다시 위로 올려야 재등장 */
/* 히어로 보이면 인라인만 / 벗어나면 미니 PiP로 라이브 계속. 플레이어 1개를 이동. */
function updatePip(){const raw=SHOP&&SHOP.session&&SHOP.session.youtube;if(!ytEmbedUrl(raw))return;
  if(LIVE_OK===false){ytHidePip();return;}/* 임베드 불가 라이브 → 커버만, PiP 없음 */
  const hero=document.querySelector('.hero');
  const past=(VIEW!=='home')||!hero||(hero.getBoundingClientRect().bottom<64);
  if(!past)PIP_CLOSED=false;
  if(past&&!PIP_CLOSED){if(!document.getElementById('ytfloat')){const hb=document.getElementById('livehero');if(hb)hb.innerHTML='';buildPipShell();mountLive('pipplayer');}}
  else{if(document.getElementById('ytfloat')){ytHidePip();const hb=document.getElementById('livehero');if(hb){hb.innerHTML='';mountLive('livehero');}}}}
function renderClosed(msg){
  $('#app').innerHTML=`<div class="appbar"><b>N-LIVE</b></div>
   <div class="center"><div><div style="font-size:44px;margin-bottom:10px">🌙</div>
   <b style="color:#111;font-size:16px">${esc(msg||'지금은 방송 준비중이에요')}</b>
   <p style="margin-top:8px">방송이 시작되면 이 화면에서 바로 주문할 수 있어요.</p></div></div>`;
}

// ---- 옵션 헬퍼 ----
function realOpts(p){return (p.options||[]).filter(o=>o.color||o.size);}
function colorsOf(p){const s=[];realOpts(p).forEach(o=>{if(o.color&&!s.includes(o.color))s.push(o.color);});return s;}
function sizesOf(p){const s=[];realOpts(p).forEach(o=>{if(o.size&&!s.includes(o.size))s.push(o.size);});return s;}
function optAvail(p,color,size){const os=realOpts(p);if(!os.length)return true;const m=os.find(o=>(o.color||null)===(color||null)&&(o.size||null)===(size||null));return m?m.available:false;}
function prodSoldOut(p){const os=realOpts(p);if(!os.length)return false;return os.every(o=>!o.available);}

// ---- 렌더 ----
function render(){
  if(VIEW==='product')return renderProduct();
  if(VIEW==='cart')return renderCart();
  if(VIEW==='orders')return renderMyOrders();
  if(VIEW==='form')return renderForm();
  if(VIEW==='done')return renderDone();
  renderHome();
}
function appbar(title,back){
  return `<div class="appbar">${back?`<button class="back" onclick="${back}">‹</button>`:''}<span>${esc(title)}</span>
   <button class="cart" onclick="go('cart')">🛒 ${cartCount()}</button></div>`;
}
/* 히어로 영상: 방송중=유튜브 라이브 인라인 / 평소=고정 mp4 루프 / 없으면 커버·그라데 */
function ytLoopUrl(v){const e=ytEmbedUrl(v);if(!e)return '';const id=(e.match(/embed\/([A-Za-z0-9_-]+)/)||[])[1];return e.replace('rel=0','loop=1&controls=0&modestbranding=1&rel=0')+(id?('&playlist='+id):'');}
function heroHtml(s){
  const live=ytEmbedUrl(s.youtube),hv=(s.hero_video||'').trim(),hvYt=ytLoopUrl(hv);
  const vert=/\/shorts\//.test(s.youtube||'')||/\/shorts\//.test(hv)||/vert|9x16|_v\./i.test(hv);/* 세로(쇼츠) 영상 */
  let media;
  if(live)media=`<div class="hmedia" id="livehero"></div>`;/* 방송중 라이브: ensureLivePlayer가 채움(실패시 커버로 전환) */
  else if(hvYt)media=`<iframe class="hmedia" src="${hvYt}" allow="autoplay; encrypted-media" frameborder="0"></iframe>`;/* 평소 고정영상=유튜브 루프 */
  else if(hv)media=`<video class="hmedia" src="${esc(hv)}" autoplay muted loop playsinline></video>`;/* 평소 고정영상=mp4 */
  else if(s.cover_url)media=`<img class="hmedia" src="${esc(s.cover_url)}">`;
  else media=`<div class="hmedia hgrad"></div>`;
  return `<div class="hero${vert?' vert':''}">${media}<div class="hshade"></div>
    <div class="htop">${live?'<span class="livep"><i></i> LIVE</span>':''}</div>
    <button class="hcollapse" id="infoToggle" onclick="toggleInfo()">${INFO_OPEN?'정보 접기 ▾':'정보 펼치기 ▴'}</button>
    ${live?`<a class="livewatch" href="${esc((s.youtube||'').trim())}" target="_blank" rel="noopener">유튜브에서 보기 ↗</a>`:''}</div>`;
}
function renderHome(){
  const s=SHOP.session,ps=SHOP.products||[];
  const nowP=ps.find(p=>p.is_now&&!prodSoldOut(p));
  const live=!!ytEmbedUrl(s.youtube);
  const ytLink=live?s.youtube:(ytEmbedUrl(s.hero_video)?s.hero_video:'');
  const noticeTxt=s.notice||`🚚 배송비 ${won(s.ship_fee)}${s.free_ship_min>0?` · ${won(s.free_ship_min)} 이상 무료배송`:''}\n주문 후 직원이 계좌이체 안내 또는 결제링크를 보내드립니다.`;
  const nm=s.display_name||s.seller||'N-LIVE';/* 고객 노출명: 표시명 우선(내부 seller 노출 안 함) */
  const tagline=(s.title&&nm&&s.title.indexOf(nm)<0)?s.title:'';/* 채널명 중복 방지 */
  const prof=`<div class="profwrap"><div class="profav">${s.seller_photo?`<img src="${esc(s.seller_photo)}">`:esc(nm[0])}</div>
    <div class="profname">${esc(nm)}</div>${tagline?`<div class="proftitle">${esc(tagline)}</div>`:''}
    <div class="profsub">상품 ${ps.length}개 · ${live?'🔴 실시간 방송중':'판매중'}</div></div>`;
  const notice=`<div class="ndetwrap"><details class="ndet"><summary><span class="chip">공지</span>배송 · 교환/반품 안내<span class="arw">▾</span></summary><div class="nbody">${esc(noticeTxt)}</div></details></div>${socialLinks(s,ytLink)}`;
  const feat=nowP?`<div class="shead"><h2>${live?'🔴 지금 소개중':'⭐ 대표 상품'}</h2><small>${live?'방송에서 소개 중':'추천 상품'}</small></div>
    <button class="feat" onclick="openProduct(${nowP.id})">${live?'<span class="nowtag"><i></i> LIVE 소개중</span>':''}
      ${nowP.image_url?`<img src="${esc(nowP.image_url)}">`:`<div class="fimg-ph">상품이미지</div>`}
      <div class="fmeta"><div><div class="fn">${esc(nowP.name)}</div><div class="fp">${won(nowP.live_price)}</div></div><span class="fadd">담기</span></div></button>`:'';
  const grid=ps.length?`<div class="shead"><h2>전체 상품</h2><small>${ps.length}</small></div>
   <div class="grid2">${ps.map(p=>{const so=prodSoldOut(p);
     return `<button class="pcard ${so?'sold':''}" ${so?'disabled':`onclick="openProduct(${p.id})"`}>
       <div class="pi">${(p.tag||p.code)?`<span class="num">${esc(numLabel(p.tag||p.code))}</span>`:''}${p.image_url?`<img src="${esc(p.image_url)}">`:`<div class="pi-ph">상품이미지</div>`}</div>
       <div class="pn">${esc(p.name)}</div><div class="pp">${won(p.live_price)}</div></button>`;}).join('')}</div>`
   :`<div class="center" style="min-height:180px">등록된 상품이 곧 올라옵니다.</div>`;
  $('#app').innerHTML=
    heroHtml(s)
    +`<div id="infoblock"${INFO_OPEN?'':' class="collapsed"'}>${prof}${notice}</div>`
    +`<div class="homewrap">${feat}${grid}</div>`
    +(cartCount()?`<div class="cbar"><button onclick="go('cart')">🛒 장바구니 보기 <span class="cb">${cartCount()}개 · ${won(subtotal()+shipFee())}</span></button></div>`:'')
    +`<div class="tabbar"><a class="on"><i>🏠</i>홈</a><a onclick="go('orders')"><i>📦</i>내주문</a><a onclick="go('cart')"><i>🛒</i>장바구니</a><a onclick="contactKakao()"><i>💬</i>문의</a></div>`;
  if(live&&!document.getElementById('ytfloat'))ensureLivePlayer(s.youtube);
  updatePip();
}
/* 셀러 SNS/카톡 공식 아이콘 바로가기 (공지 아래) */
const _SVG={
  yt:'<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 4.9 12 4.9 12 4.9s-7 0-8.9.5A3 3 0 0 0 1 7.5 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.5a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5A3 3 0 0 0 23 16.5 31 31 0 0 0 23.5 12 31 31 0 0 0 23 7.5zM9.75 15.5v-7l6 3.5-6 3.5z"/></svg>',

};
function socialLinks(s,ytLink){
  const it=[];
  if(ytLink)it.push({u:ytLink,bg:'#FF0000',fg:'#fff',n:'YouTube',s:_SVG.yt});
  if(s.sns_instagram)it.push({u:s.sns_instagram,bg:'linear-gradient(45deg,#f9ce34,#ee2a7b 45%,#6228d7)',fg:'#fff',n:'Instagram',s:_SVG.ig});
  if(s.sns_tiktok)it.push({u:s.sns_tiktok,bg:'#111',fg:'#fff',n:'TikTok',s:_SVG.tt});
  if(s.kakao_url)it.push({u:s.kakao_url,bg:'#FEE500',fg:'#191600',n:'카카오톡',s:_SVG.ka});
  if(s.band_url)it.push({u:s.band_url,bg:'#03C75A',fg:'#fff',n:'네이버 밴드',s:_SVG.bd});
  if(!it.length)return '';
  return `<div class="social">${it.map(i=>`<a class="sicon" style="background:${i.bg};color:${i.fg}" href="${esc(i.u)}" target="_blank" rel="noopener" aria-label="${esc(i.n)}" title="${esc(i.n)}">${i.s}</a>`).join('')}</div>`;
}
function contactKakao(){const u=SHOP&&SHOP.session&&SHOP.session.kakao_url;if(u){window.open(u,'_blank','noopener');}else{toast('문의는 방송 채팅이나 카톡 채널로 남겨주세요 🙏');}}
function toggleInfo(){INFO_OPEN=!INFO_OPEN;const b=document.getElementById('infoblock');if(b)b.classList.toggle('collapsed',!INFO_OPEN);const t=document.getElementById('infoToggle');if(t)t.textContent=INFO_OPEN?'정보 접기 ▾':'정보 펼치기 ▴';}
/* ===== 내 주문 조회 (ERP 상태 실시간 연동) ===== */
const MO_STAGES=[
  {t:'입금 확인중',c:'#b45309',bg:'#fff7ed',d:'입금이 확인되면 상품 준비를 시작해요.'},
  {t:'상품 준비중',c:'#1d4ed8',bg:'#eff6ff',d:'주문하신 상품을 준비하고 있어요.'},
  {t:'출고 대기',c:'#7c3aed',bg:'#f5f3ff',d:'포장이 끝났어요 · 곧 발송됩니다.'},
  {t:'송장 등록됨',c:'#0e7490',bg:'#ecfeff',d:'운송장이 등록됐어요 · 곧 택배사로 넘어가요.'},
  {t:'발송 완료',c:'#15803d',bg:'#f0fdf4',d:'택배사로 발송됐어요 · 배송조회로 확인하세요.'}
];
function renderMyOrders(){
  $('#app').innerHTML=appbar('내 주문 조회',"go('home')")+
    `<div class="sec">
      <div class="field"><label>주문하신 휴대폰번호로 조회</label>
        <div style="display:flex;gap:8px">
          <input id="mo_phone" inputmode="numeric" value="${esc(CUST.phone||'')}" placeholder="010-0000-0000" style="flex:1">
          <button class="cta" style="width:auto;padding:0 22px;font-size:15px;box-shadow:none" onclick="lookupOrders()">조회</button>
        </div></div>
      <div id="mo_list"></div>
     </div>`;
  if(CUST.phone&&CUST.phone.replace(/[^0-9]/g,'').length>=9)lookupOrders();
}
async function lookupOrders(){
  const el=$('#mo_phone');const ph=(el?el.value:(CUST.phone||'')).trim();
  if(ph.replace(/[^0-9]/g,'').length<9){toast('휴대폰번호를 정확히 입력해 주세요.');return;}
  CUST.phone=ph;const box=$('#mo_list');if(box)box.innerHTML='<div class="center" style="min-height:130px"><div class="spinner"></div></div>';
  try{
    const {data,error}=await SB.rpc('get_my_orders',{p_slug:SLUG,p_phone:ph});
    if(error||!data||!data.ok){if(box)box.innerHTML='<div class="center" style="min-height:130px">조회 중 문제가 생겼어요.<br>잠시 후 다시 시도해 주세요.</div>';return;}
    const os=data.orders||[];
    if(!os.length){if(box)box.innerHTML='<div class="center" style="min-height:150px"><div><div style="font-size:38px;margin-bottom:8px">📦</div>이 번호로 접수된 주문이 없어요.</div></div>';return;}
    if(box)box.innerHTML=`<div style="font-size:12.5px;color:var(--muted);margin:4px 0 12px;font-weight:600">최근 주문 ${os.length}건</div>`+os.map(orderCard).join('');
  }catch(e){console.error(e);if(box)box.innerHTML='<div class="center" style="min-height:130px">연결 오류입니다. 인터넷을 확인해 주세요.</div>';}
}
function orderCard(o){
  const st=MO_STAGES[o.stage]||MO_STAGES[1];
  const items=(o.items||[]).map(it=>`<div class="moi"><span>${esc(it.name)}${(it.color||it.size)?` <small>${esc([it.color,it.size].filter(Boolean).join('/'))}</small>`:''}</span><b>${it.qty}개</b></div>`).join('');
  return `<div class="mocard">
    <div class="moh"><span class="mostage" style="color:${st.c};background:${st.bg}">${st.t}</span><small>${esc(o.order_date||'')}<br>${esc(o.group_id||'')}</small></div>
    <div class="mobar"><i style="width:${o.stage/4*100}%"></i></div>
    <div class="modesc">${st.d}</div>
    <div class="moitems">${items}</div>
    <div class="moft"><b>${won(o.amount)}</b>${o.track?`<button class="motrk" onclick="trackShip('${esc(o.track)}')">🚚 배송조회</button>`:''}</div>
  </div>`;
}
function trackShip(t){const n=String(t||'').replace(/[^0-9]/g,'');if(!n){toast('운송장 번호가 아직 없어요.');return;}
  window.open('https://trace.cjlogistics.com/next/tracking.html?wblNo='+n,'_blank','noopener');}
function openProduct(id){CURP=(SHOP.products||[]).find(p=>p.id===id);if(!CURP)return;
  const cs=colorsOf(CURP),zs=sizesOf(CURP);
  SEL={color:cs.length?null:'',size:zs.length?null:'',qty:1};go('product');}
function renderProduct(){
  const p=CURP,cs=colorsOf(p),zs=sizesOf(p);
  const colorBtns=cs.length?`<label>색상</label><div class="opts">${cs.map(c=>{
    const anyAvail=zs.length?zs.some(z=>optAvail(p,c,z)):optAvail(p,c,'');
    return `<button class="opt ${SEL.color===c?'sel':''} ${anyAvail?'':'off'}" ${anyAvail?`onclick="pickColor('${esc(c)}')"`:'disabled'}>${esc(c)}</button>`;}).join('')}</div>`:'';
  const sizeBtns=zs.length?`<label>사이즈</label><div class="opts">${zs.map(z=>{
    const av=optAvail(p,SEL.color,z)&&(cs.length?SEL.color!=null:true);
    return `<button class="opt ${SEL.size===z?'sel':''} ${av?'':'off'}" ${av?`onclick="pickSize('${esc(z)}')"`:'disabled'}>${esc(z)}</button>`;}).join('')}</div>`:'';
  const ready=(!cs.length||SEL.color!=null)&&(!zs.length||SEL.size!=null);
  $('#app').innerHTML=appbar('상품 선택',"go('home')")+
    `${p.image_url?`<img class="detimg" src="${esc(p.image_url)}" onclick="shopZoom('${esc(p.image_url)}')" title="눌러서 크게 보기">`:`<div class="pimg" style="max-width:260px;margin:0 auto">상품이미지</div>`}
     <div class="sec">${(p.tag||p.code)?`<span class="numtag">${esc(numLabel(p.tag||p.code))}</span> `:''}<b style="font-size:17px">${esc(p.name)}</b>
       <div class="price" style="font-size:20px;margin:8px 0 4px">${won(p.live_price)}</div>
       ${colorBtns}${sizeBtns}
       <label style="display:block;font-size:12px;color:#475467;font-weight:750;margin:14px 0 6px">수량</label>
       <div class="qtybox"><button onclick="qc(-1)">−</button><span id="qn">${SEL.qty}</span><button onclick="qc(1)">＋</button></div>
     </div>
     <div class="foot"><button class="cta" id="addBtn" ${ready?'':'disabled'} onclick="addCart()">
       ${ready?`장바구니 담기 · ${won(p.live_price*SEL.qty)}`:'옵션을 선택해 주세요'}</button></div>`;
}
function pickColor(c){SEL.color=c;const zs=sizesOf(CURP);if(zs.length)SEL.size=null;render();}
function pickSize(z){SEL.size=z;render();}
function qc(d){const p=CURP;let q=SEL.qty+d;if(q<1)q=1;if(p.max_qty>0&&q>p.max_qty){q=p.max_qty;toast('최대 '+p.max_qty+'개까지 구매 가능합니다.');}SEL.qty=q;
  const el=$('#qn');if(el)el.textContent=q;const b=$('#addBtn');if(b&&!b.disabled)b.textContent='장바구니 담기 · '+won(p.live_price*q);}
function addCart(){const p=CURP;
  if(!optAvail(p,SEL.color,SEL.size)){toast('선택하신 옵션은 품절입니다.');return;}
  const ex=CART.find(x=>x.product_id===p.id&&x.color===(SEL.color||'')&&x.size===(SEL.size||''));
  if(ex)ex.qty+=SEL.qty;else CART.push({product_id:p.id,name:p.name,price:p.live_price,color:SEL.color||'',size:SEL.size||'',qty:SEL.qty,image_url:p.image_url||''});
  toast('장바구니에 담았어요');go('home');}
function renderCart(){
  if(!CART.length){$('#app').innerHTML=appbar('장바구니',"go('home')")+`<div class="center">🛒 장바구니가 비어있어요<br><br><button class="cta ghost" style="width:auto;padding:12px 20px" onclick="go('home')">상품 보러가기</button></div>`;return;}
  const rows=CART.map((x,i)=>{const img=x.image_url?`style="background-image:url('${esc(x.image_url)}')"`:'';
    return `<div class="cartrow"><div class="cthumb" ${img}></div>
      <div class="ci"><b>${esc(x.name)}</b><small>${esc([x.color,x.size].filter(Boolean).join(' / ')||'옵션없음')}</small>
        <div class="qtybox" style="padding:5px 11px;font-size:13px"><button onclick="cqc(${i},-1)">−</button><span>${x.qty}</span><button onclick="cqc(${i},1)">＋</button></div></div>
      <div style="text-align:right"><b>${won(x.price*x.qty)}</b><br><button class="rm" onclick="rmCart(${i})">✕</button></div></div>`;}).join('');
  const sf=shipFee();
  $('#app').innerHTML=appbar('장바구니',"go('home')")+
    `<div class="sec">${rows}
      <div class="sum"><div><span>상품금액</span><b>${won(subtotal())}</b></div>
        <div><span>배송비</span><b>${sf?won(sf):'무료'}</b></div>
        <div class="total"><span>결제예정금액</span><span>${won(subtotal()+sf)}</span></div></div></div>
     <div class="foot"><button class="cta" onclick="go('form')">주문 정보 입력</button></div>`;
}
function cqc(i,d){CART[i].qty+=d;if(CART[i].qty<1)CART[i].qty=1;render();}
function rmCart(i){CART.splice(i,1);render();}
function renderForm(){
  const sf=shipFee();
  const remembered=CUST.phone&&CUST.receiver?`<div class="remembered">👋 <b>${esc(CUST.receiver)}</b>님, 저장된 정보로 채웠어요.<a onclick="clearRemembered()">다른 사람으로 주문</a></div>`:'';
  $('#app').innerHTML=appbar('주문 정보',"go('cart')")+
    `<div class="sec field">
      ${remembered}
      <label>카카오톡 닉네임 (선택)</label><input id="f_nick" value="${esc(CUST.nick)}" placeholder="방송 채팅 닉네임">
      <div class="row2"><div><label>받는 분 *</label><input id="f_recv" value="${esc(CUST.receiver)}" placeholder="성함"></div>
        <div><label>휴대폰번호 *</label><input id="f_phone" value="${esc(CUST.phone)}" inputmode="numeric" placeholder="010-0000-0000"></div></div>
      <label>배송지 *</label><input id="f_addr" value="${esc(CUST.addr)}" placeholder="도로명/지번 주소">
      <label>상세주소</label><input id="f_addr2" value="${esc(CUST.addr_detail)}" placeholder="동/호수 등">
      <label style="display:block;font-size:12px;color:#475467;font-weight:750;margin:14px 0 6px">결제 방법 *</label>
      <div class="paysel">
        <button type="button" class="paybtn ${PAYM==='현금'?'sel':''}" onclick="setPay('현금')">💵 현금(계좌이체)<small>계좌번호를 바로 안내</small></button>
        <button type="button" class="paybtn ${PAYM==='카드'?'sel':''}" onclick="setPay('카드')">💳 카드<small>직원이 결제링크 발송</small></button>
      </div>
      <label class="agree"><input type="checkbox" id="f_agree" ${CUST.agree?'checked':''}>
        <span>주문 처리 및 배송을 위한 개인정보 수집·이용, 교환·반품 정책에 동의합니다. (필수)</span></label>
      <div class="sum" style="margin-top:6px"><div><span>상품금액</span><b>${won(subtotal())}</b></div>
        ${PAYM==='카드'?`<div style="color:#b45309"><span>카드결제 추가(10%)</span><b>${won(Math.round(subtotal()*0.1))}</b></div>`:''}
        <div><span>배송비</span><b>${sf?won(sf):'무료'}</b></div>
        <div class="total"><span>주문금액</span><span>${won(subtotal()+(PAYM==='카드'?Math.round(subtotal()*0.1):0)+sf)}</span></div></div>
      <p style="font-size:12px;color:#98a2b3;line-height:1.6">같은 방송에서 여러 번 주문하면 <b>배송비는 한 번만</b> 붙고 무료배송 기준도 합산돼요. ${PAYM==='현금'?'현금 선택 시 주문 완료 화면에 계좌번호가 안내됩니다.':'💳 카드결제는 <b>상품금액의 10%가 추가</b>되며, 직원이 결제링크(페이히어)를 보내드립니다.'}</p>
     </div>
     <div class="foot"><button class="cta green" id="orderBtn" onclick="submitOrder()">주문하기</button></div>`;
}
function grabForm(){const g=id=>{const e=$('#'+id);return e?e.value.trim():'';};CUST.nick=g('f_nick');CUST.receiver=g('f_recv');CUST.phone=g('f_phone');
  CUST.addr=g('f_addr');CUST.addr_detail=g('f_addr2');const a=$('#f_agree');CUST.agree=a?a.checked:CUST.agree;}
function setPay(v){grabForm();PAYM=v;render();}
async function submitOrder(){
  grabForm();
  if(!CUST.receiver){toast('받는 분 성함을 입력해 주세요.');return;}
  if(CUST.phone.replace(/[^0-9]/g,'').length<9){toast('휴대폰번호를 정확히 입력해 주세요.');return;}
  if(!CUST.addr){toast('배송지를 입력해 주세요.');return;}
  if(!CUST.agree){toast('개인정보 수집·구매 동의가 필요합니다.');return;}
  const btn=$('#orderBtn');btn.disabled=true;btn.textContent='주문 처리 중...';
  try{
    const items=CART.map(x=>({product_id:x.product_id,color:x.color,size:x.size,qty:x.qty}));
    const {data,error}=await SB.rpc('create_live_order',{p_slug:SLUG,
      p_customer:{receiver:CUST.receiver,nick:CUST.nick,phone:CUST.phone,addr:CUST.addr,addr_detail:CUST.addr_detail,agree:true,paymethod:PAYM},
      p_items:items});
    if(error){console.error(error);toast('주문 저장에 실패했습니다. 다시 시도해 주세요.');btn.disabled=false;btn.textContent='주문하기';return;}
    if(!data||!data.ok){toast((data&&data.msg)||'주문을 완료할 수 없습니다.');btn.disabled=false;btn.textContent='주문하기';
      if(data&&(data.reason==='soldout'||data.reason==='bad_option'||data.reason==='bad_item'))await load();return;}
    try{localStorage.setItem('nlive_cust',JSON.stringify({receiver:CUST.receiver,nick:CUST.nick,phone:CUST.phone,addr:CUST.addr,addr_detail:CUST.addr_detail}));}catch(e){}
    DONE=data;CART=[];go('done');
  }catch(e){console.error(e);toast('연결 오류입니다. 인터넷을 확인해 주세요.');btn.disabled=false;btn.textContent='주문하기';}
}
function clearRemembered(){try{localStorage.removeItem('nlive_cust');}catch(e){}CUST={receiver:'',nick:'',phone:'',addr:'',addr_detail:'',agree:false};render();toast('저장된 정보를 지웠어요');}
function renderDone(){
  const d=DONE;
  $('#app').innerHTML=appbar((SHOP.session.seller||'N')+' SHOP')+
    `<div class="success"><div class="check">✓</div><h3>주문이 접수됐어요</h3>
      <p>담당 직원이 확인 후<br>계좌이체 안내 또는 결제링크를 보내드립니다.</p>
      <div class="orderbox">
        <div><span>주문번호</span><b>${esc(d.order_group_id)}</b></div>
        <div><span>상품금액</span><b>${won(d.subtotal)}</b></div>
        <div><span>배송비</span><b>${d.ship_fee?won(d.ship_fee):'무료'}</b></div>
        <div style="border-top:1px solid var(--line);margin-top:4px;padding-top:9px"><span style="font-weight:800">주문금액</span><b style="font-size:16px">${won(d.total)}</b></div>
      </div>
      ${d.paymethod==='카드'?`<div class="paynote">💳 <b>카드 결제 안내</b><br>
        · 담당 직원이 <b>페이히어 결제링크</b>를 방송 채팅/카톡으로 보내드립니다.<br>
        · 링크로 결제하시면 상품 준비·발송이 시작됩니다.<br>
        · <b>입금(결제) 순서대로</b> 재고가 배정돼요. 조금만 기다려주세요!</div>`
       :`<div class="paynote">💵 <b>계좌이체 안내</b>${d.pay_info?`<div style="background:#fff;border:1px solid #cfe0ff;border-radius:8px;padding:10px;margin:8px 0;font-size:14px;font-weight:800;color:#111;text-align:center">${esc(d.pay_info)}</div>`:'<br>· 방송 채팅/카톡으로 계좌번호를 안내드립니다.<br>'}
        · 위 <b>주문금액 ${won(d.total)}</b>을 입금해 주세요. (여러 번 주문하셨으면 <b>합계 한 번에</b>)<br>
        · <b>입금 확인 순서대로</b> 재고가 배정됩니다. 빠른 입금 부탁드려요!</div>`}
      <button class="cta ghost" style="margin-top:20px" onclick="CART=[];DONE=null;go('home')">쇼핑 계속하기</button>
     </div>`;
}
function shopZoom(url){if(!url)return;let o=document.getElementById('zoomOv');if(!o){o=document.createElement('div');o.id='zoomOv';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);display:grid;place-items:center;z-index:9999;cursor:zoom-out;padding:12px';o.onclick=function(){o.style.display='none';};o.innerHTML='<img style="max-width:96vw;max-height:96vh;border-radius:8px">';document.body.appendChild(o);}o.querySelector('img').src=url;o.style.display='grid';}
function go(v){VIEW=v;window.scrollTo(0,0);render();updatePip();}
window.openProduct=openProduct;window.pickColor=pickColor;window.pickSize=pickSize;window.qc=qc;window.addCart=addCart;
window.cqc=cqc;window.rmCart=rmCart;window.submitOrder=submitOrder;window.go=go;window.clearRemembered=clearRemembered;window.setPay=setPay;window.shopZoom=shopZoom;window.ytToggleSize=ytToggleSize;window.pipClose=pipClose;
window.contactKakao=contactKakao;window.lookupOrders=lookupOrders;window.trackShip=trackShip;window.toggleInfo=toggleInfo;
try{const c=JSON.parse(localStorage.getItem('nlive_cust')||'null');if(c&&c.phone){CUST={...CUST,...c,agree:false};}}catch(e){}
load();
</script>
</body>
</html>
