<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>주문 페이지가 옮겨졌어요</title>
<!--
  ⚠️ 2026-08-15 — 이 파일은 더 이상 진짜 SHOP 이 아니다.

  예전에는 여기에 SHOP 사본(2026-07-18)이 들어 있었고,
  next.config.mjs 의 rewrite 가 /shop/:seller 를 이 파일로 띄우고 있었다.
  그런데 그 사본은 **옛 DB(qikvvqgxmquevzyykkcm)** 를 보고 있어서,
  이 주소로 들어온 손님이 주문하면 지금 ERP 에 안 들어왔다. 주문이 통째로 샜다.

  그래서
    · next.config.mjs 에서 rewrite 를 걷어내고 308 redirect 로 바꿨다
    · 이 파일은 사본을 지우고 **안내 + 자동 이동** 만 남긴다
      (혹시 리다이렉트가 걸리지 않는 경로로 들어와도 옛 화면은 절대 안 뜨게)

  ⛔ 여기에 SHOP 사본을 다시 넣지 말 것. 진짜 SHOP 은 아래 한 곳뿐이다.
     https://nlive.labangerp.com/shop/:seller   (labangerp-demo-site/shop.html)
-->
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#fafbfc;color:#111}
  .box{max-width:380px;width:100%;text-align:center;background:#fff;border:1px solid #e8ebef;
    border-radius:18px;padding:34px 24px 28px;box-shadow:0 6px 24px rgba(16,24,40,.06)}
  .ic{font-size:40px;line-height:1}
  h1{font-size:18px;margin:14px 0 8px;letter-spacing:-.3px}
  p{margin:0;font-size:14px;line-height:1.7;color:#5b6472}
  a.go{display:block;margin-top:20px;background:#ff2e50;color:#fff;text-decoration:none;
    font-weight:800;font-size:15px;padding:15px;border-radius:12px}
  .sm{margin-top:12px;font-size:12px;color:#98a2b3}
</style>
</head>
<body>
  <div class="box">
    <div class="ic">🛍️</div>
    <h1>주문 페이지가 옮겨졌어요</h1>
    <p>잠시 후 새 주문 페이지로 이동합니다.<br>바로 안 넘어가면 아래를 눌러주세요.</p>
    <a class="go" id="go" href="https://nlive.labangerp.com/shop/">새 주문 페이지로 이동</a>
    <div class="sm">nlive.labangerp.com</div>
  </div>
<script>
(function(){
  /* 주소에서 셀러 이름을 뽑아 그 셀러의 주문 페이지로 그대로 보낸다.
     /shop/yeonsi/ · /shop/yeonsi · /link/yeonsi 전부 처리한다. */
  var m = location.pathname.match(/\/(shop|link)\/([^\/?#]+)/);
  var kind = (m && m[1]) || 'shop';
  var seller = (m && m[2]) ? decodeURIComponent(m[2]) : '';
  var url = 'https://nlive.labangerp.com/' + kind + (seller ? ('/' + encodeURIComponent(seller)) : '/')
          + (location.search || '') + (location.hash || '');
  var a = document.getElementById('go');
  if (a) a.href = url;
  /* 뒤로가기로 이 페이지에 갇히지 않게 replace 로 넘긴다 */
  setTimeout(function(){ try{ location.replace(url); }catch(e){ location.href = url; } }, 400);
})();
</script>
</body>
</html>
