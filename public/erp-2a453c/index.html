<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N-LIVE ERP (견본 v4)</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
<style>
  .grid-stack{background:transparent;margin:0 -6px}
  .grid-stack-item-content{inset:0;overflow:hidden;border-radius:16px;display:flex}
  .grid-stack-item-content>.card,.grid-stack-item-content>.kpi{height:100%!important;width:100%;margin:0!important;min-height:0!important;box-sizing:border-box;overflow:auto}
  .grid-stack-item-content>.card{display:flex;flex-direction:column}
  .grid-stack-item-content>.card>.card-h{position:sticky;top:0;background:#fff;z-index:2;padding-top:1px}
  .grid-stack>.grid-stack-item>.ui-resizable-se{filter:none;width:18px;height:18px}
  .grid-stack-item .ui-resizable-handle{opacity:0;transition:opacity .15s}
  .grid-stack-item:hover .ui-resizable-handle{opacity:.55}
  .grid-stack-item-content>.wx{position:absolute;top:7px;right:9px;z-index:6;width:22px;height:22px;border:none;background:rgba(148,163,184,.18);color:#64748b;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;padding:0;opacity:0;transition:opacity .15s}
  .grid-stack-item:hover>.grid-stack-item-content>.wx{opacity:1}
  .grid-stack-item-content>.wx:hover{background:#fee2e2;color:#ef4444}
  .grid-stack-item-content::-webkit-scrollbar{width:6px;height:6px}
  .grid-stack-item-content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
  .gs-anim{transition:opacity .2s}
  .dash-tip{font-size:11.5px;color:#94a3b8;margin:0 0 8px 2px}
</style>
<style>
  :root{
    --navy:#1e2a4a; --navy2:#16203a; --navyhi:rgba(255,255,255,.09);
    --blue:#2563eb; --blue-d:#1d4ed8; --blue-s:#eaf1ff;
    --green:#16a34a; --green-s:#e7f6ec; --purple:#7c3aed; --purple-s:#f1ebfe;
    --amber:#ea8a0c; --amber-s:#fdf0db; --red:#dc2626; --red-s:#fdeaea;
    --ink:#0f172a; --gray:#64748b; --gray2:#94a3b8; --line:#e8edf3; --bg:#f4f6fb; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  .side{width:230px;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  .brand{padding:22px 22px 18px;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.5px}
  .brand .dot{color:#60a5fa}
  .brand small{display:block;font-size:10px;font-weight:500;color:var(--gray2);margin-top:3px}
  .nav{flex:1;padding:6px 12px;overflow-y:auto}
  .nav .sec{font-size:10px;color:#64748b;padding:14px 10px 6px;letter-spacing:1px;font-weight:700}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px;color:#cbd5e1;cursor:pointer;margin-bottom:2px;font-family:inherit;transition:.15s}
  .nav button:hover{background:var(--navyhi);color:#fff}
  .nav button.on{background:#fff;color:var(--navy);font-weight:700}
  .nav .ic{font-size:16px;width:20px;text-align:center}
  .side .foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
  .side .foot .lab{font-size:10px;color:#64748b;margin-bottom:5px}
  .side select{width:100%;font-size:12px;background:var(--navyhi);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 9px}
  .side select option{color:#000}
  .ver{font-size:10px;color:#475569;margin-top:10px;text-align:center}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:20}
  .search{flex:1;max-width:440px;position:relative}
  .search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 36px;font-size:13px}
  .search:before{content:'🔍';position:absolute;left:12px;top:9px;font-size:13px;opacity:.5}
  .tb-icons{display:flex;align-items:center;gap:18px;margin-left:auto}
  .tb-ic{position:relative;font-size:18px;cursor:pointer;opacity:.7}
  .tb-ic .bdg{position:absolute;top:-7px;right:-8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px}
  .tb-user{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid var(--line)}
  .tb-user .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .tb-user .nm{font-weight:700;font-size:13px}
  .tb-user .rl{font-size:11px;color:var(--gray)}
  .main{padding:24px 26px;max-width:1760px;width:100%}
  .greet{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
  .greet h1{font-size:23px;letter-spacing:-.6px}
  .greet h1 b{color:var(--blue)}
  .greet p{color:var(--gray);font-size:12.5px;margin-top:6px}
  .datebox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600}
  .head{margin-bottom:18px}
  .head h1{font-size:21px;letter-spacing:-.5px}
  .head p{color:var(--gray);font-size:12.5px;margin-top:5px}
  .badge{display:inline-block;background:var(--amber-s);color:var(--amber);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;vertical-align:middle;margin-left:6px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:0 1px 2px rgba(15,23,42,.03);min-height:124px}
  .kpi .lab{font-size:12.5px;color:var(--gray);margin-bottom:10px}
  .kpi .num{font-size:25px;font-weight:800;letter-spacing:-1px}
  .kpi .sub{font-size:12px;margin-top:8px;font-weight:600}
  .kpi .ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
  .ic-b{background:var(--blue-s)} .ic-g{background:var(--green-s)} .ic-p{background:var(--purple-s)} .ic-a{background:var(--amber-s)} .ic-r{background:var(--red-s)}
  .up{color:var(--green)} .down{color:var(--red)} .warn{color:var(--amber)}
  .row{display:grid;gap:16px;margin-bottom:18px}
  .row.r-2-1{grid-template-columns:2fr 1fr}
  .row.r-3{grid-template-columns:repeat(3,1fr)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
  .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .card-h h2{font-size:15px;letter-spacing:-.3px}
  .card-h .more{font-size:12px;color:var(--gray);cursor:pointer}
  .alist{display:flex;flex-direction:column;gap:2px}
  .ai{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f1f5f9;font-size:13px}
  .ai:last-child{border:0}
  .tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0}
  .t-b{background:var(--blue-s);color:var(--blue)} .t-g{background:var(--green-s);color:var(--green)}
  .t-a{background:var(--amber-s);color:var(--amber)} .t-p{background:var(--purple-s);color:var(--purple)} .t-r{background:var(--red-s);color:var(--red)}
  .ai .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ai .dt{font-size:11px;color:var(--gray2)}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .qi{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:12px;cursor:pointer;transition:.15s;border:1px solid transparent}
  .qi:hover{background:var(--blue-s);border-color:#dbe6ff}
  .qi .qic{width:42px;height:42px;border-radius:12px;background:var(--blue-s);display:flex;align-items:center;justify-content:center;font-size:20px}
  .qi span{font-size:12px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--gray);font-weight:600;font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 12px;border-bottom:1px solid #f1f5f9;word-break:break-word;overflow-wrap:anywhere}
  td.num-cell{white-space:nowrap}
  .card,.ord-card,.sg-card,.kpi{min-width:0}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#fafcff}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;background:#eef2f7;color:#475569}
  .p-miss{background:var(--amber-s);color:var(--amber)} .p-req{background:var(--blue-s);color:var(--blue)}
  .p-done{background:var(--green-s);color:var(--green)} .p-low{background:var(--red-s);color:var(--red)}
  .p-gray{background:#eef1f6;color:#475569} .p-purple{background:#f1ebfe;color:#6d28d9}
  .tagbox{display:inline-flex;align-items:center;gap:4px;background:#fef3c7;color:#92500a;border:1px solid #fcd34d;font-weight:800;font-size:13px;padding:4px 10px;border-radius:8px;font-family:'Courier New',monospace;letter-spacing:.5px}
  .stock-low{color:var(--red);font-weight:800} .stock-ok{font-weight:700}
  .muted{color:var(--gray)} .barcode{font-family:'Courier New',monospace;letter-spacing:.5px}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  input,select{font-family:inherit;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff}
  input:focus,select:focus{border-color:var(--blue)}
  .btn{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid #bdd3ff}
  .btn.gray{background:#fff;color:var(--gray);border:1.5px solid var(--line)}
  .btn.red{background:#fff;color:var(--red);border:1.5px solid #f3b4b4}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:7px}
  .grow{flex:1}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--gray)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .note{background:var(--blue-s);border:1px dashed #bdd3ff;color:var(--blue-d);font-size:12px;padding:10px 14px;border-radius:10px;margin-bottom:14px;line-height:1.6}
  .lock{background:#fff7ed;border:1px solid #fed7aa;color:#c2620c;font-size:12.5px;padding:11px 14px;border-radius:10px;margin-bottom:16px;font-weight:600}
  .hide{display:none}
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:99;box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:90%}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  #login{position:fixed;inset:0;background:linear-gradient(135deg,#1e2a4a,#2563eb);display:flex;align-items:center;justify-content:center;z-index:200}
  .loginbox{background:#fff;border-radius:20px;padding:38px 34px;width:350px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
  .loginbox h2{font-size:23px;color:var(--navy);margin-bottom:2px}
  .loginbox h2 b{color:var(--blue)}
  .loginbox .sb{color:var(--gray);font-size:12px;margin-bottom:20px}
  .loginbox label{display:block;font-size:12px;color:var(--gray);margin:13px 0 5px;font-weight:600}
  .loginbox input{width:100%}
  .loginbox .btn{width:100%;margin-top:22px;padding:13px;font-size:14px}
  .cred{background:var(--blue-s);border-radius:10px;padding:12px 14px;font-size:11px;color:var(--blue-d);margin-top:18px;line-height:1.9}
  .form-grid{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* 주문서입력 (이카운트식 그리드) */
  .oehdr{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:16px;background:#fbfcff}
  .oehdr-grid{display:grid;grid-template-columns:64px 1fr 64px 1fr;gap:12px 16px;align-items:center}
  .oehdr label{font-size:12px;color:var(--gray);font-weight:700}
  .oehdr .fld{position:relative}
  .oehdr .fld input,.oehdr .fld select{width:100%}
  .ogrid{width:100%;border-collapse:collapse;font-size:13px}
  .ogrid th{background:#f1f5f9;text-align:center;font-size:11.5px;color:var(--gray);padding:9px 6px;border:1px solid var(--line);white-space:nowrap}
  .ogrid td{padding:5px 6px;border:1px solid var(--line);text-align:center;white-space:nowrap}
  .ogrid tbody tr:hover td{background:#fafcff}
  .ogrid input,.ogrid select{width:100%;padding:6px 7px;border:1px solid transparent;background:transparent;text-align:center;font-size:13px}
  .ogrid input:focus,.ogrid select:focus{border-color:var(--blue);background:#fff;border-radius:6px}
  .ogrid .qty{text-align:center}
  .ogrid tfoot td{background:#f8fafc;font-weight:800;border:1px solid var(--line);text-align:center}
  .entrycell{position:relative}
  .drop2{position:absolute;left:0;top:100%;min-width:300px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.16);z-index:40;max-height:260px;overflow:auto;text-align:left;margin-top:2px}
  .drop2:empty{display:none}
  .drop-i{padding:10px 13px;cursor:pointer;font-size:13px;border-bottom:1px solid #f4f6fb;display:flex;align-items:center;gap:8px}
  .drop-i:last-child{border:0}
  .drop-i:hover{background:var(--blue-s)}
  /* 주문 2단 레이아웃 + 입력 크게 */
  .orderwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
  @media(max-width:1120px){.orderwrap{grid-template-columns:1fr}}
  .ordlist{display:flex;flex-direction:column;gap:10px;max-height:600px;overflow:auto}
  .ord-i{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fbfcff}
  .ord-top{display:flex;align-items:center;gap:8px}
  .ord-top b{font-size:13px}
  .ord-amt{margin-left:auto;font-weight:800;font-size:13px}
  .ord-sub{font-size:12px;color:var(--gray);margin:7px 0 9px}
  .ord-btns{display:flex;gap:6px}
  .oehdr-grid{gap:14px 18px}
  .oehdr .fld input,.oehdr .fld select{padding:11px 13px;font-size:14px}
  .ogrid th{padding:11px 7px;font-size:12px}
  .ogrid td{padding:8px 7px}
  .ogrid input,.ogrid select{font-size:14px;padding:9px 8px}
  #entryIn{font-size:14px;font-weight:600}
  /* 팝업(모달) */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:300}
  .modal-bg.hide{display:none}
  .modal-box{background:#fff;border-radius:16px;padding:24px 26px;width:430px;box-shadow:0 30px 70px rgba(0,0,0,.32)}
  .modal-box h3{font-size:18px;margin-bottom:4px}
  .modal-box .ms{color:var(--gray);font-size:12px;margin-bottom:14px}
  .modal-box label{display:block;font-size:12px;color:var(--gray);font-weight:700;margin:11px 0 5px}
  .modal-box input,.modal-box select{width:100%}
  .modal-row{display:flex;gap:10px}
  .modal-row>div{flex:1}
  .modal-foot{display:flex;gap:8px;margin-top:22px}
  .modal-foot .btn{flex:1;padding:12px}
  .modal-wide{width:min(1120px,94vw);max-height:88vh;overflow:auto}
  .modal-cust{width:min(680px,94vw);max-height:88vh;overflow:auto}
  .collapsed table,.collapsed .sg-rows,.collapsed .sg-foot,.collapsed .sg-sub,.collapsed .oc-items,.collapsed .oc-btns,.collapsed .oc-sub,.collapsed .card-act{display:none}
  .ico-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);background:#fff;color:var(--gray);border-radius:8px;cursor:pointer;font-size:16px;padding:0;flex:0 0 auto}
  .ico-btn:hover{background:var(--bg);color:var(--ink)}
  .card-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid #f1f5f9;margin-top:12px;padding-top:12px}
  .kw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid #f1f5f9}
  .kw-row:last-child{border:0}
  .kw-row .l{font-size:14px;font-weight:700}
  .kw-row .d{font-size:12px;color:var(--gray);margin-top:3px}
  .kw-sw{width:56px;height:28px;border-radius:20px;border:0;cursor:pointer;font-size:11px;font-weight:800;color:#fff;background:#cbd5e1;flex:0 0 auto}
  .kw-sw.on{background:var(--green)}
  .prod-link{cursor:pointer}
  .prod-link:hover{text-decoration:underline;color:var(--blue)}
  .pbar-row{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid #f5f7fa}
  .pbar-row:last-child{border:0}
  .pbar-lab{width:130px;font-size:13px;font-weight:700;flex:0 0 auto}
  .pbar-track{flex:1;background:#eef2f7;border-radius:6px;height:22px;overflow:hidden;min-width:60px}
  .pbar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-d));border-radius:6px}
  .pbar-val{width:230px;text-align:right;font-size:12px;color:var(--gray);flex:0 0 auto}
  .wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;align-items:stretch;margin-bottom:14px}
  @media(max-width:1100px){.kgrid{grid-template-columns:repeat(2,1fr)}}
  .wgrid .kpi,.wgrid .card{margin:0}
  @media(max-width:1100px){.wgrid{grid-template-columns:repeat(2,1fr)}}
  /* ===== 마이크로 인터랙션 (과하지 않게) ===== */
  .kpi,.qi,.ord-card,.sg-card,.prod-link{transition:transform .14s ease,box-shadow .18s ease,border-color .15s ease,background .14s ease,color .14s ease}
  .kpi[onclick]:hover,.qi:hover,.ord-card:hover,.sg-card:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(15,23,42,.09)}
  .btn,.ico-btn,.sg-pick,.tabs button,.seg button,.drop-i{transition:transform .1s ease,background .15s ease,box-shadow .15s ease,opacity .15s ease,color .15s ease}
  .btn:active,.ico-btn:active,.qi:active,.sg-pick:active,.tabs button:active,.seg button:active,.drop-i:active{transform:scale(.96)}
  .btn:hover{filter:brightness(1.04)}
  .modal-bg{animation:mFade .16s ease}
  .modal-box{animation:mPop .2s cubic-bezier(.34,1.26,.64,1)}
  @keyframes mFade{from{opacity:0}to{opacity:1}}
  @keyframes mPop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  .view-anim{animation:vIn .22s ease}
  @keyframes vIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* 주문현황 카드 */
  .date-div{font-size:13px;font-weight:800;color:#334155;margin:18px 0 11px;padding:8px 12px;background:#eef2f7;border-radius:8px;display:flex;align-items:center;gap:8px}
  .ord-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .ord-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff}

<script>
/* ===== Supabase 연동 ===== */
const SB = window.supabase.createClient('https://qikvvqgxmquevzyykkcm.supabase.co','sb_publishable_7dB61aDLDjATF2PMWnS4dw_j506tmao',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.localStorage}});
const SB_DOMAIN='@n-live.co.kr';
function _authClient(){return window.supabase.createClient('https://qikvvqgxmquevzyykkcm.supabase.co','sb_publishable_7dB61aDLDjATF2PMWnS4dw_j506tmao',{auth:{persistSession:false,autoRefreshToken:false,storageKey:'erp_tmp_signup'}});}
const _toDate=d=>{if(!d)return null;const m=String(d).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:null;};
const DB2ORD=r=>({id:r.id,date:r.order_date,staff:r.staff,cust:r.cust,phone:r.phone,addr:r.addr,code:r.code,disp:r.item_name,tag:r.tag,color:r.color,size:r.size,qty:r.qty,price:r.price,pay:r.pay,payway:r.payway,ship:r.ship,req:r.req,prog:r.prog,back:r.back,track:r.track,reason:r.reason,shipped_date:r.shipped_date,rxtype:r.rxtype,rxstat:r.rxstat,rxreason:r.rxreason,fault:r.fault,rxdate:r.rxdate,rxdone:r.rxdone,rxnew:r.rxnew});
const ORD2DB=o=>{const r={order_date:_toDate(o.date),staff:o.staff,cust:o.cust,phone:o.phone,addr:o.addr,code:o.code,item_name:o.disp,tag:o.tag,color:o.color,size:o.size,qty:o.qty,price:o.price,pay:o.pay,payway:o.payway||null,ship:o.ship,req:o.req||null,prog:o.prog||null,back:!!o.back,track:o.track||null,reason:o.reason||null,shipped_date:o.shipped_date||null};r.rxtype=o.rxtype||null;r.rxstat=o.rxstat||null;r.rxreason=o.rxreason||null;r.fault=o.fault||null;r.rxdate=o.rxdate||null;r.rxdone=o.rxdone||null;r.rxnew=o.rxnew||null;return r;};
async function dbFetchAll(table,col,asc){let all=[],f=0;const sz=1000;while(true){const {data,error}=await SB.from(table).select('*').order(col,{ascending:asc!==false}).range(f,f+sz-1);if(error){console.error(table,error);break;}all=all.concat(data||[]);if(!data||data.length<sz)break;f+=sz;}return all;}
let SHIPPING=[];
let SCHED=[];
/* 사용자 개인설정 — 위젯배치/목록·SNS·목표·무료배송기준을 계정별로 DB(user_prefs)에 영구저장.
   어느 기기에서 로그인해도 본인 설정 유지. ME.auth_id 없으면 localStorage 폴백. */
let PREFS={},_savePrefsT=null;
async function loadPrefs(){
  try{
    if(typeof ME!=='undefined'&&ME&&ME.auth_id){const {data}=await SB.from('user_prefs').select('prefs').eq('auth_id',ME.auth_id).maybeSingle();PREFS=(data&&data.prefs)||{};}
    else{PREFS=JSON.parse(localStorage.getItem('erp_prefs_local')||'{}');}
  }catch(e){try{PREFS=JSON.parse(localStorage.getItem('erp_prefs_local')||'{}');}catch(e2){PREFS={};}}
}
function savePrefs(){
  try{localStorage.setItem('erp_prefs_local',JSON.stringify(PREFS));}catch(e){}
  if(typeof ME==='undefined'||!ME||!ME.auth_id)return;
  clearTimeout(_savePrefsT);
  _savePrefsT=setTimeout(function(){SB.from('user_prefs').upsert({auth_id:ME.auth_id,prefs:PREFS,updated_at:new Date().toISOString()}).then(function(r){if(r.error)console.warn('prefs save:',r.error.message);});},600);
}
async function dbLoadAll(){
  try{
    const st=await dbFetchAll('stock','id',true);
    const cu=await dbFetchAll('customers','name',true);
    const or=await dbFetchAll('orders','id',false);
    const sh=await SB.from('shipping').select('*').order('month');
    const em=await SB.from('employees').select('*').order('id');
    const bs=await SB.from('broadcast_schedule').select('*').order('date');
    const vn=await SB.from('vendors').select('*').order('name');
    if(vn&&vn.data){VENDORS.length=0;vn.data.forEach(r=>VENDORS.push(r));}
    const cl=await SB.from('cust_log').select('*').order('at',{ascending:false}).limit(3000);
    CUSTLOG=(cl&&cl.data)||[];
    STOCK.length=0;st.forEach(r=>STOCK.push(r));
    CUSTOMERS.length=0;cu.forEach(r=>CUSTOMERS.push(r));
    ORD.length=0;or.forEach(r=>ORD.push(DB2ORD(r)));
    SHIPPING=sh.data||[];
    EMPLOYEES.length=0;(em.data||[]).forEach(r=>EMPLOYEES.push(r));
    SCHED=(bs&&bs.data)||[];
    if(window.ME&&(ME.scope==='all'||ME.scope==='logi')){try{const sc=await SB.from('stock_cost').select('*');if(sc&&sc.data){const cm={};sc.data.forEach(r=>cm[r.stock_id]=r.in_price);STOCK.forEach(s=>{s.in_price=cm[s.id]!=null?cm[s.id]:0;});}}catch(e){console.error('cost',e);}}else{STOCK.forEach(s=>{s.in_price=0;});}
  }catch(e){console.error('load',e);toast('⚠️ 데이터 로드 오류');}
}
/* 실시간 동기화 — 다른 사용자의 변경을 자동 반영. 입력 중엔 화면 재렌더 보류(입력값 보호) */
let _rt=null,_rtTimer=null;
function isTyping(){const a=document.activeElement;if(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName))return true;const m=$('#modal');if(m&&!m.classList.contains('hide'))return true;return false;}
function startRealtime(){if(_rt)return;try{_rt=SB.channel('erp-live').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(_rtTimer);_rtTimer=setTimeout(async()=>{if(_committing)return;await dbLoadAll();if(!isTyping())render();},700);}).subscribe();}catch(e){console.error('realtime',e);}}
async function saveOrd(o){try{const row=ORD2DB(o);if(o.id){const {error}=await SB.from('orders').update(row).eq('id',o.id);if(error){console.error('saveOrd',error);toast('⚠️ 저장 실패 — 새로고침 후 다시 시도하세요');return false;}}else{const {data,error}=await SB.from('orders').insert(row).select('id').single();if(error){console.error('saveOrd',error);toast('⚠️ 저장 실패 — 다시 시도하세요');return false;}if(data)o.id=data.id;}return true;}catch(e){console.error(e);toast('⚠️ 저장 오류 — 인터넷 연결을 확인하세요');return false;}}
async function delOrd(o){try{if(o.id){const {error}=await SB.from('orders').delete().eq('id',o.id);if(error){console.error('delOrd',error);toast('⚠️ 삭제 저장 실패 — 새로고침으로 확인하세요');}}}catch(e){console.error(e);toast('⚠️ 삭제 오류 — 인터넷 확인');}}
async function saveStock(s){try{if(s&&s.id!=null){const {error}=await SB.from('stock').update({qty:s.qty}).eq('id',s.id);if(error){console.error('saveStock',error);toast('⚠️ 재고 저장 실패 — 다시 시도하세요');}}}catch(e){console.error(e);toast('⚠️ 재고 저장 오류');}}
/* 재고 원자적 가감 — DB에서 qty=qty±delta 계산(동시 차감해도 안 깨짐). 반환된 정확한 값으로 화면 갱신 */
async function adjustStockDB(s,delta,reason,ref){if(!s)return false;if(s.id==null){s.qty=(s.qty||0)+delta;return true;}try{const {data,error}=await SB.rpc('adjust_stock',{p_id:s.id,p_delta:delta});if(error){console.error('adjustStock',error);toast('⚠️ 재고 저장 실패 — 다시 시도하세요');return false;}if(typeof data==='number')s.qty=data;try{await SB.from('stock_log').insert({stock_id:s.id,code:s.code,delta:delta,reason:reason||'조정',ref:ref||null,staff:(window.ME&&ME.name)||null});}catch(e){}return true;}catch(e){console.error(e);toast('⚠️ 재고 저장 오류');return false;}}
async function openStockLog(id,name){$('#modalBox').innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><h3 style="margin:0">📜 재고 변동내역</h3><span style="flex:1"></span><button class="btn gray sm" onclick="closeModal()">✕</button></div><div class="note" style="margin-bottom:10px">${esc(name||'')}</div><div id="slBody" class="muted" style="padding:10px">불러오는 중...</div>`;$('#modal').classList.remove('hide');
  try{const {data}=await SB.from('stock_log').select('*').eq('stock_id',id).order('at',{ascending:false}).limit(300);const rows=data||[];const el=$('#slBody');el.className='';
    el.innerHTML=rows.length?`<table><thead><tr><th>일시</th><th>구분</th><th class="num-cell">증감</th><th>담당</th><th>메모</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="muted" style="font-size:12px">${String(r.at||'').slice(0,16).replace('T',' ')}</td><td><span class="pill ${r.delta>0?'p-done':'p-low'}">${esc(r.reason||'')}</span></td><td class="num-cell" style="font-weight:700;color:${r.delta>0?'#16a34a':'#dc2626'}">${r.delta>0?'+':''}${r.delta}</td><td class="muted">${esc(r.staff||'-')}</td><td class="muted" style="font-size:12px">${esc(r.ref||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="muted" style="padding:10px">아직 변동 기록이 없습니다. 지금부터 판매·교환·환불·조정이 자동 기록됩니다.</div>';
  }catch(e){$('#slBody').innerHTML='<div class="muted" style="padding:10px">불러오기 실패 (잠시 후 다시)</div>';}}
async function saveStockRow(s){try{const row={code:s.code,name:s.name,color:s.color,size:s.size,tag:s.tag,qty:s.qty,price:s.price,vendor:s.vendor||null,barcode:s.barcode||null,category:s.category||null,subcategory:s.subcategory||null,season:s.season||null};if(s.id){const {error}=await SB.from('stock').update(row).eq('id',s.id);if(error){console.error('updStock',error);toast('⚠️ 품목 저장 실패 — 다시 시도하세요');}}else{const {data,error}=await SB.from('stock').insert(row).select('id').single();if(error){console.error('insStock',error);toast('⚠️ 품목 등록 실패 — 다시 시도하세요');}if(data){s.id=data.id;if((s.qty||0)!==0){try{await SB.from('stock_log').insert({stock_id:s.id,code:s.code,delta:s.qty,reason:'신규입고',ref:s.vendor||null,staff:(typeof ME!=='undefined'&&ME&&ME.name)||null});}catch(e){console.error('log입고',e);}}}}if(s.id&&s.in_price!=null){try{const {error}=await SB.from('stock_cost').upsert({stock_id:s.id,in_price:s.in_price||0});if(error)console.error('cost',error);}catch(e){console.error('cost',e);}}}catch(e){console.error(e);toast('⚠️ 품목 저장 오류');}}
async function saveCustDB(c){try{const row={name:c.name,phone:c.phone||null,addr:c.addr||null,zip:c.zip||null};if(c.id){const {error}=await SB.from('customers').update(row).eq('id',c.id);if(error){console.error('updCust',error);toast('⚠️ 고객 저장 실패 — 다시 시도하세요');}}else{row.owner=((typeof ME!=='undefined'&&ME&&(ME.owner||ME.name)))||null;row.created_at=new Date().toISOString();let res=await SB.from('customers').insert(row).select('id,created_at').single();if(res.error&&/created_at/i.test(res.error.message||'')){delete row.created_at;res=await SB.from('customers').insert(row).select('id').single();}if(res.error){console.error('insCust',res.error);toast('⚠️ 고객 등록 실패 — 다시 시도하세요');}if(res.data){c.id=res.data.id;c.owner=row.owner;c.created_at=res.data.created_at;}}}catch(e){console.error(e);toast('⚠️ 고객 저장 오류');}}
async function delCustDB(c){try{if(c.id){const {error}=await SB.from('customers').delete().eq('id',c.id);if(error){console.error('delCust',error);toast('⚠️ 고객 삭제 실패 — 다시 시도하세요');}}}catch(e){console.error(e);toast('⚠️ 삭제 오류');}}

/* ===== 대시보드 위젯 시스템 (#1 포지션별 + #2 커스터마이징) ===== */
function _inRange(o,key){if(key==='all')return true;const r=periodRange(key),d=(o.date||'').replace(/\//g,'-');return d>=r.from&&d<=r.to;}
function _salesP(key){return mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,key)).reduce((a,o)=>a+amtOf(o),0);}
function _cntP(key){const s=new Set();mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,key)&&_isGoods(o)).forEach(o=>s.add((o.date||'')+'|'+(o.cust||'')));return s.size;}/* 실제 주문 수 = 날짜+고객 그룹(서비스라인 제외) */
function _shipFeeMonth(){const r=periodRange('month');return mine(ORD).filter(o=>o.code==='배송비'&&_inRange(o,'month')).reduce((a,o)=>a+amtOf(o),0)+SHIPPING.filter(s=>s.month===r.from.slice(0,7)).reduce((a,s)=>a+(s.amount||0),0);}
function _byStaffRows(){const m={};mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,'month')).forEach(o=>m[o.staff]=(m[o.staff]||0)+amtOf(o));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>[k,won(v)]);}
function _byProdRows(){const m={};mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,'month')&&!/낱장|배송비/.test((o.disp||'')+o.code)).forEach(o=>{const k=o.disp||o.code;m[k]=(m[k]||0)+(o.qty||0);});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>[k,v+'개']);}
/* ===== 대시보드 분석 통계 (전부 실데이터: 주문/고객/재고에서 계산) ===== */
function prodCat(code,disp){const s=STOCK.find(x=>x.code===code);if(s&&s.subcategory)return s.subcategory;if(s&&s.category)return s.category;const t=(disp||'')+((s&&s.name)||'');const KW=[['원피스','원피스'],['니트','니트'],['가디건','니트'],['팬츠','팬츠'],['바지','팬츠'],['슬랙스','팬츠'],['데님','팬츠'],['청바지','팬츠'],['레깅스','팬츠'],['자켓','아우터'],['코트','아우터'],['점퍼','아우터'],['패딩','아우터'],['아우터','아우터'],['블라우스','블라우스'],['셔츠','블라우스'],['티셔츠','티셔츠'],['반팔','티셔츠'],['나시','티셔츠'],['스커트','스커트'],['치마','스커트'],['셋업','셋업'],['후드','맨투맨'],['맨투맨','맨투맨']];for(const kw of KW)if(t.indexOf(kw[0])>=0)return kw[1];return '기타';}
function _isGoods(o){return o.code!=='배송비'&&o.code!=='낱장'&&o.code!=='적립금'&&!/배송비|낱장|적립금/.test(o.disp||'');}
function _orderCount(key){const s=new Set();mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,key)).forEach(o=>s.add((o.date||'')+'|'+(o.cust||'')));return s.size;}
function _avgOrder(key){const c=_orderCount(key);return c?Math.round(_salesP(key)/c):0;}
function _custAgg(){const m={};mine(ORD).filter(o=>o.pay==='paid').forEach(o=>{const c=(o.cust||'').trim();if(!c)return;if(!m[c])m[c]={cust:c,groups:new Set(),amt:0,last:'',cats:{}};m[c].groups.add((o.date||'')+'|'+c);m[c].amt+=amtOf(o);const d=(o.date||'').replace(/\//g,'-');if(d>m[c].last)m[c].last=d;if(_isGoods(o)){const cat=prodCat(o.code,o.disp);m[c].cats[cat]=(m[c].cats[cat]||0)+(o.qty||0);}});return Object.values(m).map(x=>{const ent=Object.entries(x.cats).sort((a,b)=>b[1]-a[1]);const tc=ent.filter(e=>e[0]!=='기타')[0]||ent[0];return {cust:x.cust,cnt:x.groups.size,amt:x.amt,last:x.last,topcat:tc?tc[0]:'-'};});}

function payBadge(pw){if(!pw||pw==='-')return '';const cash=pw==='현금';return `<span class="pill ${cash?'p-done':'p-req'}" style="font-size:11px;flex:0 0 auto;white-space:nowrap">${cash?'💵':'💳'} ${pw}</span>`;}
let _onCache=null;
function orderNoOf(date,cust){if(!_onCache)_onCache={};const d=(date||'');if(!_onCache[d]){const seen={};let n=0;ORD.filter(x=>(x.date||'')===d).sort((a,b)=>(a.id||0)-(b.id||0)).forEach(x=>{if(x.cust&&!(x.cust in seen))seen[x.cust]=++n;});_onCache[d]=seen;}return d.replace(/[\/-]/g,'.')+'-'+String((_onCache[d]||{})[cust]||0).padStart(2,'0');}
function onoBadge(date,cust){return `<span style="display:inline-block;background:#1e293b;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;flex:0 0 auto;white-space:nowrap;letter-spacing:.3px">${orderNoOf(date,cust)}</span>`;}
function orderGroups(pay){
  const list=mine(ORD).filter(o=>o.pay===pay),map={};
  list.forEach(o=>{const k=(o.date||'')+'||'+(o.cust||'');(map[k]=map[k]||{date:o.date,cust:o.cust,phone:o.phone,addr:o.addr,staff:o.staff,items:[]}).items.push(o);});
  return Object.values(map).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function orderStatusCards(pay){
  const all=orderGroups(pay),gs=all.slice(0,60);
  if(!gs.length)return `<div class="muted" style="padding:14px">${pay==='unpaid'?'미결제 주문 없음 (위에서 주문서를 저장하면 여기 카드로 보여요)':'결제완료 주문 없음'}</div>`;
  const byDate={};gs.forEach(g=>{(byDate[g.date]=byDate[g.date]||[]).push(g);});
  let html=Object.entries(byDate).map(([date,arr])=>`
    <div class="date-div">📅 ${date||'-'} <span class="muted" style="font-weight:400">· ${arr.length}명</span></div>
    <div class="ord-cards">
    ${arr.map(g=>{const idx=all.indexOf(g),tot=g.items.reduce((a,o)=>a+amtOf(o),0);return `
      <div class="ord-card${COLLAPSED.has('os:'+pay+g.date+g.cust)?' collapsed':''}">
        <div class="oc-head">${collBtn('os:'+pay+g.date+g.cust)}${onoBadge(g.date,g.cust)} <b>${g.cust}</b>${pay==='unpaid'?'<span class="pill p-miss">미결제</span>':'<span class="pill p-done">결제완료</span>'}<span class="grow"></span><span class="oc-total">${won(tot)}</span></div>
        ${g.phone?`<div class="oc-sub">📞 ${g.phone}</div>`:''}
        <div class="oc-items">${g.items.map(o=>`<div class="oc-i"><span class="tagbox">${tagShow(o)}</span><span class="oc-nm">${itemLabel(o)}</span><span class="muted">${o.qty}개</span><span class="oc-amt">${won(amtOf(o))}</span></div>`).join('')}</div>
        ${pay==='unpaid'
          ?`<div class="oc-btns"><button class="btn sm ghost" onclick="openOrderSheet(${idx})">주문서</button><button class="btn sm ghost" onclick="editOrderGroup(${idx})">✏️수정</button><select id="pw${idx}" class="oc-pw"><option>현금</option><option>카드</option></select></div><div class="oc-btns" style="border-top:0;padding-top:6px"><button class="btn sm" onclick="payGroup(${idx})">입금확인</button><button class="btn sm red" onclick="cancelGroupBtn(${idx})">취소</button></div>`
          :`<div class="oc-btns"><span class="muted" style="align-self:center;font-size:12px">💳 ${g.items[0].payway||'-'}</span><button class="btn sm gray" style="margin-left:auto;flex:0 0 auto" onclick="unpayGroup(${idx})">↩ 입금확인 취소</button></div>`}
      </div>`}).join('')}
    </div>`).join('');
  if(all.length>gs.length)html+=`<div class="muted" style="padding:12px 4px;font-size:12px">… 외 ${all.length-gs.length}그룹 더 있음 (최근 60그룹 표시)</div>`;
  return html;
}
function paidCards(){
  const all=orderGroups('paid');
  let gs=all;
  if(CDATE)gs=gs.filter(g=>(g.date||'').replace(/\//g,'-')===CDATE);
  if(CQ)gs=gs.filter(g=>inc(g.cust,CQ));
  const show=gs.slice(0,60);
  if(!show.length)return '<div class="muted" style="padding:12px">해당 날짜·닉네임 결제완료 없음</div>';
  let html=show.map(g=>{const idx=all.indexOf(g),tot=g.items.reduce((a,o)=>a+amtOf(o),0);return `
    <div class="ord-card${COLLAPSED.has('pd:'+g.date+g.cust)?' collapsed':''}">
      <div class="oc-head">${collBtn('pd:'+g.date+g.cust)}${onoBadge(g.date,g.cust)} <b>${g.cust}</b><span class="pill p-done">결제완료</span><span class="grow"></span><span class="oc-total">${won(tot)}</span></div>
      <div class="oc-sub">${g.date||''}${g.phone?' · '+g.phone:''} · 💳 ${g.items[0].payway||'-'}</div>
      <div class="oc-items">${g.items.map(o=>`<div class="oc-i"><span class="tagbox">${tagShow(o)}</span><span class="oc-nm">${itemLabel(o)}</span><span class="muted">${o.qty}개</span></div>`).join('')}</div>
      <div class="oc-btns"><button class="btn sm gray" style="flex:1" onclick="unpayGroup(${idx})">↩ 입금확인 취소</button></div>
    </div>`;}).join('');
  let out='<div class="ord-cards">'+html+'</div>';
  if(gs.length>show.length)out+=`<div class="muted" style="padding:8px;font-size:12px">… 외 ${gs.length-show.length}건</div>`;
  return out;
}
async function payGroup(idx){const g=orderGroups('unpaid')[idx];if(!g)return;const pw=($('#pw'+idx)&&$('#pw'+idx).value)||'현금';
  const prev=g.items.map(o=>({pay:o.pay,payway:o.payway}));
  g.items.forEach(o=>{o.pay='paid';o.payway=pw;});
  let ok=true;for(const o of g.items){if(await saveOrd(o)===false)ok=false;}
  if(ok){CDATE=(g.date||'').replace(/\//g,'-').slice(0,10)||CDATE;CQ='';toast('💳 입금확인('+pw+') → 결제완료: '+g.cust+' '+g.items.length+'건');}
  else{g.items.forEach((o,i)=>{o.pay=prev[i].pay;o.payway=prev[i].payway;});toast('⚠️ 저장 실패 — 변경이 취소됐어요. 다시 시도하세요');}
  render();}
async function unpayGroup(idx){const g=orderGroups('paid')[idx];if(!g)return;if(!confirm('입금확인을 취소하시겠습니까?\n\n'+g.cust+' '+g.items.length+'건이 미결제 상태로 돌아갑니다.'))return;
  const prev=g.items.map(o=>o.pay);
  g.items.forEach(o=>{o.pay='unpaid';});
  let ok=true;for(const o of g.items){if(await saveOrd(o)===false)ok=false;}
  if(ok)toast('↩ 입금확인 취소 → 미결제로 복구: '+g.cust);
  else{g.items.forEach((o,i)=>{o.pay=prev[i];});toast('⚠️ 저장 실패 — 다시 시도하세요');}
  render();}
async function editOrderGroup(idx){const g=orderGroups('unpaid')[idx];if(!g)return;

  OE={cust:g.cust,phone:g.phone||'',addr:g.addr||'',staff:g.staff||null,shipManual:true,
    date:((g.date||'').replace(/\//g,'-').slice(0,10))||todayStr(),
    lines:g.items.map(function(o){

      if(o.code==='낱장')return {kind:'natjang',name:o.disp||'',tag:o.tag||'',color:o.color||'',size:o.size||'',qty:o.qty,price:o.price};

    })};

  VIEW='order';render();toast('✏️ 수정 모드 — 항목 변경 후 [저장]을 누르세요');

}
async function cancelGroupBtn(idx){const g=orderGroups('unpaid')[idx];if(!g)return;const removed=[];g.items.forEach(o=>{const s=skuOf(o.code,o.color,o.size);const k=ORD.indexOf(o);if(k>=0)ORD.splice(k,1);removed.push({o,s,dq:o.qty});});toast('🗑️ 주문 취소 → 재고 복원: '+g.cust);render();for(const {o,s,dq} of removed){await delOrd(o);if(s)await adjustStockDB(s,dq,'주문취소',o.cust);}}

/* 적립금 사용 — 배송비처럼 주문에 마이너스 라인으로 붙음(상품금액 한도·보유 한도) */
function usePoints(){
  if(!OE.cust){toast('고객을 먼저 선택하세요');return;}
  const bal=custPoints(OE.cust);if(bal<=0){toast('이 고객은 적립금이 없습니다');return;}
  const prod=OE.lines.filter(l=>l.kind!=='ship'&&l.kind!=='point').reduce((a,l)=>a+(l.price||0)*(l.qty||0),0);
  const maxUse=Math.max(0,Math.min(bal,prod));
  if(maxUse<=0){toast('상품을 먼저 담아주세요');return;}
  const raw=prompt('적립금 사용 (보유 '+won(bal)+' · 최대 '+won(maxUse)+')',String(maxUse));
  if(raw==null)return;let amt=parseInt(String(raw).replace(/[^\d]/g,''))||0;
  if(amt<=0){OE.lines=OE.lines.filter(l=>l.kind!=='point');render();return;}
  if(amt>maxUse){amt=maxUse;toast('최대 '+won(maxUse)+'까지 — 조정했습니다');}
  OE.lines=OE.lines.filter(l=>l.kind!=='point');
  OE.lines.push({kind:'point',name:'적립금 사용',code:'적립금',color:'',size:'',qty:1,price:-amt});
  toast('💰 적립금 '+won(amt)+' 사용 (저장 시 차감)');render();
}

}

function manageCards(list,cat){
  if(!list.length)return `<div class="card"><div class="muted" style="padding:16px">${cat==='back'?'미송 고객이 없습니다':'합배 대상이 없습니다'}</div></div>`;
  return `<div class="card"><div class="note">💡 ${cat==='back'?'재고 있는 상품만 <b>출고선택</b> → 송장 입력 → [출고완료]. 미송 상품은 고객별로 그대로 남습니다.':'같은 고객의 여러 주문을 <b>출고선택</b>해 한 송장으로 함께 보냅니다.'}</div><div class="sg-grid">`+
  list.map((c,i)=>`<div class="sg-card${COLLAPSED.has('m:'+cat+c.cust)?' collapsed':''}">
    <div class="sg-head">${collBtn('m:'+cat+c.cust)}<span class="sg-name">${c.cust}</span>${payBadge(c.lines[0]&&c.lines[0].payway)}
      ${c.lines.filter(l=>l.back).length?'<span class="pill p-low">미송 '+c.lines.filter(l=>l.back).length+'</span>':''}
      ${c.dates.size>=2?'<span class="pill p-req">합배 '+c.dates.size+'주문</span>':''}
      <span style="flex:1"></span><button class="ico-btn" onclick="openCustPopup('${cat}',${i})" title="크게 보기" aria-label="크게 보기"><i class="ti ti-arrows-diagonal"></i></button></div>
    <div class="sg-sub">📞 ${c.phone||'-'}　📍 ${c.addr||'-'}</div>
    <div class="sg-rows">
    ${c.lines.map(o=>{const q=(skuOf(o.code,o.color,o.size)||{}).qty,canShip=cat==='back'?(progOf(o)==='포장'):(!o.back&&(q==null||q>0)),sel=SHIPCHK.has(o.id);return `
      <div class="sg-row ${o.back?'dim':''}">
        ${canShip?`<button class="sg-pick ${sel?'on':''}" onclick="shipToggle(${o.id})">${sel?'☑ 선택됨':'☐ 출고선택'}</button>`:'<span class="sg-pick no">미송 보류</span>'}
        <span class="tagbox">${tagShow(o)}</span>
        <span class="sg-nm">${itemLabel(o)}</span>
        <span class="sg-qty">${o.qty}개</span>
        <span class="sg-stk ${(q!=null&&q<=0)?'low':''}">재고 ${q==null?'-':q}</span>
        <span class="seg">${[['미포장','pu'],['포장','pp'],['미송','pb']].map(([p,cl])=>`<button class="${progOf(o)===p?'on '+cl:''}" onclick="setProg(${o.id},'${p}')">${p}</button>`).join('')}</span>
        ${cat==='back'?`<button class="btn sm red ghost" style="padding:3px 9px;font-size:11px;margin-left:4px" onclick="cancelBackOrder(${o.id})" title="배송지연 등으로 취소 · 재고 복원">취소</button>`:''}
      </div>`}).join('')}
    </div>
    <div class="sg-foot"><input id="trk_${cat}_${i}" placeholder="송장번호 입력"><button class="btn" onclick="shipChecked('${cat}',${i})">✅ 출고완료</button></div>
  </div>`).join('')+'</div></div>';
}
function shipToggle(id){if(SHIPCHK.has(id))SHIPCHK.delete(id);else SHIPCHK.add(id);render();}
async function shipWait(i){const c=openCustomers().filter(x=>x.cat==='wait')[i];if(!c)return;
  const trk=($('#trk_wait_'+i)?.value||'').trim();if(!trk){toast('⚠️ 송장번호를 입력하세요');return;}
  const _td=todayStr();
  const prev=c.lines.map(o=>({ship:o.ship,track:o.track,back:o.back,req:o.req,shipped_date:o.shipped_date}));
  c.lines.forEach(o=>{o.ship='done';o.track=trk;o.back=false;o.req='';o.shipped_date=_td;});
  let ok=true;for(const o of c.lines){if(await saveOrd(o)===false)ok=false;}
  if(ok)toast('🚚 출고완료: '+c.cust+' '+c.lines.length+'건 · 송장 '+trk);
  else{c.lines.forEach((o,j)=>Object.assign(o,prev[j]));toast('⚠️ 저장 실패 — 다시 시도하세요');}
  render();}
async function shipChecked(cat,i){const c=openCustomers().filter(x=>x.cat===cat)[i];if(!c)return;
  const sel=c.lines.filter(l=>SHIPCHK.has(l.id));if(!sel.length){toast('출고할 상품을 체크하세요');return;}
  const trk=($('#trk_'+cat+'_'+i)?.value||'').trim();if(!trk){toast('⚠️ 송장번호를 입력하세요');return;}
  const _td=todayStr();
  const prev=sel.map(o=>({ship:o.ship,track:o.track,back:o.back,req:o.req,shipped_date:o.shipped_date}));
  sel.forEach(o=>{o.ship='done';o.track=trk;o.back=false;o.req='';o.shipped_date=_td;});
  let ok=true;for(const o of sel){if(await saveOrd(o)===false)ok=false;}
  if(ok){sel.forEach(o=>SHIPCHK.delete(o.id));toast('🚚 출고완료: '+c.cust+' '+sel.length+'건 · 송장 '+trk);}
  else{sel.forEach((o,j)=>Object.assign(o,prev[j]));toast('⚠️ 저장 실패 — 다시 시도하세요');}
  render();}

  const trk=($('#ptrk')?.value||'').trim();if(!trk){toast('⚠️ 송장번호를 입력하세요');return;}

function setDonePeriod(k){DONEPERIOD=k;render();}
function shipTabDone(){
  const r=periodRange(DONEPERIOD);
  let done=mine(ORD).filter(o=>o.ship==='done'&&o.track);
  if(DONEPERIOD!=='all')done=done.filter(o=>{const d=o.shipped_date||'';return d>=r.from&&d<=r.to;});
  done=done.sort((a,b)=>(b.shipped_date||'').localeCompare(a.shipped_date||''));
  return `<div class="card"><div class="card-h"><h2>출고완료 <span class="muted" style="font-size:12px;font-weight:400">${r.label} · ${done.length}건</span></h2></div>
    <div class="note">💡 기본은 <b>오늘 출고완료</b>건만 표시 · 기간 선택으로 누적 조회. (과거 이전분은 출고일 미기록이라 '누적'에서 보입니다)</div>

function shipTabBody(){
  const cs=openCustomers();
  if(SHIPTAB==='wait')return waitCard(cs.filter(c=>c.cat==='wait'));
  if(SHIPTAB==='back'){const q=(BACKQ||'').trim();
    const box=`<div class="card" style="margin-bottom:12px"><div class="toolbar"><span class="muted" style="align-self:center">🔍 미송 상품</span><input id="backSearch" placeholder="상품명·번호표·코드 입력 후 Enter (예: 다운반바지)" value="${esc(q)}" onkeydown="if(event.key==='Enter'){BACKQ=this.value.trim();render()}" style="flex:1">${q?`<button class="btn sm gray" onclick="BACKQ='';render()">초기화</button>`:''}</div>${q?backSearchResult(q):`<div class="note">상품을 검색하면, 그 상품이 입고됐을 때 <b>아직 못 받은 고객들</b>을 모아서 보여줍니다.</div>`}</div>`;

  if(SHIPTAB==='bundle')return manageCards(cs.filter(c=>c.cat==='bundle'),'bundle');
  return shipTabDone();
}

/* ===== 출고현황(완료내역) ===== */
function shpPeriod(k){if(k==='all'){SHPFROM='';SHPTO='';}else{let ym=dataLastYM();if(k==='lastmonth'){let p=ym.split('-').map(Number),y=p[0],m=p[1]-1;if(m<1){m=12;y--;}ym=y+'-'+String(m).padStart(2,'0');}SHPFROM=ym+'-01';SHPTO=ym+'-31';}render();}
function shippedRows(){
  if(SHPFROM===undefined){const ym=dataLastYM();SHPFROM=ym+'-01';SHPTO=ym+'-31';}
  let rows=mine(ORD).filter(o=>o.ship==='done'&&o.track).filter(o=>{const d=(o.date||'').replace(/\//g,'-');return (!SHPFROM||d>=SHPFROM)&&(!SHPTO||d<=SHPTO);});
  if(SHPQ){if(SHPFIELD==='상품번호')rows=rows.filter(o=>inc(o.code,SHPQ)||inc(skuFullCode(o.code,o.color,o.size),SHPQ)||inc(itemLabel(o),SHPQ));else if(SHPFIELD==='번호표')rows=rows.filter(o=>inc(tagShow(o),SHPQ));else if(SHPFIELD==='송장')rows=rows.filter(o=>inc(o.track,SHPQ));else rows=rows.filter(o=>inc(o.cust,SHPQ));}
  return rows;
}
function shpCollAll(){grpDC(shippedRows()).forEach(g=>COLLAPSED.add('sd:'+g.date+g.cust));render();}
function shipGuideText(date,cust){
  const done=mine(ORD).filter(o=>o.cust===cust&&o.ship==='done'&&o.track&&o.date===date);
  const miss=mine(ORD).filter(o=>o.cust===cust&&o.back);
  const trk=(done.find(o=>o.track)||{}).track||'';
  const bundle=new Set(done.map(o=>o.date)).size>1;
  let t='안녕하세요, '+cust+' 고객님 :)\n금일 출고 완료된 상품 안내드립니다.\n\n[출고완료]\n';
  t+=(done.length?done.map(o=>'· '+itemLabel(o)+' / '+o.qty+'개').join('\n'):'· (없음)');

/* ===== 교환·반품·취소 (CS 사후처리) ===== */
const RX_REASONS=[{l:'상품불량',f:'셀러'},{l:'오배송(잘못보냄)',f:'물류'},{l:'누락/빠짐',f:'물류'},{l:'배송지연(회사귀책)',f:'물류'},{l:'사이즈 변경',f:'무과실'},{l:'색상 변경',f:'무과실'},{l:'단순변심',f:'무과실'},{l:'기타',f:'무과실'}];
const RX_TYPES={exchange:{l:'교환',ic:'🔄'},refund:{l:'반품·환불',ic:'↩️'},cancel:{l:'취소',ic:'✖️'}};
const RX_STEPL={req:'접수',recall:'회수신청',gotback:'회수입고',reship:'재발송',refunded:'환불완료',done:'완료'};
function rxFlow(t){return t==='exchange'?['req','recall','gotback','reship','done']:['req','recall','gotback','refunded','done'];}
function faultOf(reason){const r=RX_REASONS.find(x=>x.l===reason);return r?r.f:'무과실';}
function faulteeOf(o){return o.fault==='셀러'?(o.staff||'담당셀러'):o.fault==='물류'?'물류팀':'무과실';}
function rxStockFor(o){return STOCK.find(s=>s.code===o.code&&(s.color||'')===(o.color||'')&&(s.size||'')===(o.size||''));}
/* 단계별 재고효과: sign=+1 진입 적용, sign=-1 역산(되돌리기) */
async function rxStepStockEffect(o,step,sign){const q=o.qty||1;
  if(step==='gotback'){const s=rxStockFor(o);if(s){await adjustStockDB(s,sign*q,sign>0?'교환/반품 회수입고':'회수취소',o.cust);return `${o.code} 재고 ${sign>0?'+':'−'}${q}`;}return '';}
  if(step==='reship'){const nw=o.rxnew||{};const s=STOCK.find(x=>x.code===nw.code&&(x.color||'')===(nw.color||'')&&(x.size||'')===(nw.size||''));if(s){await adjustStockDB(s,-sign*q,sign>0?'교환 재발송':'재발송취소',o.cust);return `${nw.code||'새상품'} 재고 ${sign>0?'−':'+'}${q}`;}return '';}
  return '';}
let RXDRAFT=null,RXVIEWTAB='active';

function rxPickReason(v){RXDRAFT.reason=v;RXDRAFT.fault=faultOf(v);renderRxModal(ORD.find(x=>x.id===RXDRAFT.id));}
function rxSetFault(v){RXDRAFT.fault=v;renderRxModal(ORD.find(x=>x.id===RXDRAFT.id));}

  <div style="margin-bottom:12px"><div class="muted" style="margin-bottom:5px">사유</div><select onchange="rxPickReason(this.value)" style="width:100%;padding:11px;border-radius:9px;font-weight:700;font-family:inherit">${RX_REASONS.map(r=>`<option ${d.reason===r.l?'selected':''}>${r.l}</option>`).join('')}</select></div>

  ${newBox}
  <div class="modal-foot" style="margin-top:18px"><button class="btn gray" onclick="closeModal()">취소</button><button class="btn" onclick="rxCommit()">${t.l} 접수</button></div>`;
  $('#modal').classList.remove('hide');}
async function rxCommit(){const d=RXDRAFT;if(!d)return;const o=ORD.find(x=>x.id===d.id);if(!o)return;
  o.rxtype=d.type;o.rxstat='req';o.rxreason=d.reason;o.fault=d.fault;o.rxdate=todayStr();
  if(d.type==='exchange')o.rxnew={tag:($('#rx_tag').value||'').trim(),code:($('#rx_code').value||'').trim(),name:($('#rx_name').value||'').trim(),color:($('#rx_color').value||'').trim(),size:($('#rx_size').value||'').trim()};
  closeModal();RXDRAFT=null;toast(`${RX_TYPES[o.rxtype].l} 접수됨 → [교환·반품] 메뉴에서 처리`);render();await saveOrd(o);}
const RX_NEXTL={recall:'🚚 회수신청 완료',gotback:'📦 회수입고',reship:'📤 재발송',refunded:'💸 환불완료',done:'✅ 완료처리'};
async function rxNext(id){const o=ORD.find(x=>x.id===id);if(!o)return;const flow=rxFlow(o.rxtype),i=flow.indexOf(o.rxstat),next=flow[i+1];if(!next)return;
  const eff=await rxStepStockEffect(o,next,1);
  o.rxstat=next;if(next==='done')o.rxdone=todayStr();
  toast((RX_NEXTL[next]||'진행')+(eff?' · '+eff:''));render();await saveOrd(o);}
async function rxPrev(id){const o=ORD.find(x=>x.id===id);if(!o)return;const flow=rxFlow(o.rxtype),i=flow.indexOf(o.rxstat);
  if(i<=0){toast('첫 단계예요 — 취소하려면 [삭제]를 누르세요');return;}
  const cur=o.rxstat,prev=flow[i-1];
  const eff=await rxStepStockEffect(o,cur,-1);   // 현재 단계 효과 역산
  if(cur==='done')delete o.rxdone;
  o.rxstat=prev;
  toast('◀ '+RX_STEPL[prev]+' 단계로 되돌림'+(eff?' · '+eff+' 원복':''));render();await saveOrd(o);}
async function rxDelete(id){const o=ORD.find(x=>x.id===id);if(!o)return;const flow=rxFlow(o.rxtype),i=flow.indexOf(o.rxstat);
  const hadStock=flow.slice(1,i+1).some(s=>s==='gotback'||s==='reship');
  if(!confirm(`이 ${RX_TYPES[o.rxtype].l} 건을 삭제하고 원래 출고완료 상태로 되돌릴까요?${hadStock?'\n진행 중 변경된 재고도 자동 원복됩니다.':''}`))return;
  for(let k=i;k>=1;k--){await rxStepStockEffect(o,flow[k],-1);}   // 진입했던 단계 전부 역산
  ['rxtype','rxstat','rxreason','fault','rxnew','rxdate','rxdone'].forEach(k=>delete o[k]);
  toast('🗑️ 취소 · 원래 상태로 복구');render();await saveOrd(o);}

function rxCard(o){const t=RX_TYPES[o.rxtype],flow=rxFlow(o.rxtype),i=flow.indexOf(o.rxstat),next=flow[i+1];const nextL={recall:'택배 회수신청',gotback:`회수입고 (재고 +${o.qty||1})`,reship:`새상품 재발송 (재고 −${o.qty||1})`,refunded:'환불완료',done:'완료처리'};

function rxFaultBoard(all){const m={};all.filter(o=>o.fault&&o.fault!=='무과실').forEach(o=>{const k=faulteeOf(o);m[k]=m[k]||{n:0,reasons:{}};m[k].n++;m[k].reasons[o.rxreason||'기타']=(m[k].reasons[o.rxreason||'기타']||0)+1;});const keys=Object.keys(m).sort((a,b)=>m[b].n-m[a].n);
  if(!keys.length)return `<div class="card"><div class="muted" style="padding:16px">기록된 과실(귀책)이 없습니다 · 회사귀책 사유로 접수된 건만 집계됩니다</div></div>`;

/* ===== 판매현황 상태 분류 — 판매관리·출고장과 동일한 ORD 필드에서 실시간 판정 ===== */
const SHP_STATES=[{k:'all',l:'전체'},{k:'unpack',l:'미포장'},{k:'pack',l:'포장(출고전)'},{k:'done',l:'출고완료'},{k:'back',l:'미송'},{k:'bundle',l:'합배'},{k:'exch',l:'교환중'},{k:'refund',l:'환불중'}];
const SHP_STATE_PILL={unpack:['p-gray','미포장'],pack:['p-req','포장'],done:['p-done','출고완료'],back:['p-low','미송'],bundle:['p-purple','합배'],exch:['p-req','교환중'],refund:['p-low','환불중']};
function saleStatus(o){
  if(o.pay!=='paid')return null;
  if(o.rxtype&&o.rxstat!=='done')return o.rxtype==='exchange'?'exch':'refund';
  if(o.ship==='done'&&o.track)return 'done';
  if(o.req==='미송'||o.back)return 'back';
  if(o.req==='합배요청')return 'bundle';
  return progOf(o)==='포장'?'pack':'unpack';
}
function statusBaseRows(){
  if(SHPFROM===undefined){const ym=dataLastYM();SHPFROM=ym+'-01';SHPTO=ym+'-31';}
  let rows=mine(ORD).filter(o=>o.pay==='paid').filter(o=>{const d=(o.date||'').replace(/\//g,'-');return (!SHPFROM||d>=SHPFROM)&&(!SHPTO||d<=SHPTO);});
  if(SHPQ){if(SHPFIELD==='상품번호')rows=rows.filter(o=>inc(o.code,SHPQ)||inc(skuFullCode(o.code,o.color,o.size),SHPQ)||inc(itemLabel(o),SHPQ));else if(SHPFIELD==='번호표')rows=rows.filter(o=>inc(tagShow(o),SHPQ));else if(SHPFIELD==='송장')rows=rows.filter(o=>inc(o.track,SHPQ));else rows=rows.filter(o=>inc(o.cust,SHPQ));}
  return rows;
}
/* 반품(출고됨)과 환불(미출고)은 같은 rxtype='refund' — 라벨만 출고여부로 구분 */
function rxTypeLabel(o){return o.rxtype==='refund'?((o.ship==='done'&&o.track)?'반품':'환불'):((RX_TYPES[o.rxtype]||{}).l||'CS');}
/* 미출고 상태에서 취소/환불 — 모달로 열어 적립금 적립 여부 확인 후 처리 */
let CANCELDRAFT=null;
function cancelSale(id,kind){const o=ORD.find(x=>x.id===id);if(!o)return;CANCELDRAFT={id,kind:kind||'취소',amount:amtOf(o),toPoints:false};renderCancelModal(o);}
function renderCancelModal(o){const d=CANCELDRAFT;const bal=custPoints(o.cust);

    <label>환불 금액</label><input id="cxAmt" type="number" value="${d.amount}" oninput="CANCELDRAFT.amount=parseInt(this.value)||0" style="font-size:15px;font-weight:700">
    <label style="display:flex;align-items:center;gap:8px;margin-top:14px;cursor:pointer;font-weight:700"><input type="checkbox" ${d.toPoints?'checked':''} onchange="CANCELDRAFT.toPoints=this.checked;renderCancelModal(ORD.find(x=>x.id===CANCELDRAFT.id))"> 💰 현금 환불 대신 <b style="color:#059669">적립금으로 적립</b></label>
    <div class="note" style="margin-top:10px">${d.toPoints?`💰 <b>${esc(o.cust)}</b> 적립금 <b style="color:#059669">+${won(d.amount)}</b> (현재 ${won(bal)} → <b>${won(bal+d.amount)}</b>)`:'💵 현금/계좌 환불은 사장님이 직접 처리하세요. 차감됐던 재고는 복원됩니다.'}</div>
    <div class="modal-foot"><button class="btn gray" onclick="closeModal()">닫기</button><button class="btn" onclick="cancelSaleCommit()">${d.kind} 확정</button></div>`;
  $('#modal').classList.remove('hide');}
async function cancelSaleCommit(){const d=CANCELDRAFT;if(!d)return;const o=ORD.find(x=>x.id===d.id);if(!o){closeModal();return;}
  const cust=o.cust,item=itemLabel(o),amt=Math.max(0,d.amount||0),toP=d.toPoints,kind=d.kind;
  const i=ORD.indexOf(o);if(i>=0)ORD.splice(i,1);const s=skuOf(o.code,o.color,o.size);
  closeModal();CANCELDRAFT=null;
  toast('🗑️ '+kind+' 처리 → 재고 복원'+(toP?' · 적립금 +'+won(amt):''));render();
  await delOrd(o);if(s)await adjustStockDB(s,o.qty,kind,cust);
  // 이 주문에 사용한 적립금이 있으면 자동 환원(1회) + 적립금 라인 제거
  const ptLine=ORD.find(x=>x.cust===cust&&x.date===o.date&&x.code==='적립금');
  if(ptLine){const used=Math.abs(ptLine.price||0);const pi=ORD.indexOf(ptLine);if(pi>=0)ORD.splice(pi,1);await delOrd(ptLine);if(used>0){await addPoints(cust,used,'적립복원',{item:kind+' 환원',amount:used});toast('💰 사용한 적립금 '+won(used)+' 자동 환원');render();}}
  if(toP)await addPoints(cust,amt,kind,{item,amount:amt,reason:'적립금 적립'});
  else await logCust(cust,kind,{item,amount:amt,reason:'현금/계좌 환불'});
}
/* 판매현황 상태별 액션 버튼 — 출고완료: 교환/반품 · 미출고: 환불/취소 */
function csActionCell(o){const B='btn sm ghost',ST='padding:3px 7px;font-size:11px';
  if(o.rxtype)return `<span class="pill ${o.rxstat==='done'?'':'p-req'}">${rxTypeLabel(o)}${o.rxstat==='done'?' 완료':' 진행'}</span>`;

function statusCard(g){const tot=g.items.reduce((a,o)=>a+amtOf(o),0),k='ss:'+g.date+g.cust;

/* ===== 고객관리 ===== */

function custStats(){const m={};ORD.forEach(o=>{if(!o.cust)return;if(o.code==='배송비'||o.code==='적립금')return;/* 서비스라인 제외 — 실제 구매 상품만 집계 */const x=m[o.cust]||(m[o.cust]={cnt:0,amt:0,last:'',_dates:new Set()});x.cnt++;x.amt+=amtOf(o);x._dates.add(o.date);if((o.date||'')>x.last)x.last=o.date||'';});Object.values(m).forEach(x=>{x.orders=x._dates.size;});return m;}
/* ===== 고객별 원장(적립금·취소·환불 이력) ===== */
function custPoints(name){const c=CUSTOMERS.find(x=>x.name===name);return (c&&c.points)||0;}
async function logCust(custName,type,opt){opt=opt||{};const c=CUSTOMERS.find(x=>x.name===custName);const owner=(c&&c.owner)||((typeof ME!=='undefined'&&ME&&(ME.owner||ME.name)))||null;
  try{const {error}=await SB.from('cust_log').insert({cust:custName,owner:owner,type:type,item:opt.item||null,amount:opt.amount||0,points_delta:opt.points||0,reason:opt.reason||null,staff:(typeof ME!=='undefined'&&ME&&ME.name)||null});if(error)console.error('logCust',error);}catch(e){console.error('logCust',e);}}
async function addPoints(custName,delta,type,opt){opt=opt||{};const c=CUSTOMERS.find(x=>x.name===custName);if(!c){toast('고객을 찾을 수 없어요');return false;}
  const nv=Math.max(0,(c.points||0)+delta);c.points=nv;
  try{const {error}=await SB.from('customers').update({points:nv}).eq('id',c.id);if(error){console.error('points',error);toast('⚠️ 적립금 저장 실패 — 다시 시도하세요');}}catch(e){console.error(e);}
  await logCust(custName,type,{points:delta,amount:opt.amount||0,item:opt.item||null,reason:opt.reason||null});
  return true;}

  ${sec('🚩 주의/블랙리스트',`<div style="padding:2px 0"><div style="display:flex;gap:6px;margin-bottom:10px">${flagBtn(null,'정상','')}${flagBtn('주의','⚠️ 주의','btn')}${flagBtn('블랙리스트','⛔ 블랙리스트','red')}</div><label>메모 <span class="muted" style="font-size:11px">문제 이력·특이사항</span></label><textarea id="cdMemo" style="width:100%;height:70px;padding:10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px" placeholder="예: 잦은 단순변심 취소, 반말 고객 등">${esc(c.memo||'')}</textarea><div style="margin-top:8px"><button class="btn sm" onclick="saveCustMemo(${c.id})">메모 저장</button></div></div>`)}`;

async function setCustFlag(id,flag){const c=CUSTOMERS.find(x=>x.id===id);if(!c)return;c.flag=flag||null;try{const {error}=await SB.from('customers').update({flag:c.flag}).eq('id',id);if(error){console.error(error);toast('⚠️ 저장 실패');}}catch(e){console.error(e);}toast(flag?('🚩 '+flag+': '+c.name):'표시 해제: '+c.name);openCustDetail(id);}

async function custAdjustPoints(id,sign){const c=CUSTOMERS.find(x=>x.id===id);if(!c)return;const raw=prompt((sign>0?'적립할':'차감할')+' 금액 (원)');if(raw==null)return;const amt=parseInt(String(raw).replace(/[^\d]/g,''))||0;if(amt<=0){toast('금액을 입력하세요');return;}const reason=prompt('사유 (선택)','')||'';await addPoints(c.name,sign*amt,sign>0?'적립조정':'적립차감',{reason:reason||'수동 조정'});toast((sign>0?'💰 적립 +':'➖ 차감 −')+won(amt)+' · '+c.name);openCustDetail(id);}
function custPhoneNorm(p){return (p||'').replace(/[^0-9]/g,'');}
function formatPhone(p){const d=custPhoneNorm(p);if(d.length===11)return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');if(d.length===10)return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');return p||'';}
function phoneDupGroups(){const m={};CUSTOMERS.forEach(c=>{const p=custPhoneNorm(c.phone);if(p.length>=8)(m[p]=m[p]||[]).push(c);});return Object.values(m).filter(a=>a.length>1).sort((a,b)=>b.length-a.length);}
function custAvatar(name){const ch=(name||'?').trim().charAt(0)||'?';const colors=['#2563eb','#7c3aed','#db2777','#ea580c','#059669','#0891b2','#4f46e5'];let h=0;for(const c of (name||'?'))h=(h*31+c.charCodeAt(0))%colors.length;return `<span style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:${colors[h]};color:#fff;font-weight:800;font-size:14px;flex:0 0 auto">${esc(ch)}</span>`;}

function prodSales(){
  const O=ORD.filter(o=>o.pay==='paid'&&!/낱장|배송비|택배|합배|무나|무료나눔|^일반$/.test((o.disp||'')+'|'+(o.code||'')));
  const bar=(lab,frac,val)=>`<div class="pbar-row"><span class="pbar-lab">${esc(lab)}</span><div class="pbar-track"><div class="pbar-fill" style="width:${Math.max(2,Math.round(frac*100))}%"></div></div><span class="pbar-val">${val}</span></div>`;
  const bp={};O.forEach(o=>{const k=o.code+'|'+(o.disp||'');const x=bp[k]||(bp[k]={name:o.disp||o.code,qty:0,amt:0});x.qty+=(o.qty||0);x.amt+=(o.qty||0)*(o.price||0);});
  const best=Object.values(bp).sort((a,b)=>b.qty-a.qty).slice(0,15);
  const bm={};O.forEach(o=>{const m=(o.date||'').slice(0,7);if(!/^\d{4}-\d{2}$/.test(m))return;const x=bm[m]||(bm[m]={amt:0,cnt:0});x.amt+=(o.qty||0)*(o.price||0);x.cnt++;});
  const monArr=Object.entries(bm).sort();const maxMon=Math.max(1,...monArr.map(x=>x[1].amt));
  const bc={};O.forEach(o=>{const x=bc[o.cust]||(bc[o.cust]={amt:0,cnt:0});x.amt+=(o.qty||0)*(o.price||0);x.cnt++;});
  const custArr=Object.entries(bc).sort((a,b)=>b[1].amt-a[1].amt).slice(0,15);
  const bands=[[0,10000,'1만원 미만'],[10000,30000,'1~3만원'],[30000,50000,'3~5만원'],[50000,100000,'5~10만원'],[100000,9e12,'10만원 이상']];
  const bandArr=bands.map(([lo,hi,lab])=>({lab,n:O.filter(o=>o.price>=lo&&o.price<hi).reduce((a,o)=>a+(o.qty||0),0)}));const maxBand=Math.max(1,...bandArr.map(x=>x.n));

function prodCompose(){
  const isSvc=s=>/배송비|낱장|합배|무료나눔|무나|서비스|택배|^일반$/.test((s.name||''))||/배송비|낱장|합배|무나|택배/.test((s.tag||''));
  const P=STOCK.filter(s=>!isSvc(s));
  const rq=s=>(s.qty>0&&s.qty<50000)?s.qty:0;  // 99999/999999 더미 재고 제외
  const dummy=P.filter(s=>s.qty>=50000).length;
  const codes=new Set(P.map(s=>s.code));
  const totalQty=P.reduce((a,s)=>a+rq(s),0);
  const totalAmt=P.reduce((a,s)=>a+rq(s)*s.price,0);
  const sold=P.filter(s=>s.qty<=0).length, low=P.filter(s=>s.qty>0&&s.qty<=3).length;
  const byCat={}; P.forEach(s=>{const c=s.category||'미분류';const o=byCat[c]||(byCat[c]={sku:0,qty:0,amt:0});o.sku++;o.qty+=rq(s);o.amt+=rq(s)*s.price;});
  const catArr=Object.entries(byCat).sort((a,b)=>b[1].sku-a[1].sku);
  const maxCatSku=Math.max(1,...catArr.map(x=>x[1].sku));
  const bands=[[0,10000,'1만원 미만'],[10000,30000,'1~3만원'],[30000,50000,'3~5만원'],[50000,100000,'5~10만원'],[100000,9e12,'10만원 이상']];
  const bandArr=bands.map(([lo,hi,lab])=>({lab,n:P.filter(s=>s.price>=lo&&s.price<hi).length}));
  const maxBand=Math.max(1,...bandArr.map(x=>x.n));
  const bySub={}; P.forEach(s=>{if(s.subcategory){bySub[s.subcategory]=(bySub[s.subcategory]||0)+1;}});
  const subArr=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const maxSub=Math.max(1,...subArr.map(x=>x[1]));
  const bar=(lab,frac,val)=>`<div class="pbar-row"><span class="pbar-lab">${esc(lab)}</span><div class="pbar-track"><div class="pbar-fill" style="width:${Math.max(2,Math.round(frac*100))}%"></div></div><span class="pbar-val">${val}</span></div>`;
  return `
  <div class="kpis">
    <div class="kpi"><div><div class="lab">총 품목(스타일)</div><div class="num">${codes.size.toLocaleString()}</div><div class="sub">${STOCK.length.toLocaleString()} SKU (색상·사이즈)</div></div><div class="ic ic-b"><i class="ti ti-tag"></i></div></div>
    <div class="kpi"><div><div class="lab">총 재고수량</div><div class="num">${totalQty.toLocaleString()}</div><div class="sub">판매가능 합계</div></div><div class="ic ic-g"><i class="ti ti-stack-2"></i></div></div>
    <div class="kpi"><div><div class="lab">재고 금액</div><div class="num" style="font-size:19px">${won(totalAmt)}</div><div class="sub">출고가 기준</div></div><div class="ic ic-p"><i class="ti ti-coin"></i></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>카테고리별 보유 현황</h2><span class="muted" style="font-size:12px">SKU 수 기준 · 카테고리는 재고관리에서 품목 수정 시 지정</span></div>
    ${catArr.map(([c,v])=>bar(c,v.sku/maxCatSku,`${v.sku.toLocaleString()} SKU · 재고 ${v.qty.toLocaleString()}개 · ${won(v.amt)}`)).join('')}
  </div>
  <div class="card" style="margin-top:14px"><div class="card-h"><h2>가격대별 분포</h2><span class="muted" style="font-size:12px">출고가(판매가) 기준 SKU 수</span></div>
    ${bandArr.map(b=>bar(b.lab,b.n/maxBand,`${b.n.toLocaleString()} SKU`)).join('')}
  </div>
  ${subArr.length?`<div class="card" style="margin-top:14px"><div class="card-h"><h2>종류별 분포 <span class="muted" style="font-size:12px;font-weight:400">상위 12</span></h2></div>
    ${subArr.map(([s,n])=>bar(s,n/maxSub,`${n.toLocaleString()} SKU`)).join('')}
  </div>`:''}
  ${SHIPPING&&SHIPPING.length?`<div class="card" style="margin-top:14px"><div class="card-h"><h2>월별 배송비 합계 <span class="muted" style="font-size:12px;font-weight:400">상품 매출과 별도 집계 · 총 ${won(SHIPPING.reduce((a,s)=>a+(s.amount||0),0))}</span></h2></div>
    <table><thead><tr><th>월</th><th class="num-cell">배송비 합계</th><th class="num-cell">건수</th></tr></thead><tbody>
    ${SHIPPING.map(s=>`<tr><td>${s.month}</td><td class="num-cell">${won(s.amount)}</td><td class="num-cell muted">${s.cnt}건</td></tr>`).join('')}
    <tr style="font-weight:800;border-top:2px solid #e2e8f0"><td>합계</td><td class="num-cell">${won(SHIPPING.reduce((a,s)=>a+(s.amount||0),0))}</td><td class="num-cell muted">${SHIPPING.reduce((a,s)=>a+(s.cnt||0),0)}건</td></tr>
    </tbody></table></div>`:''}`;
}

/* ===== 📸 영수증 자동입고 (사입 영수증 사진 → AI 파싱 → 입고목록) ===== */
const RECEIPT_API='https://n-live.co.kr/api/parse-receipt/';
function openReceiptScan(){const el=$('#receiptFile');if(!el){toast('업로드 준비 실패 — 새로고침 후 다시');return;}el.value='';el.click();}
function receiptPicked(input){const f=input.files&&input.files[0];if(!f)return;receiptScan(f);}
// 폰 사진은 수 MB라 캔버스로 긴 변 1600px·JPEG로 줄여 업로드(속도·비용↓)
function shrinkImage(file,maxSide){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);let{width:w,height:h}=img;const m=maxSide||1600;if(Math.max(w,h)>m){const r=m/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);resolve(cv.toDataURL('image/jpeg',0.82));};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('이미지를 읽지 못했어요'));};img.src=url;});}
async function receiptScan(file){
  let dataUrl;try{dataUrl=await shrinkImage(file,1600);}catch(e){toast('⚠️ '+e.message);return;}
  toast('📸 AI가 영수증을 읽는 중… (10~20초)');
  let res;try{
    const r=await fetch(RECEIPT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl})});
    res=await r.json();
  }catch(e){toast('⚠️ 서버 연결 실패 — 인터넷 확인 후 다시');return;}
  if(!res||!res.ok){toast('⚠️ '+((res&&res.note)||'인식 실패 — 사진을 더 선명하게 찍어보세요'));return;}
  const items=res.items||[];if(!items.length){toast('품목을 못 찾았어요 — 사진이 흐리면 다시');return;}
  // 같은 품목명 = 같은 상품코드(색상만 다름) → 이름별로 코드 하나씩 자동부여
  let base=parseInt(nextProductCode(),10)||1;const codeByName={};
  items.forEach(it=>{const nm=String(it.name||'').trim();if(!codeByName[nm]){codeByName[nm]=String(base).padStart(6,'0');base++;}});
  items.forEach(it=>{const nm=String(it.name||'').trim();
    STAGED.unshift({chk:true,tag:'-',code:codeByName[nm],vendor:null,name:nm,color:String(it.color||'').trim()||'-',size:String(it.size||'').trim()||'F',in_price:parseInt(it.price)||0,price:0,category:null,subcategory:null,season:null,qty:parseInt(it.qty)||1});
  });
  toast('✅ 영수증에서 '+items.length+'개 품목을 입고목록에 담았어요 — 출고가·번호표 확인 후 저장하세요');render();
}

const PAY_BASE={'셀러':2000000,'보조':2300000,'운영':2300000,'물류':2300000,'관리자':3000000};
const PAY_RATE={'셀러':10,'보조':3,'운영':0,'물류':0,'관리자':0};
function _staffSales(name){return ORD.filter(o=>o.staff===name&&o.pay==='paid'&&_inRange(o,'month')&&o.code!=='배송비'&&o.code!=='낱장').reduce((a,o)=>a+amtOf(o),0);}
function empPay(e){const base=(e.base_salary!=null&&e.base_salary!==''&&+e.base_salary>0)?+e.base_salary:(PAY_BASE[e.role]||0);const rate=(e.comm_rate!=null&&e.comm_rate!==''&&+e.comm_rate>=0&&String(e.comm_rate)!=='')?+e.comm_rate:(PAY_RATE[e.role]||0);const sales=(e.role==='셀러'||e.role==='보조')?_staffSales(e.name):0;const comm=Math.round(sales*rate/100);return {base:base,rate:rate,sales:sales,comm:comm,total:base+comm};}
function saveEmpPay(idx,field,val){const e=EMPLOYEES[idx];if(!e)return;e[field]=(val===''?null:Math.max(0,parseFloat(val)||0));render();if(e.id!=null)SB.from('employees').update({[field]:e[field]}).eq('id',e.id).then(function(r){if(r.error){toast('⚠️ 급여 저장 실패 — 다시 시도');console.warn('empPay',r.error.message);}else toast('💾 저장됨');});}

let BULK={};

const KAKAO_TPL=[{name:'입금완료 안내',status:'승인',ex:'입금이 확인되었습니다 ✓ 곧 준비할게요'},{name:'출고/송장 안내',status:'승인',ex:'상품이 출고되었어요 · 송장 6979-...'},{name:'미송 안내',status:'심사중',ex:'일부 상품이 미송 처리됐어요'},{name:'재입고 안내',status:'승인',ex:'재입고 완료! 곧 발송돼요'}];
const KAKAO_LOG=[{dt:'06/29 14:20',cust:'박시연',type:'입금완료',ok:true,cost:9},{dt:'06/29 11:05',cust:'장양(장은양)',type:'출고/송장',ok:true,cost:9},{dt:'06/29 09:40',cust:'mini(박민희)',type:'입금완료',ok:true,cost:9},{dt:'06/28 18:30',cust:'뚠뚜니(박인애)',type:'재입고',ok:false,cost:0}];
const KAKAO_DESC={'입금완료':'입금확인 시 고객에게 자동 발송','출고/송장':'출고완료 시 송장+배송조회 (택배사 알림으로 대체 가능)','미송/재입고':'미송 안내 및 재입고 시 알림','교환/환불':'교환·환불 진행 안내','취소요청':'주문 취소 안내','사장님 본인알림':'새 주문·입금 시 내 카톡으로 (무료)'};
function toggleKakaoAlert(k){KAKAO.alerts[k]=!KAKAO.alerts[k];toast('알림 '+(KAKAO.alerts[k]?'켜짐':'꺼짐')+': '+k);render();}
function viewKakao(){const t=KAKAOTAB;
  return `
  <div class="head"><h1>카카오 연동 <span class="badge" style="background:#fef3c7;color:#b45309">데모·미연동</span></h1><p>채널 연결 · 알림 설정 · 템플릿 · 발송내역 · 챗봇 (데모)</p></div>
  <div class="note" style="background:#fffbeb;border:1px solid #fcd34d;color:#92400e;margin-bottom:12px">⚠️ <b>아직 실제 연동 전 데모 화면입니다.</b> 아래 연결됨·충전잔액·친구수·발송내역은 모두 <b>샘플 값</b>이며 실제로 발송되지 않습니다. 실연동은 솔라피 등 발송대행 계약 후 적용됩니다.</div>
  <div class="tabs">
    <button class="${t==='set'?'on':''}" onclick="KAKAOTAB='set';render()">연동 설정</button>
    <button class="${t==='alert'?'on':''}" onclick="KAKAOTAB='alert';render()">알림 설정</button>
    <button class="${t==='tpl'?'on':''}" onclick="KAKAOTAB='tpl';render()">템플릿</button>
    <button class="${t==='log'?'on':''}" onclick="KAKAOTAB='log';render()">발송 내역</button>
    <button class="${t==='bot'?'on':''}" onclick="KAKAOTAB='bot';render()">챗봇·고객유입</button>
  </div>
  ${t==='set'?kakaoSet():t==='alert'?kakaoAlert():t==='tpl'?kakaoTpl():t==='log'?kakaoLog():kakaoBot()}`;
}
function kakaoSet(){return `
  <div class="kpis">
    <div class="kpi"><div><div class="lab">채널 연결</div><div class="num" style="font-size:18px;color:#94a3b8">데모</div><div class="sub">@${KAKAO.channel} (샘플)</div></div><div class="ic ic-g"><i class="ti ti-circle-check"></i></div></div>
    <div class="kpi"><div><div class="lab">발송 대행사</div><div class="num" style="font-size:18px">솔라피</div><div class="sub">미연동 (샘플)</div></div><div class="ic ic-b"><i class="ti ti-plug"></i></div></div>
    <div class="kpi"><div><div class="lab">충전 잔액</div><div class="num">${won(KAKAO.balance)}</div><div class="sub warn">약 ${Math.floor(KAKAO.balance/9)}건분</div></div><div class="ic ic-a"><i class="ti ti-wallet"></i></div></div>
    <div class="kpi"><div><div class="lab">채널 친구</div><div class="num">1,284</div><div class="sub up">친구톡 발송 가능</div></div><div class="ic ic-p"><i class="ti ti-users"></i></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>연동 정보</h2></div>
    <table><tbody>
    <tr><td class="muted" style="width:150px">카카오 채널</td><td>@${KAKAO.channel} (비즈니스 인증됨)</td></tr>
    <tr><td class="muted">발송 대행사</td><td>솔라피 (CoolSMS)</td></tr>
    <tr><td class="muted">API Key</td><td class="barcode">SOLAPI-****-****-9F2A</td></tr>
    <tr><td class="muted">발신 프로필</td><td>엔라이브</td></tr>
    </tbody></table>
    <div style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="toast('충전 페이지로 이동 (데모)')">충전하기</button><button class="btn ghost sm" onclick="toast('연결 테스트 발송 (데모)')">연결 테스트</button></div>
  </div>`;
}
function kakaoAlert(){return `
  <div class="card"><div class="note">💡 어떤 알림을 고객에게 자동 발송할지 켜고 끄세요. (사장님 본인알림·챗봇·주소검색은 무료)</div>
  ${Object.keys(KAKAO.alerts).map(k=>`<div class="kw-row"><div><div class="l">${k}</div><div class="d">${KAKAO_DESC[k]||''}</div></div>
    <button class="kw-sw ${KAKAO.alerts[k]?'on':''}" onclick="toggleKakaoAlert('${k}')">${KAKAO.alerts[k]?'ON':'OFF'}</button></div>`).join('')}
  </div>`;
}
function kakaoTpl(){return `
  <div class="card"><div class="card-h"><h2>알림톡 템플릿</h2><span class="muted" style="font-size:12px">카카오 심사 후 사용</span></div>
    <table><thead><tr><th>템플릿명</th><th>상태</th><th>미리보기</th></tr></thead><tbody>
    ${KAKAO_TPL.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.status==='승인'?'<span class="pill p-done">승인</span>':'<span class="pill p-miss">심사중</span>'}</td><td class="muted">${x.ex}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function kakaoLog(){const tot=KAKAO_LOG.reduce((a,x)=>a+x.cost,0);return `
  <div class="card"><div class="card-h"><h2>발송 내역</h2><span class="muted" style="font-size:12px">오늘 ${KAKAO_LOG.length}건 · ${won(tot)}</span></div>
    <table><thead><tr><th>시각</th><th>고객</th><th>종류</th><th>결과</th><th class="num-cell">비용</th></tr></thead><tbody>
    ${KAKAO_LOG.map(x=>`<tr><td class="muted">${x.dt}</td><td>${x.cust}</td><td>${x.type}</td><td>${x.ok?'<span class="pill p-done">성공</span>':'<span class="pill p-low">실패</span>'}</td><td class="num-cell">${x.cost?won(x.cost):'-'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function kakaoBot(){return `
  <div class="kpis">
    <div class="kpi"><div><div class="lab">챗봇</div><div class="num" style="font-size:18px;color:#94a3b8">데모</div><div class="sub">주문·배송 조회 응답 (샘플)</div></div><div class="ic ic-g"><i class="ti ti-robot"></i></div></div>
    <div class="kpi"><div><div class="lab">오늘 챗봇 응답</div><div class="num">47</div><div class="sub">무료</div></div><div class="ic ic-b"><i class="ti ti-message-dots"></i></div></div>
    <div class="kpi"><div><div class="lab">신규 유입(가입)</div><div class="num">12</div><div class="sub up">→ 고객 자동등록</div></div><div class="ic ic-p"><i class="ti ti-user-plus"></i></div></div>
    <div class="kpi"><div><div class="lab">주소 자동완성</div><div class="num" style="font-size:18px">사용중</div><div class="sub">무료</div></div><div class="ic ic-a"><i class="ti ti-map-pin"></i></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>최근 채널 유입 (자동 고객등록)</h2></div>
    <table><thead><tr><th>시각</th><th>닉네임</th><th>연락처</th><th>경로</th></tr></thead><tbody>
    <tr><td class="muted">06/29 13:10</td><td>새벽이(김다은)</td><td class="muted">010-2200-****</td><td>카카오싱크 가입</td></tr>
    <tr><td class="muted">06/29 10:22</td><td>토리맘(이수정)</td><td class="muted">010-7788-****</td><td>채널 추가</td></tr>
    </tbody></table></div>
  <div class="card" style="margin-top:14px"><div class="note">💡 챗봇 응답 · 주소 자동완성 · 채널 유입(고객 자동등록)은 <b>무료</b>. 고객에게 먼저 보내는 알림톡/친구톡만 과금돼요.</div></div>`;
}

/* ===== 라우팅 ===== */
let VIEW='dash',SALETAB='order',RXTAB='ret',STAB='list',bundleSeq=1,SALEFROM,SALETO,SHIPTAB='wait',BACKQ='',CDATE=todayStr(),CQ='',SHIPPOP=false,CUSTPOP=null,SALEQ='',SALEFIELD='닉네임',SALEPOP=null,SHPFROM,SHPTO,SHPQ='',SHPFIELD='닉네임',SHPSTATUS='all',KAKAOTAB='set',PRODEDIT=null,STAGED=[],SFORM={tag:'',code:'',name:'',color:'',size:'',vendor:'',inprice:'',price:'',cat:'',subcat:'',season:'',qty:''},STOCKFIELD='전체',PRODTAB='compose',DONEPERIOD='today',SALESUB='req',ORDTAB='all',REVPERIOD='today',RXSUB='exchange',RXPERIOD='all',SHIPDATE='';
const VIEWS={dash:viewDash,order:viewOrder,sales:viewSales,ship:viewShip,shipped:viewShipped,rx:viewRx,stock:viewStock,cust:viewCustomers,prod:viewProducts,vendor:viewVendor,revenue:viewRevenue,sns:viewSns,emp:viewEmp,users:viewUsers,kakao:viewKakao};
function go(v){if(menuAllowed(v)){VIEW=v;try{history.replaceState(null,'','#'+v)}catch(e){}buildNav();render();}}
function updateTopbar(){$('#tbName').textContent=ME.name;$('#tbRole').textContent=ME.team+' · '+ME.role;$('#tbAv').textContent=ME.name[0];const ab=$('#alertBdg');if(ab){const n=alertCount();ab.textContent=n;ab.style.display=n?'':'none';}}
function render(){_onCache=null;const _mn=$('#main');const _ch=window._lv!==VIEW;window._lv=VIEW;_mn.innerHTML=VIEWS[VIEW]();if(VIEW==='dash')setTimeout(initDashGrid,0);updateTopbar();if(_ch){_mn.classList.remove('view-anim');void _mn.offsetWidth;_mn.classList.add('view-anim');}
  if(CUSTPOP){const c=openCustomers().filter(x=>x.cat===CUSTPOP.cat)[CUSTPOP.i];if(VIEW==='ship'&&c)renderCustPop();else{CUSTPOP=null;$('#modalBox').className='modal-box';$('#modal').classList.add('hide');}}
  if(SALEPOP){const g=curGroups()[SALEPOP.gi];if(VIEW==='sales'&&SALETAB===SALEPOP.tab&&g)renderSalePop();else{SALEPOP=null;$('#modalBox').className='modal-box';$('#modal').classList.add('hide');}}}
function buildNav(){[...$('#nav').querySelectorAll('button')].forEach(b=>{b.style.display=menuAllowed(b.dataset.v)?'flex':'none';b.classList.toggle('on',b.dataset.v===VIEW);});}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!menuAllowed(b.dataset.v))return;VIEW=b.dataset.v;try{history.replaceState(null,'','#'+VIEW)}catch(e){}buildNav();render();});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&VIEWS[h]&&menuAllowed(h)&&h!==VIEW){VIEW=h;buildNav();render();}});
document.addEventListener('keydown',e=>{if(e.key==='F8'&&VIEW==='order'){e.preventDefault();commitOrder();}});
rebuildSwitcher();buildNav();render();
/* 세션 자동복원: 새로고침해도 로그인 유지 */
(async()=>{
  try{
    const {data}=await SB.auth.getSession();
    if(data&&data.session){
      const id=(data.session.user.email||'').split('@')[0];
      const {data:emp}=await SB.from('employees').select('*').eq('login_id',id).maybeSingle();
      if(!emp||emp.active===false)return;
      ME={name:emp.name,id:emp.login_id,team:emp.team,role:emp.role,scope:emp.scope,owner:emp.owner||emp.name,auth_id:emp.auth_id};
      $('#login').style.display='none';   // 세션 확인 즉시 숨김 — 데이터 로딩 동안 로그인 화면 깜빡임/튕김 방지
      {const _h=location.hash.slice(1);if(_h&&VIEWS[_h]&&menuAllowed(_h))VIEW=_h;}
      if(!menuAllowed(VIEW))VIEW='dash';
      rebuildSwitcher();buildNav();
      const _mn=$('#main');if(_mn)_mn.innerHTML='<div style="padding:64px 20px;text-align:center;color:#94a3b8;font-size:15px">📥 '+esc(emp.name)+'님 데이터 불러오는 중…</div>';
      await loadPrefs();
      await dbLoadAll();
      render();startRealtime();
    }
  }catch(e){console.error('session',e);}
})();
</script>
