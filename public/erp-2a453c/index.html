        <div><label>방송가(원)</label><input id="lm_price" type="number" placeholder="10000"></div></div>
      <label>품목명</label><input id="lm_name" placeholder="예: 벨벳 헤어핀">
      <div class="row2"><div><label>수량(판매가능)</label><input id="lm_qty" type="number" value="1"></div>
        <div><label>색상(선택, 쉼표)</label><input id="lm_colors" placeholder="비우면 옵션없음"></div></div>
      <label>상품 이미지(선택)</label>
      ${imgPickerHtml('lm')}
    </div>
    <div class="modal-foot"><button class="btn gray" onclick="closeModal()">취소</button><button class="btn" id="lm_save" onclick="liveSaveManual()">추가</button></div>`;
  $('#modal').classList.remove('hide');imgPickerBind('lm');
}
async function liveSaveManual(){
  const sid=window._liveAddSid;const code=($('#lm_code').value||'').trim();const name=($('#lm_name').value||'').trim();const price=+$('#lm_price').value||0;const qty=Math.max(1,+$('#lm_qty').value||1);
  if(!code){toast('품목번호를 입력하세요');return;}if(!name){toast('품목명을 입력하세요');return;}if(price<=0){toast('방송가를 입력하세요');return;}
  const btn=$('#lm_save');btn.disabled=true;btn.textContent='저장 중...';
  let image_url=null;
  try{
    image_url=await imgResolveUrl(sid);
    const sort=(liveProdsOf(sid).reduce((m,p)=>Math.max(m,p.sort),0))+1;
    const {error}=await SB.from('session_products').insert({session_id:sid,stock_code:null,manual_code:code,name,live_price:price,max_qty:qty,colors:($('#lm_colors').value||'').trim()||null,image_url,sort,active:true});
    if(error){console.error(error);toast('⚠️ 추가 실패: '+(error.message||''));btn.disabled=false;btn.textContent='추가';return;}
    closeModal();toast('✅ 개별상품 추가: '+name);await liveReload();
  }catch(e){console.error(e);toast('⚠️ 오류');btn.disabled=false;btn.textContent='추가';}
}
async function liveSetPrice(id,v){const price=+v||0;try{const {error}=await SB.from('session_products').update({live_price:price}).eq('id',id);if(error){console.error(error);toast('⚠️ 저장 실패');return;}const p=SESS_PROD.find(x=>x.id===id);if(p)p.live_price=price;toast('방송가 저장');}catch(e){console.error(e);}}
async function liveToggleNow(id){const p=SESS_PROD.find(x=>x.id===id);if(!p)return;const nv=!p.is_now;
  try{if(nv){await SB.from('session_products').update({is_now:false}).eq('session_id',p.session_id);}
    const {error}=await SB.from('session_products').update({is_now:nv}).eq('id',id);if(error){console.error(error);toast('⚠️ 실패');return;}
    await liveReload();}catch(e){console.error(e);}}
async function liveToggleActive(id){const p=SESS_PROD.find(x=>x.id===id);if(!p)return;try{const {error}=await SB.from('session_products').update({active:!p.active}).eq('id',id);if(error){console.error(error);toast('⚠️ 실패');return;}await liveReload();}catch(e){console.error(e);}}
async function liveMove(id,dir){const p=SESS_PROD.find(x=>x.id===id);if(!p)return;const list=liveProdsOf(p.session_id);const i=list.findIndex(x=>x.id===id);const j=i+dir;if(j<0||j>=list.length)return;
  const a=list[i],b=list[j];const sa=a.sort,sb=b.sort;try{await SB.from('session_products').update({sort:sb}).eq('id',a.id);await SB.from('session_products').update({sort:sa}).eq('id',b.id);await liveReload();}catch(e){console.error(e);}}
async function liveDelProduct(id){const p=SESS_PROD.find(x=>x.id===id);if(!p)return;if(!confirm("'"+(p.name||'')+"' 상품을 방송에서 뺄까요?"))return;
  try{const {error}=await SB.from('session_products').delete().eq('id',id);if(error){console.error(error);toast('⚠️ 삭제 실패');return;}toast('삭제됨');await liveReload();}catch(e){console.error(e);}}

const VIEWS={dash:viewDash,order:viewOrder,sales:viewSales,live:viewLive,ship:viewShip,bo:viewBackorder,shipped:viewShipped,rx:viewRx,stock:viewStock,cust:viewCustomers,prod:viewProducts,vendor:viewVendor,revenue:viewRevenue,sns:viewSns,emp:viewEmp,users:viewUsers,kakao:viewKakao};
const VIEW_LABELS={dash:'대시보드',order:'주문관리',sales:'판매관리',live:'라이브 판매',ship:'출고장',bo:'미송사입',shipped:'판매현황',rx:'교환·반품',stock:'재고관리',revenue:'매출현황',sns:'SNS 관리',cust:'고객관리',prod:'상품현황',vendor:'사입처관리',emp:'직원·급여',users:'사원관리',kakao:'카카오 연동'};
function toggleSideNav(force){
  const side=$('#sideNav'),dim=$('#sideDim');if(!side||!dim)return;
  const open=force==null?!side.classList.contains('open'):!!force;
  side.classList.toggle('open',open);dim.classList.toggle('open',open);
  const btn=document.querySelector('.side-toggle');if(btn){btn.setAttribute('aria-expanded',String(open));btn.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');}
}
function closeSideNav(){toggleSideNav(false);}
function enhanceResponsiveUI(root){
  if(!root)return;
  root.querySelectorAll('table').forEach(t=>{if(t.parentElement&&t.parentElement.classList.contains('table-wrap'))return;const w=document.createElement('div');w.className='table-wrap';t.parentNode.insertBefore(w,t);w.appendChild(t);});
}
function go(v){if(menuAllowed(v)){VIEW=v;try{history.replaceState(null,'','#'+v)}catch(e){}buildNav();render();}}
function updateTopbar(){$('#tbName').textContent=ME.name;$('#tbRole').textContent=ME.team+' · '+ME.role;$('#tbAv').textContent=ME.name[0];const ab=$('#alertBdg');if(ab){const n=alertCount();ab.textContent=n;ab.style.display=n?'':'none';}}
function render(){_onCache=null;const _mn=$('#main');const _ch=window._lv!==VIEW;window._lv=VIEW;_mn.innerHTML=VIEWS[VIEW]();enhanceResponsiveUI(_mn);if(VIEW==='dash')setTimeout(initDashGrid,0);updateTopbar();const cv=$('#currentView');if(cv)cv.textContent=VIEW_LABELS[VIEW]||'';if(_ch){_mn.classList.remove('view-anim');void _mn.offsetWidth;_mn.classList.add('view-anim');}
  if(CUSTPOP){const c=shipSort(openCustomers().filter(x=>x.cat===CUSTPOP.cat))[CUSTPOP.i];if(VIEW==='ship'&&c)renderCustPop();else{CUSTPOP=null;$('#modalBox').className='modal-box';$('#modal').classList.add('hide');}}
  if(SALEPOP){const g=curGroups()[SALEPOP.gi];if(VIEW==='sales'&&SALETAB===SALEPOP.tab&&g)renderSalePop();else{SALEPOP=null;$('#modalBox').className='modal-box';$('#modal').classList.add('hide');}}}
function buildNav(){[...$('#nav').querySelectorAll('button')].forEach(b=>{b.style.display=menuAllowed(b.dataset.v)?'flex':'none';b.classList.toggle('on',b.dataset.v===VIEW);});}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!menuAllowed(b.dataset.v))return;VIEW=b.dataset.v;try{history.replaceState(null,'','#'+VIEW)}catch(e){}buildNav();render();if(innerWidth<1024)closeSideNav();});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&VIEWS[h]&&menuAllowed(h)&&h!==VIEW){VIEW=h;buildNav();render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sideNav')&&$('#sideNav').classList.contains('open'))closeSideNav();if(e.key==='F8'&&VIEW==='order'){e.preventDefault();commitOrder();}});
/* 검색 드롭다운(.drop2) — 바깥 클릭/ESC 시 닫기 (교환 새상품·고객·품목 검색 공통) */
function closeAllDrops(){document.querySelectorAll('.drop2').forEach(d=>{if(d.innerHTML)d.innerHTML='';});}
document.addEventListener('click',e=>{if(e.target.closest('.drop2')||e.target.closest('#rxq,#custIn,#entryIn'))return;closeAllDrops();},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){let any=false;document.querySelectorAll('.drop2').forEach(d=>{if(d.innerHTML){d.innerHTML='';any=true;}});if(any){e.stopPropagation();const a=document.activeElement;if(a&&/rxq|custIn|entryIn/.test(a.id))a.blur();}}},true);
let _responsiveResizeT=null,_responsiveDashBp=dashBreakpoint();
window.addEventListener('resize',()=>{if(innerWidth>=1024)closeSideNav();clearTimeout(_responsiveResizeT);_responsiveResizeT=setTimeout(()=>{const bp=dashBreakpoint();if(VIEW==='dash'&&bp!==_responsiveDashBp){_responsiveDashBp=bp;render();}},160);});
new MutationObserver(()=>enhanceResponsiveUI($('#modalBox'))).observe($('#modalBox'),{childList:true,subtree:true});
rebuildSwitcher();buildNav();render();
/* 세션 자동복원: 새로고침해도 로그인 유지 */
(async()=>{
  try{
    const {data}=await SB.auth.getSession();
    if(data&&data.session){
      const id=(data.session.user.email||'').split('@')[0];
      const {data:emp}=await SB.from('employees').select('*').eq('login_id',id).maybeSingle();
      if(!emp||emp.active===false)return;
      ME={name:emp.name,id:emp.login_id,team:emp.team,role:emp.role,scope:emp.scope,owner:emp.owner||emp.name,auth_id:emp.auth_id,stock_edit:!!emp.stock_edit,perms:emp.perms||null};
      $('#login').style.display='none';   // 세션 확인 즉시 숨김 — 데이터 로딩 동안 로그인 화면 깜빡임/튕김 방지
      {const _h=location.hash.slice(1);if(_h&&VIEWS[_h]&&menuAllowed(_h))VIEW=_h;}
      if(!menuAllowed(VIEW))VIEW='dash';
      rebuildSwitcher();buildNav();
      const _mn=$('#main');if(_mn)_mn.innerHTML='<div style="padding:64px 20px;text-align:center;color:#94a3b8;font-size:15px">📥 '+esc(emp.name)+'님 데이터 불러오는 중…</div>';
      await loadPrefs();
      await dbLoadAll();
      render();startRealtime();
    }
  }catch(e){console.error('session',e);}
})();
</script>
