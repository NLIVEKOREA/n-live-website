<head>

<style>
  .grid-stack{background:transparent;margin:0 -6px}
  .grid-stack-item-content{inset:0;overflow:hidden;border-radius:16px;display:flex}
  .grid-stack-item-content>.card,.grid-stack-item-content>.kpi{height:100%!important;width:100%;margin:0!important;min-height:0!important;box-sizing:border-box;overflow:auto}
  .grid-stack-item-content>.card{display:flex;flex-direction:column}
  .grid-stack-item-content>.card>.card-h{position:sticky;top:0;background:#fff;z-index:2;padding-top:1px}
  .grid-stack>.grid-stack-item>.ui-resizable-se{filter:none;width:18px;height:18px}
  .grid-stack-item .ui-resizable-handle{opacity:0;transition:opacity .15s}
  .grid-stack-item:hover .ui-resizable-handle{opacity:.55}
  .grid-stack-item-content>.wx{position:absolute;top:7px;right:9px;z-index:6;width:22px;height:22px;border:none;background:rgba(148,163,184,.18);color:#64748b;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;padding:0;opacity:0;transition:opacity .15s}
  .grid-stack-item:hover>.grid-stack-item-content>.wx{opacity:1}

  .grid-stack-item-content::-webkit-scrollbar{width:6px;height:6px}
  .grid-stack-item-content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
  .workcal{height:100%;width:100%;display:flex;flex-direction:column;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 4px 18px rgba(15,23,42,.05);overflow:hidden}
  .workcal-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid #eef2f7;background:#fff}
  .workcal-title{flex:1;min-width:0}.workcal-title h2{font-size:16px;margin:0;color:#111827}.workcal-title p{font-size:11.5px;color:#64748b;margin:4px 0 0}
  .workcal-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding-right:20px}
  .workcal-summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;padding:10px 14px;background:#f8fafc;border-bottom:1px solid #eef2f7}
  .workcal-stat{min-width:0;padding:8px 9px;background:#fff;border:1px solid #e5e7eb;border-radius:10px}.workcal-stat span{display:block;font-size:10px;color:#64748b;white-space:nowrap}.workcal-stat b{display:block;font-size:14px;color:#111827;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .workcal-salesbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid #eef2f7;background:#fff}.workcal-salesbar>strong{font-size:11px;color:#475569;margin-right:2px}.workcal-saleschip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid #dbeafe;border-radius:999px;background:#eff6ff;color:#1e40af;font-size:10.5px}.workcal-saleschip b{font-size:11px;color:#1d4ed8}
  .workcal-filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid #eef2f7}
  .workcal-search{flex:1;min-width:150px;height:32px!important;padding:5px 10px!important;font-size:12px!important}
  .workcal-filter{height:32px!important;padding:4px 8px!important;font-size:11.5px!important}
  .workcal-body{display:grid;grid-template-columns:minmax(520px,70%) minmax(240px,30%);min-height:0;flex:1}
  .workcal-month{padding:12px;border-right:1px solid #eef2f7;min-width:0;overflow:auto}
  .workcal-month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.workcal-month-head b{font-size:14px;color:#111827}.workcal-month-head button{border:0;background:#f1f5f9;width:28px;height:28px;border-radius:8px;cursor:pointer;color:#475569}
  .workcal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.workcal-dow{text-align:center;font-size:10px;color:#94a3b8;font-weight:700;padding:4px 0}.workcal-day{position:relative;min-height:84px;padding:7px;border:1px solid #eef2f7;border-radius:9px;background:#fff;cursor:pointer;text-align:left;overflow:hidden}.workcal-day:hover{background:#f8fafc;border-color:#bfdbfe}.workcal-day.other{opacity:.35}.workcal-day.today{background:#eff6ff;border-color:#93c5fd}.workcal-day.selected{background:#dbeafe;border-color:#2563eb}.workcal-daynum{font-size:12px;font-weight:800;color:#334155}.workcal-daytags{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:6px}.workcal-daytag{max-width:100%;padding:3px 6px;border:1px solid transparent;border-radius:5px;font-size:9px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workcal-more{font-size:8.5px;color:#64748b;line-height:1.1}
  .workcal-daysale{position:absolute;right:5px;bottom:4px;font-size:9px;font-weight:800;color:#0f766e;background:#ecfdf5;border-radius:5px;padding:1px 4px;line-height:1.3}
  .workcal-daysales{margin:0 0 10px;padding:10px 12px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:11px}
  .workcal-daysales-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}.workcal-daysales-head b{font-size:12.5px;color:#166534}.workcal-daysales-head .ds-total{font-size:16px;font-weight:800;color:#065f46}.workcal-daysales-head .ds-split{font-size:10.5px;color:#15803d}
  .workcal-daysales-rows{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .workcal-list{display:flex;flex-direction:column;min-width:0;min-height:0}.workcal-list-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}.workcal-list-head b{font-size:13px;color:#111827}.workcal-scroll{padding:0 12px 12px;overflow:auto;min-height:0}
  .workcal-item{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;padding:10px 8px;border-bottom:1px solid #eef2f7;cursor:pointer;border-radius:9px}.workcal-item.has-photo{grid-template-columns:54px 42px minmax(0,1fr)}.workcal-item:hover{background:#f8fafc}.workcal-time{font-size:11px;font-weight:800;color:#2563eb;line-height:1.45}.workcal-avatar{width:42px;height:52px;border-radius:8px;object-fit:cover;border:1px solid #dbe3ef;background:#f1f5f9}.workcal-avatar.empty{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#94a3b8;text-align:center}.workcal-detail-photo{width:104px;height:130px;border-radius:12px;object-fit:cover;border:1px solid #dbe3ef;background:#f1f5f9}.workcal-item-title{display:flex;align-items:center;gap:5px;min-width:0}.workcal-item-title b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0f172a}.workcal-meta{font-size:10.5px;color:#64748b;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workcal-reason{font-size:10.5px;color:#475569;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workcal-item.overdue{background:#fff7ed}.workcal-item.overdue .workcal-time{color:#ea580c}
  .sc-badge{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:3px 7px;font-size:9.5px;font-weight:800;white-space:nowrap}.sc-status-confirmed{background:#ecfdf5;color:#0f766e}.sc-status-pending{background:#fff7ed;color:#c2410c}.sc-status-completed{background:#eff6ff;color:#1d4ed8}.sc-status-cancelled{background:#f1f5f9;color:#64748b}.sc-status-overdue{background:#ffedd5;color:#c2410c}
  .workcal-compact .workcal-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.workcal-compact .workcal-body{display:block}.workcal-compact .workcal-month{display:none}.workcal-compact .workcal-filters{padding-top:7px}.workcal-compact .workcal-scroll{max-height:260px}.workcal-empty{padding:28px 12px;text-align:center;color:#94a3b8;font-size:12px}.workcal-empty button{margin-top:9px}
  .schedule-detail-grid{display:grid;grid-template-columns:120px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.schedule-detail-grid>div{padding:9px 11px;border-bottom:1px solid var(--line)}.schedule-detail-grid>div:nth-child(odd){font-size:11.5px;font-weight:700;color:#64748b;background:#f8fafc}.schedule-detail-grid>div:nth-last-child(-n+2){border-bottom:0}
  .modal-box.modal-wide{width:min(920px,94vw)}
  .schedule-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.schedule-form-grid .full{grid-column:1/-1}.schedule-form-grid label{display:block;font-size:11.5px;font-weight:700;color:#475569;margin-bottom:4px}.schedule-form-grid input,.schedule-form-grid select,.schedule-form-grid textarea{width:100%;box-sizing:border-box}
  .schedule-role-options{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:8px 0}.schedule-role-option,.schedule-important{display:inline-flex!important;align-items:center;gap:6px!important;width:auto!important;max-width:100%;margin:0!important;white-space:nowrap;word-break:keep-all}.schedule-role-option input,.schedule-important input{width:17px!important;height:17px!important;min-width:17px;flex:0 0 17px;margin:0}
  @media(max-width:1100px){.workcal-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.workcal-body{grid-template-columns:minmax(430px,64%) minmax(230px,36%)}}
  @media(max-width:767px){.workcal-head{padding:13px 12px 10px;display:block}.workcal-actions{justify-content:flex-start;padding:9px 0 0}.workcal-summary{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px}.workcal-body{display:block}.workcal-month{border-right:0;border-bottom:1px solid #eef2f7}.workcal-day{min-height:58px;padding:4px}.workcal-daytag{font-size:7.5px;padding:2px 3px}.schedule-form-grid{grid-template-columns:1fr}.schedule-form-grid .full{grid-column:auto}.schedule-detail-grid{grid-template-columns:94px minmax(0,1fr)}}
  .gs-anim{transition:opacity .2s}
  .dash-tip{font-size:11.5px;color:#94a3b8;margin:0 0 8px 2px}
</style>
<style>
  :root{
    --navy:#1e2a4a; --navy2:#16203a; --navyhi:rgba(255,255,255,.09);
    --blue:#2563eb; --blue-d:#1d4ed8; --blue-s:#eaf1ff;
    --green:#16a34a; --green-s:#e7f6ec; --purple:#7c3aed; --purple-s:#f1ebfe;
    --amber:#ea8a0c; --amber-s:#fdf0db; --red:#dc2626; --red-s:#fdeaea;
    --ink:#0f172a; --gray:#64748b; --gray2:#94a3b8; --line:#e8edf3; --bg:#f4f6fb; --white:#fff;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
    --control-h:40px; --control-sm-h:32px; --icon-h:32px; --chip-h:26px;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
    --sidebar-w:230px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  .side{width:var(--sidebar-w);background:linear-gradient(180deg,var(--navy),var(--navy2));color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;flex-shrink:0;z-index:60;transition:transform .22s ease,width .22s ease}
  .brand{padding:22px 22px 18px;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.5px}
  .brand .dot{color:#60a5fa}
  .brand small{display:block;font-size:10px;font-weight:500;color:var(--gray2);margin-top:3px}
  .nav{flex:1;padding:6px 12px;overflow-y:auto}
  .nav .sec{font-size:10px;color:#64748b;padding:14px 10px 6px;letter-spacing:1px;font-weight:700}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px;color:#cbd5e1;cursor:pointer;margin-bottom:2px;font-family:inherit;transition:.15s}
  .nav button:hover{background:var(--navyhi);color:#fff}
  .nav button.on{background:#fff;color:var(--navy);font-weight:700}
  .nav .ic{font-size:16px;width:20px;text-align:center}
  .side .foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
  .side .foot .lab{font-size:10px;color:#64748b;margin-bottom:5px}
  .side select{width:100%;font-size:12px;background:var(--navyhi);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 9px}
  .side select option{color:#000}
  .ver{font-size:10px;color:#475569;margin-top:10px;text-align:center}
  .content{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:var(--sidebar-w)}
  /* 자료 가독성 — 가로·세로 구분줄(은은) + 행 얼룩무늬(눈이 행을 놓치지 않게) */
  #main table td,#main table th{border-right:1px solid #eef1f5}
  #main table td:last-child,#main table th:last-child{border-right:0}
  #main table tbody tr:nth-child(even){background:#fafbfc}
  #main table tbody tr:hover{background:#f1f6ff}
  /* 링크(라이브)주문 카드 강조 테두리 */
  .ord-card.shop-order{border:2px solid #3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.10)}
  .topbar{min-height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:8px 26px;position:sticky;top:0;z-index:20}
  .side-toggle{display:none;width:var(--icon-h);height:var(--icon-h);border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;color:var(--ink);align-items:center;justify-content:center;cursor:pointer;font-size:19px;flex:0 0 auto}
  .current-view{display:none;min-width:0;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-dim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:50}
  .search{flex:1;max-width:440px;position:relative}
  .search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 36px;font-size:13px}
  .search:before{content:'🔍';position:absolute;left:12px;top:9px;font-size:13px;opacity:.5}
  .tb-icons{display:flex;align-items:center;gap:18px;margin-left:auto}
  .tb-ic{position:relative;font-size:18px;cursor:pointer;opacity:.7}
  .tb-ic .bdg{position:absolute;top:-7px;right:-8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px}
  .tb-user{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid var(--line)}
  .tb-user .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .tb-user .nm{font-weight:700;font-size:13px}
  .tb-user .rl{font-size:11px;color:var(--gray)}
  .main{padding:24px 26px;max-width:1760px;width:100%}
  .greet{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
  .greet h1{font-size:23px;letter-spacing:-.6px}
  .greet h1 b{color:var(--blue)}
  .greet p{color:var(--gray);font-size:12.5px;margin-top:6px}
  .datebox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600}
  .head{margin-bottom:18px}
  .head h1{font-size:21px;letter-spacing:-.5px}
  .head p{color:var(--gray);font-size:12.5px;margin-top:5px}
  .badge{display:inline-block;background:var(--amber-s);color:var(--amber);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;vertical-align:middle;margin-left:6px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:0 1px 2px rgba(15,23,42,.03);min-height:124px}
  .kpi .lab{font-size:12.5px;color:var(--gray);margin-bottom:10px}
  .kpi .num{font-size:25px;font-weight:800;letter-spacing:-1px}
  .kpi .sub{font-size:12px;margin-top:8px;font-weight:600}
  .kpi .ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
  .ic-b{background:var(--blue-s)} .ic-g{background:var(--green-s)} .ic-p{background:var(--purple-s)} .ic-a{background:var(--amber-s)} .ic-r{background:var(--red-s)}
  .up{color:var(--green)} .down{color:var(--red)} .warn{color:var(--amber)}
  .row{display:grid;gap:16px;margin-bottom:18px}
  .row.r-2-1{grid-template-columns:2fr 1fr}
  .row.r-3{grid-template-columns:repeat(3,1fr)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
  .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .card-h h2{font-size:15px;letter-spacing:-.3px}
  .card-h .more{font-size:12px;color:var(--gray);cursor:pointer}
  .alist{display:flex;flex-direction:column;gap:2px}
  .ai{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f1f5f9;font-size:13px}
  .ai:last-child{border:0}
  .tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0}
  .t-b{background:var(--blue-s);color:var(--blue)} .t-g{background:var(--green-s);color:var(--green)}
  .t-a{background:var(--amber-s);color:var(--amber)} .t-p{background:var(--purple-s);color:var(--purple)} .t-r{background:var(--red-s);color:var(--red)}
  .ai .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ai .dt{font-size:11px;color:var(--gray2)}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .qi{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:12px;cursor:pointer;transition:.15s;border:1px solid transparent}
  .qi:hover{background:var(--blue-s);border-color:#dbe6ff}
  .qi .qic{width:42px;height:42px;border-radius:12px;background:var(--blue-s);display:flex;align-items:center;justify-content:center;font-size:20px}
  .qi span{font-size:12px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--gray);font-weight:600;font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 12px;border-bottom:1px solid #f1f5f9;word-break:break-word;overflow-wrap:anywhere}
  td.num-cell{white-space:nowrap}
  .card,.ord-card,.sg-card,.kpi{min-width:0}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#fafcff}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums}
  .pill,.item-chip{display:inline-flex;align-items:center;justify-content:center;min-height:var(--chip-h);font-size:12px;font-weight:800;line-height:1;padding:0 9px;border-radius:7px;white-space:nowrap;background:#eef2f7;color:#475569}
  .p-miss{background:var(--amber-s);color:var(--amber)} .p-req{background:var(--blue-s);color:var(--blue)}
  .p-done{background:var(--green-s);color:var(--green)} .p-low{background:var(--red-s);color:var(--red)}
  .p-gray{background:#eef1f6;color:#475569} .p-purple{background:#f1ebfe;color:#6d28d9}
  .tagbox{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:var(--chip-h);background:#fde68a;color:#7c3f06;border:1.5px solid #f59e0b;font-weight:900;font-size:13px;line-height:1;padding:0 10px;border-radius:7px;font-family:'Courier New',monospace;letter-spacing:.5px;white-space:nowrap}
  .stock-low{color:var(--red);font-weight:800} .stock-ok{font-weight:700}
  .muted{color:var(--gray)} .barcode{font-family:'Courier New',monospace;letter-spacing:.5px}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  input,select,textarea{font-family:inherit;font-size:13px;min-height:var(--control-h);padding:8px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff}
  input[type=checkbox],input[type=radio]{min-height:0;width:16px;height:16px;padding:0;border-radius:4px;accent-color:#2563eb;flex:0 0 auto;vertical-align:middle;cursor:pointer}

<script>
/* ===== Supabase 연동 ===== */
const SB = window.supabase.createClient('https://qikvvqgxmquevzyykkcm.supabase.co','sb_publishable_7dB61aDLDjATF2PMWnS4dw_j506tmao',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.localStorage}});
const SB_DOMAIN='@n-live.co.kr';
function _authClient(){return window.supabase.createClient('https://qikvvqgxmquevzyykkcm.supabase.co','sb_publishable_7dB61aDLDjATF2PMWnS4dw_j506tmao',{auth:{persistSession:false,autoRefreshToken:false,storageKey:'erp_tmp_signup'}});}
const _toDate=d=>{if(!d)return null;const m=String(d).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:null;};
/* 보안: 고객 입력 자유텍스트에서 <> 제거(저장 XSS 차단). 이름·주소·전화엔 꺾쇠가 쓰일 일 없음 */
const safeText=s=>s==null?s:String(s).replace(/[<>]/g,'');
const DB2ORD=r=>({id:r.id,date:r.order_date,staff:r.staff,cust:safeText(r.cust),phone:safeText(r.phone),addr:safeText(r.addr),code:r.code,disp:safeText(r.item_name),tag:r.tag,color:r.color,size:r.size,qty:r.qty,price:r.price,pay:r.pay,payway:r.payway,ship:r.ship,req:r.req,prog:r.prog,back:r.back,track:r.track,reason:safeText(r.reason),shipped_date:r.shipped_date,rxtype:r.rxtype,rxstat:r.rxstat,rxreason:safeText(r.rxreason),fault:r.fault,rxdate:r.rxdate,rxdone:r.rxdone,rxnew:r.rxnew,created_by:r.created_by,source:r.source,session_id:r.session_id,order_group_id:r.order_group_id,reservation_expires_at:r.reservation_expires_at,meta:r.meta,bo_status:r.bo_status});
const ORD2DB=o=>{const r={order_date:_toDate(o.date),staff:o.staff,cust:o.cust,phone:o.phone,addr:o.addr,code:o.code,item_name:o.disp,tag:o.tag,color:o.color,size:o.size,qty:o.qty,price:o.price,pay:o.pay,payway:o.payway||null,ship:o.ship,req:o.req||null,prog:o.prog||null,back:!!o.back,track:o.track||null,reason:o.reason||null,shipped_date:o.shipped_date||null};r.rxtype=o.rxtype||null;r.rxstat=o.rxstat||null;r.rxreason=o.rxreason||null;r.fault=o.fault||null;r.rxdate=o.rxdate||null;r.rxdone=o.rxdone||null;r.rxnew=o.rxnew||null;/* created_by(uuid+FK): 유효한 기존 uuid만 전송, 없으면 미전송해 DB가 채우게(임의 문자열 넣으면 저장 실패) */if(o.created_by&&/^[0-9a-f-]{36}$/i.test(String(o.created_by)))r.created_by=o.created_by;
  /* 링크(라이브)주문 식별 필드 보존 — 수정 저장 시 source/세션/그룹/차감마커가 사라지지 않게 */
  if(o.source!==undefined)r.source=o.source||null;
  if(o.session_id!==undefined)r.session_id=o.session_id||null;
  if(o.order_group_id!==undefined)r.order_group_id=o.order_group_id||null;
  if(o.reservation_expires_at!==undefined)r.reservation_expires_at=o.reservation_expires_at||null;
  if(o.meta!==undefined)r.meta=o.meta||null;
  if(o.bo_status!==undefined)r.bo_status=o.bo_status||null;
  return r;};
async function dbFetchAll(table,col,asc){let all=[],f=0;const sz=1000;while(true){const {data,error}=await SB.from(table).select('*').order(col,{ascending:asc!==false}).range(f,f+sz-1);if(error){console.error(table,error);break;}all=all.concat(data||[]);if(!data||data.length<sz)break;f+=sz;}return all;}
let SHIPPING=[];
let SCHED=[];
let LIVE_SESS=[],SESS_PROD=[],PIMG={};/* 라이브 판매: 방송 세션 + 방송 상품 + 품번별 상품사진 */
const baseCode=c=>String(c||'').split('-')[0];/* 품번 base(색상/사이즈 접미사 제거) */
/* 번호표 표기: ERP는 #064(3자리·#), 고객화면은 64번. 숫자 아니면(캡처 QAM1 등) 원문 */
const hashNo=c=>{const b=baseCode(c);return /^\d+$/.test(b)?'#'+String(parseInt(b,10)).padStart(3,'0'):b;};
const shortNo=c=>{const b=baseCode(c);return /^\d+$/.test(b)?String(parseInt(b,10)):b;};
const baseName=(nm,color,size)=>{let s=String(nm||'');if(color)s=s.split(color).join('');if(size)s=s.replace(new RegExp('\\\\b'+size+'\\\\b'),'');return s.replace(/\\s+/g,' ').trim()||nm;};
/* 사용자 개인설정 — 위젯배치/목록·SNS·목표·무료배송기준을 계정별로 DB(user_prefs)에 영구저장.
   어느 기기에서 로그인해도 본인 설정 유지. ME.auth_id 없으면 localStorage 폴백. */
let PREFS={},_savePrefsT=null;
async function loadPrefs(){
  try{
    if(typeof ME!=='undefined'&&ME&&ME.auth_id){const {data}=await SB.from('user_prefs').select('prefs').eq('auth_id',ME.auth_id).maybeSingle();PREFS=(data&&data.prefs)||{};}
    else{PREFS=JSON.parse(localStorage.getItem('erp_prefs_local')||'{}');}
  }catch(e){try{PREFS=JSON.parse(localStorage.getItem('erp_prefs_local')||'{}');}catch(e2){PREFS={};}}
}
function savePrefs(){
  try{localStorage.setItem('erp_prefs_local',JSON.stringify(PREFS));}catch(e){}
  if(typeof ME==='undefined'||!ME||!ME.auth_id)return;
  clearTimeout(_savePrefsT);
  _savePrefsT=setTimeout(function(){SB.from('user_prefs').upsert({auth_id:ME.auth_id,prefs:PREFS,updated_at:new Date().toISOString()}).then(function(r){if(r.error)console.warn('prefs save:',r.error.message);});},600);
}
async function dbLoadAll(){
  try{
    const st=await dbFetchAll('stock','id',true);
    const cu=await dbFetchAll('customers','name',true);
    const or=await dbFetchAll('orders','id',false);
    const sh=await SB.from('shipping').select('*').order('month');
    const em=await SB.from('employees').select('*').order('id');
    const bs=await SB.from('broadcast_schedule').select('*').order('date');
    const vn=await SB.from('vendors').select('*').order('name');
    if(vn&&vn.data){VENDORS.length=0;vn.data.forEach(r=>VENDORS.push(r));}
    const cl=await SB.from('cust_log').select('*').order('at',{ascending:false}).limit(3000);
    CUSTLOG=(cl&&cl.data)||[];
    STOCK.length=0;st.forEach(r=>STOCK.push(r));
    CUSTOMERS.length=0;cu.forEach(r=>{r.name=safeText(r.name);r.phone=safeText(r.phone);r.addr=safeText(r.addr);r.memo=safeText(r.memo);CUSTOMERS.push(r);});
    ORD.length=0;or.forEach(r=>ORD.push(DB2ORD(r)));
    SHIPPING=sh.data||[];
    EMPLOYEES.length=0;(em.data||[]).forEach(r=>EMPLOYEES.push(r));
    SCHED=(bs&&bs.data)||[];
    try{const wsr=await SB.from('work_schedules').select('*');const wrows=(wsr&&wsr.data)||[];
        const pr=wrows.find(r=>r.id==='_emp_perms');EMP_PERMS=(pr&&pr.data)||{};
        WORKSCH=wrows.filter(r=>r.id!=='_emp_perms').map(r=>Object.assign({},r.data||{},{id:r.id}));
        EMPLOYEES.forEach(e=>{e.perms=EMP_PERMS[e.login_id]||null;});
        if(ME)ME.perms=EMP_PERMS[ME.id]||null;
    }catch(e){console.warn('work_schedules load',e);WORKSCH=WORKSCH||[];}
    try{const ls=await SB.from('live_sessions').select('*').order('id',{ascending:false});LIVE_SESS=(ls&&ls.data)||[];
        const sp=await SB.from('session_products').select('*').order('sort');SESS_PROD=(sp&&sp.data)||[];
        const pi=await SB.from('product_images').select('*');PIMG={};((pi&&pi.data)||[]).forEach(r=>{PIMG[r.code]=r.url;});}catch(e){console.warn('live load',e);LIVE_SESS=LIVE_SESS||[];SESS_PROD=SESS_PROD||[];PIMG=PIMG||{};}
    if(typeof ME!=='undefined'&&ME&&(ME.scope==='all'||ME.scope==='logi'||(typeof canStockEdit==='function'&&canStockEdit()))){try{const sc=await SB.from('stock_cost').select('*');if(sc&&sc.data){const cm={};sc.data.forEach(r=>cm[r.stock_id]=r.in_price);STOCK.forEach(s=>{s.in_price=(cm[s.id]!=null)?cm[s.id]:(s.in_price||0);});}}catch(e){console.error('cost',e);}}else if(typeof ME!=='undefined'&&ME){STOCK.forEach(s=>{s.in_price=0;});}
  }catch(e){console.error('load',e);toast('⚠️ 데이터 로드 오류');}
}
/* 실시간 동기화 — 다른 사용자의 변경을 자동 반영. 입력 중엔 화면 재렌더 보류(입력값 보호) */
let _rt=null,_rtTimer=null;
function isTyping(){const a=document.activeElement;if(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName))return true;const m=$('#modal');if(m&&!m.classList.contains('hide'))return true;return false;}
function startRealtime(){if(_rt)return;try{_rt=SB.channel('erp-live').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(_rtTimer);_rtTimer=setTimeout(async()=>{if(_committing)return;await dbLoadAll();if(!isTyping())render();},700);}).subscribe();}catch(e){console.error('realtime',e);}}
async function saveOrd(o){try{const row=ORD2DB(o);if(o.id){const {error}=await SB.from('orders').update(row).eq('id',o.id);if(error){console.error('saveOrd',error);toast('⚠️ 저장 실패 — 새로고침 후 다시 시도하세요');return false;}}else{const {data,error}=await SB.from('orders').insert(row).select('id').single();if(error){console.error('saveOrd',error);toast('⚠️ 저장 실패 — 다시 시도하세요');return false;}if(data)o.id=data.id;}return true;}catch(e){console.error(e);toast('⚠️ 저장 오류 — 인터넷 연결을 확인하세요');return false;}}
/* ===== 동시/이중 처리 안전장치 ===== 같은 작업키가 처리 중이면 재실행 차단(더블클릭·동시처리 방지) */
const _busy=new Set();
async function guard(key,fn){if(_busy.has(key)){toast('⏳ 처리 중입니다 — 잠시만요');return;}_busy.add(key);try{return await fn();}finally{_busy.delete(key);}}
/* 필드 스냅샷/복원 — DB 저장 실패 시 화면 롤백용 */
function _snap(o,keys){const s={};keys.forEach(k=>s[k]=o[k]);return s;}
function _restore(o,s){Object.assign(o,s);}
async function delOrd(o){try{if(o.id){const {error}=await SB.from('orders').delete().eq('id',o.id);if(error){console.error('delOrd',error);toast('⚠️ 삭제 저장 실패 — 새로고침으로 확인하세요');}}}catch(e){console.error(e);toast('⚠️ 삭제 오류 — 인터넷 확인');}}
async function saveStock(s){try{if(s&&s.id!=null){const {error}=await SB.from('stock').update({qty:s.qty}).eq('id',s.id);if(error){console.error('saveStock',error);toast('⚠️ 재고 저장 실패 — 다시 시도하세요');}}}catch(e){console.error(e);toast('⚠️ 재고 저장 오류');}}
/* 재고 원자적 가감 — DB에서 qty=qty±delta 계산(동시 차감해도 안 깨짐). 반환된 정확한 값으로 화면 갱신 */
async function adjustStockDB(s,delta,reason,ref){if(!s)return false;if(s.id==null){s.qty=(s.qty||0)+delta;return true;}try{const {data,error}=await SB.rpc('adjust_stock',{p_id:s.id,p_delta:delta});if(error){console.error('adjustStock',error);toast('⚠️ 재고 저장 실패 — 다시 시도하세요');return false;}if(typeof data==='number')s.qty=data;try{await SB.from('stock_log').insert({stock_id:s.id,code:s.code,delta:delta,reason:reason||'조정',ref:ref||null,staff:(window.ME&&ME.name)||null});}catch(e){}return true;}catch(e){console.error(e);toast('⚠️ 재고 저장 오류');return false;}}

/* 품목코드 체계: 상품번호6-색상번호-사이즈번호. 저장은 code(불변)+색상명+사이즈명, 표시코드는 정렬해서 실시간 계산 */
const SIZE_ORDER=['F','FREE','FR','ONE','ONESIZE','XS','S','M','L','XL','2XL','XXL','3XL','XXXL','4XL'];
function sizeRank(sz){const s=String(sz==null?'':sz).toUpperCase().replace(/\s/g,'');const i=SIZE_ORDER.indexOf(s);if(i>=0)return i;const n=parseInt(s,10);if(!isNaN(n))return 200+n;return 100;}
function normCode6(code){const g=String(code==null?'':code).replace(/\D/g,'');return (g.length===5||g.length===6)?g.padStart(6,'0'):String(code==null?'':code);}
function isFreeSize(sz){return !sz||['F','FREE','FR','ONE','ONESIZE'].includes(String(sz).toUpperCase());}
function skuFullCode(code,color,size,pool){const raw=String(code==null?'':code);if(raw.includes('-'))return raw;/* 구 데이터: 전체코드가 code에 통째로 저장됨 → 그대로 표시(접미사 재부여 안 함) */const src=pool||STOCK;const same=src.filter(x=>String(x.code)===String(code));const colors=[];same.forEach(x=>{if(x.color&&x.color!=='-'&&colors.indexOf(x.color)<0)colors.push(x.color);});const sizes=[...new Set(same.map(x=>x.size).filter(Boolean))].sort((a,b)=>sizeRank(a)-sizeRank(b));const c6=normCode6(code);const ci=colors.indexOf(color);const cp=ci>=0?'-'+String(ci+1).padStart(2,'0'):'';const si=sizes.indexOf(size);const sp=isFreeSize(size)?'':(si>=0?'-'+String(si+1).padStart(2,'0'):'');return c6+cp+sp;}
function baseOfCode(c){return String(c==null?'':c).split('-')[0].replace(/\D/g,'');}
function usedBaseNums(){const u=new Set();STOCK.forEach(s=>{const g=baseOfCode(s.code);if(g)u.add(parseInt(g,10));});(typeof STAGED!=='undefined'?STAGED:[]).forEach(s=>{const g=baseOfCode(s.code);if(g)u.add(parseInt(g,10));});return u;}
/* 가장 낮은 빈 6자리 품번(중복없이 최소값) — 빈칸부터 채움 */
function nextProductCode(){const u=usedBaseNums();let n=1;while(u.has(n))n++;return String(n).padStart(6,'0');}
function baseTaken(base){const b=parseInt(String(base).replace(/\D/g,''),10);return !isNaN(b)&&usedBaseNums().has(b);}
/* 정확 중복(메인번호+색상+사이즈) 존재여부 */
function skuExists(code,color,size,exceptId){const b=parseInt(baseOfCode(code),10);const hit=x=>parseInt(baseOfCode(x.code),10)===b&&(x.color||'')===(color||'')&&(x.size||'')===(size||'');return STOCK.some(s=>s.id!==exceptId&&hit(s))||(typeof STAGED!=='undefined'&&STAGED.some(hit));}

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    <defs><linearGradient id="bgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7eb0fb"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
    ${[0,.25,.5,.75,1].map(f=>`<line x1="${padL}" x2="${w}" y1="${(10+ah*f).toFixed(1)}" y2="${(10+ah*f).toFixed(1)}" stroke="#eef2f7"/>`).join('')}
    ${bars}${line}${dots}${lbl}</svg>`;
}

function _inRange(o,key){if(key==='all')return true;const r=periodRange(key),d=(o.date||'').replace(/\//g,'-');return d>=r.from&&d<=r.to;}
function _salesP(key){return mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,key)).reduce((a,o)=>a+amtOf(o),0);}
function _cntP(key){const s=new Set();mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,key)&&_isGoods(o)).forEach(o=>s.add((o.date||'')+'|'+(o.cust||'')));return s.size;}/* 실제 주문 수 = 날짜+고객 그룹(서비스라인 제외) */
function _shipFeeMonth(){const r=periodRange('month');return mine(ORD).filter(o=>o.code==='배송비'&&_inRange(o,'month')).reduce((a,o)=>a+amtOf(o),0)+SHIPPING.filter(s=>s.month===r.from.slice(0,7)).reduce((a,s)=>a+(s.amount||0),0);}
function _byStaffRows(){const m={};mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,'month')).forEach(o=>m[o.staff]=(m[o.staff]||0)+amtOf(o));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>[k,won(v)]);}
function _byProdRows(){const m={};mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,'month')&&!/낱장|배송비/.test((o.disp||'')+o.code)).forEach(o=>{const k=o.disp||o.code;m[k]=(m[k]||0)+(o.qty||0);});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>[k,v+'개']);}
/* ===== 대시보드 분석 통계 (전부 실데이터: 주문/고객/재고에서 계산) ===== */
function prodCat(code,disp){const s=STOCK.find(x=>x.code===code);if(s&&s.subcategory)return s.subcategory;if(s&&s.category)return s.category;const t=(disp||'')+((s&&s.name)||'');const KW=[['원피스','원피스'],['니트','니트'],['가디건','니트'],['팬츠','팬츠'],['바지','팬츠'],['슬랙스','팬츠'],['데님','팬츠'],['청바지','팬츠'],['레깅스','팬츠'],['자켓','아우터'],['코트','아우터'],['점퍼','아우터'],['패딩','아우터'],['아우터','아우터'],['블라우스','블라우스'],['셔츠','블라우스'],['티셔츠','티셔츠'],['반팔','티셔츠'],['나시','티셔츠'],['스커트','스커트'],['치마','스커트'],['셋업','셋업'],['후드','맨투맨'],['맨투맨','맨투맨']];for(const kw of KW)if(t.indexOf(kw[0])>=0)return kw[1];return '기타';}
function _isGoods(o){return o.code!=='배송비'&&o.code!=='낱장'&&o.code!=='적립금'&&!/배송비|낱장|적립금/.test(o.disp||'');}
function _orderCount(key){const s=new Set();mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,key)).forEach(o=>s.add((o.date||'')+'|'+(o.cust||'')));return s.size;}
function _avgOrder(key){const c=_orderCount(key);return c?Math.round(_salesP(key)/c):0;}
function _custAgg(){const m={};mine(ORD).filter(o=>o.pay==='paid').forEach(o=>{const c=(o.cust||'').trim();if(!c)return;if(!m[c])m[c]={cust:c,groups:new Set(),amt:0,last:'',cats:{}};m[c].groups.add((o.date||'')+'|'+c);m[c].amt+=amtOf(o);const d=(o.date||'').replace(/\//g,'-');if(d>m[c].last)m[c].last=d;if(_isGoods(o)){const cat=prodCat(o.code,o.disp);m[c].cats[cat]=(m[c].cats[cat]||0)+(o.qty||0);}});return Object.values(m).map(x=>{const ent=Object.entries(x.cats).sort((a,b)=>b[1]-a[1]);const tc=ent.filter(e=>e[0]!=='기타')[0]||ent[0];return {cust:x.cust,cnt:x.groups.size,amt:x.amt,last:x.last,topcat:tc?tc[0]:'-'};});}
function _repurchase(){const a=_custAgg(),tot=a.length,rep=a.filter(x=>x.cnt>=2).length;return {rate:tot?Math.round(rep/tot*1000)/10:0,rep,tot};}

function _dist(field){const m={};mine(ORD).filter(o=>o.pay==='paid'&&_isGoods(o)).forEach(o=>{let k=field==='cat'?prodCat(o.code,o.disp):((o[field]||'').trim()||'기타');if(!k)k='기타';m[k]=(m[k]||0)+(o.qty||0);});const tot=Object.values(m).reduce((a,b)=>a+b,0)||1;return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(e=>({k:e[0],v:e[1],pct:Math.round(e[1]/tot*1000)/10}));}
function _topProd(key,n){const m={};mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,key)&&_isGoods(o)).forEach(o=>{const k=o.disp||prodName(o.code)||o.code;if(!m[k])m[k]={qty:0,amt:0};m[k].qty+=o.qty||0;m[k].amt+=amtOf(o);});const tot=Object.values(m).reduce((a,b)=>a+b.amt,0)||1;return Object.entries(m).sort((a,b)=>b[1].qty-a[1].qty).slice(0,n||5).map(e=>({name:e[0],qty:e[1].qty,amt:e[1].amt,share:Math.round(e[1].amt/tot*1000)/10}));}
function _lowProd(n){const sold={};mine(ORD).filter(o=>o.pay==='paid'&&_inRange(o,'month')).forEach(o=>{sold[o.code]=(sold[o.code]||0)+(o.qty||0);});const bc={};STOCK.forEach(s=>{if(s.code==='배송비')return;if(!bc[s.code])bc[s.code]={name:s.name,qty:0};bc[s.code].qty+=s.qty||0;});return Object.entries(bc).map(e=>({code:e[0],name:e[1].name,stock:e[1].qty,sold:sold[e[0]]||0})).filter(x=>x.stock>=10&&x.sold<=2).sort((a,b)=>b.stock-a.stock).slice(0,n||6);}
function _salesTrend(n){const byd={};mine(ORD).filter(o=>o.pay==='paid').forEach(o=>{const d=(o.date||'').replace(/\//g,'-');if(!d)return;if(!byd[d])byd[d]={s:0,set:new Set()};byd[d].s+=amtOf(o);if(o.cust)byd[d].set.add(o.cust);});return Object.entries(byd).sort((a,b)=>a[0].localeCompare(b[0])).slice(-(n||7)).map(e=>({date:e[0].slice(5),sales:e[1].s,avg:e[1].set.size?Math.round(e[1].s/e[1].set.size):0}));}

</div>
${tr.length?`<div style="display:flex;align-items:flex-end;gap:4px;height:52px;margin-bottom:4px">${bars}</div><div class="muted" style="font-size:9.5px;text-align:right;margin-bottom:8px">일별 신규 유입</div>`:'<div class="muted" style="font-size:11px;margin-bottom:8px">신규 가입 기록이 아직 없어요 — 오늘 등록부터 자동 집계됩니다</div>'}

function misongPOText(){

  if(q)a=a.filter(s=>workSearchText(s).includes(q));
  if(WORK_UI.cat!=='all')a=a.filter(s=>s.category===WORK_UI.cat);
  if(WORK_UI.status!=='all')a=a.filter(s=>workStatusKey(s)===WORK_UI.status||s.status===WORK_UI.status);
  if(WORK_UI.important)a=a.filter(s=>s.isImportant);
  const t=workToday(),ws=workWeekStart(t),we=workAddDays(ws,6);
  if(WORK_UI.range==='today')a=a.filter(s=>s.date===WORK_UI.date);
  if(WORK_UI.range==='week')a=a.filter(s=>s.date>=ws&&s.date<=we);
  if(WORK_UI.range==='month')a=a.filter(s=>s.date.slice(0,7)===WORK_UI.month);
  return a.sort((x,y)=>(x.date+x.startTime).localeCompare(y.date+y.startTime));

function workSalesDetail(date){const m={};let cash=0,card=0;mine(ORD).filter(o=>o.pay==='paid'&&(o.date||'').replace(/\//g,'-')===date).forEach(o=>{const k=o.staff||'담당 미지정',amt=amtOf(o),isCard=(o.payway||'')==='카드';const r=m[k]||(m[k]={cash:0,card:0,total:0});if(isCard){r.card+=amt;card+=amt;}else{r.cash+=amt;cash+=amt;}r.total+=amt;});

function payBadge(pw){if(!pw||pw==='-')return '';const cash=pw==='현금';return `<span class="pill ${cash?'p-done':'p-req'}" style="font-size:11px;flex:0 0 auto;white-space:nowrap">${cash?'💵':'💳'} ${pw}</span>`;}
let _onCache=null;
function orderNoOf(date,cust){if(!_onCache)_onCache={};const d=(date||'');if(!_onCache[d]){const seen={};let n=0;ORD.filter(x=>(x.date||'')===d).sort((a,b)=>(a.id||0)-(b.id||0)).forEach(x=>{if(x.cust&&!(x.cust in seen))seen[x.cust]=++n;});_onCache[d]=seen;}return d.replace(/[\/-]/g,'.')+'-'+String((_onCache[d]||{})[cust]||0).padStart(2,'0');}
function onoBadge(date,cust){return `<span style="display:inline-block;background:#1e293b;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;flex:0 0 auto;white-space:nowrap;letter-spacing:.3px">${orderNoOf(date,cust)}</span>`;}
function orderGroups(pay){
  const list=mine(ORD).filter(o=>o.pay===pay),map={};
  list.forEach(o=>{const k=(o.date||'')+'||'+(o.cust||'');(map[k]=map[k]||{date:o.date,cust:o.cust,phone:o.phone,addr:o.addr,staff:o.staff,items:[]}).items.push(o);});
  return Object.values(map).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

function paidCards(){

      <div class="oc-items">${g.items.map(o=>`<div class="oc-i"><span class="tagbox">${tagShow(o)}</span><span class="oc-nm">${itemLabel(o)}${sampleBadge(o)}</span><span class="muted">${o.qty}개</span></div>`).join('')}</div>

async function payGroup(idx){const g=orderGroups('unpaid')[idx];if(!g)return;const pw=($('#pw'+idx)&&$('#pw'+idx).value)||'현금';

  let ok=true;if(ids.length){try{const {error}=await SB.from('orders').update({pay:'paid',payway:pw}).in('id',ids);if(error){console.error('payGroup',error);ok=false;}}catch(e){console.error(e);ok=false;}}
  if(ok){
    /* 링크(shop)주문은 가예약만 걸려 있고 재고 미차감 상태 → 입금확인 시 실제 차감(1회). reservation_expires_at로 중복차감 방지 */
    for(const o of g.items){

      }

    await shipConsolidate(g.cust);/* 합배 배송비 통합 — 같은 고객 여러 주문(주말 누적)이 결제되면 배송비 1줄로 */

  const bal=custPoints(OE.cust);if(bal<=0){toast('이 고객은 적립금이 없습니다');return;}
  const prod=OE.lines.filter(l=>l.kind!=='ship'&&l.kind!=='point').reduce((a,l)=>a+(l.price||0)*(l.qty||0),0);
  const maxUse=Math.max(0,Math.min(bal,prod));
  if(maxUse<=0){toast('상품을 먼저 담아주세요');return;}

let _committing=false;
async function commitOrder(){
  if(_committing)return;
  if(!OE.cust){toast('고객을 선택하세요');return;}
  if(!OE.lines.length){toast('품목을 추가하세요');return;}
  /* 샘플 상품(반납대상) → 자동 미송(재주문). 확인 팝업 후 진행 */
  const _samp=OE.lines.filter(l=>l.code&&l.code!=='배송비'&&l.code!=='적립금'&&l.code!=='낱장'&&!l.back&&isSampleCode(l.code,l.color,l.size));
  if(_samp.length&&!confirm('⚠️ 샘플 상품이 포함되어 있습니다:\n'+_samp.map(l=>'· '+(l.name||l.code)+' '+(l.color||'')+' '+(l.size||'')).join('\n')+'\n\n샘플은 반납 대상이라 자동으로 미송(재주문) 처리되어 [미송사입]에서 거래처 재주문으로 관리됩니다.\n\n계속할까요?'))return;
  _samp.forEach(l=>l.back=true);
  /* 무료배송 대상인데 배송비가 수동으로 들어간 경우 방지 — 저장 전 확인 */
  {const _goods=OE.lines.filter(l=>l.kind!=='ship'&&l.kind!=='point').reduce((a,l)=>a+(l.price||0)*(l.qty||0),0);
   const _shipSum=OE.lines.filter(l=>l.kind==='ship').reduce((a,l)=>a+(l.price||0),0);const _th=freeThresh();
   if(_th>0&&_goods>=_th&&_shipSum>0){
     if(confirm('🆓 무료배송 대상입니다.\n상품합 '+won(_goods)+' ≥ 기준 '+won(_th)+'\n\n그런데 배송비 '+won(_shipSum)+'원이 들어가 있어요.\n\n[확인] 무료배송(배송비 0)으로 바꿔 저장\n[취소] 배송비 그대로 저장')){
       OE.lines=OE.lines.filter(l=>l.kind!=='ship');OE.lines.push({kind:'ship',name:'무료배송',code:'배송비',color:'',size:'',qty:1,price:0});}
   }}
  _committing=true;
  try{
  const noStk=!!OE.noStockAdjust;const carry=OE.shopCarry||null;/* 링크주문 수정: 재고 손대지 않고 식별필드 보존 */
  const pk=OE.payKeep||'unpaid',sk=OE.shipKeep||'miss';/* 결제완료 주문 수정 시 결제·출고 상태 보존 */
  const staff=isSeller()?(OE.staff||ME.owner||ME.name):(OE.staff||$('#oeStaff')?.value||'박시연');
  let back=0;const created=[];
  const _editOrig=OE.editOrig||[];/* 수정모드면 원주문 목록 — 저장 성공 후 교체 */
  const today=(OE.date||todayStr()).replace(/-/g,'/');
  OE.lines.forEach(l=>{
    if(l.kind==='ship'){const o={date:today,staff,cust:OE.cust,phone:OE.phone,addr:OE.addr,code:'배송비',disp:l.name,tag:'배송비',color:'',size:'',qty:1,price:l.price,back:false,pay:pk,ship:sk};ORD.unshift(o);created.push({o,s:null});return;}
    if(l.kind==='point'){const o={date:today,staff,cust:OE.cust,phone:OE.phone,addr:OE.addr,code:'적립금',disp:'적립금 사용',tag:'적립금',color:'',size:'',qty:1,price:l.price,back:false,pay:pk,ship:sk};ORD.unshift(o);created.push({o,s:null,points:l.price});return;}
    if(l.kind==='natjang'){const o={date:today,staff,cust:OE.cust,phone:OE.phone,addr:OE.addr,code:'낱장',disp:((l.name||'낱장')+' '+(l.color||'')+' '+(l.size||'')).replace(/ +/g,' ').trim(),tag:l.tag||'낱장',color:l.color||'',size:l.size||'',qty:l.qty,price:l.price,back:false,pay:pk,ship:sk};ORD.unshift(o);created.push({o,s:null});return;}
    const s=skuOf(l.code,l.color,l.size);if(l.back)back++;
    const o={date:today,staff,cust:OE.cust,phone:OE.phone,addr:OE.addr,code:l.code,disp:`${l.name} ${l.color} ${l.size}`,tag:tagOf(l.code),color:l.color,size:l.size,qty:l.qty,price:l.price,back:!!l.back,pay:pk,ship:l.back?'miss':sk};
    ORD.unshift(o);created.push({o,s,dq:l.qty});});
  const _cnt=created.length;
  /* created_by는 uuid+FK(auth.users) 컬럼 — 클라이언트가 이름/임의값을 넣으면 저장 실패(22P02/23503).
     새 주문은 생략해 DB가 채우게 두고(ORD2DB에서 미전송), 실적 집계는 staff 기준으로 처리 */
  if(carry)created.forEach(({o})=>{o.source=carry.source;o.session_id=carry.session_id;o.order_group_id=carry.order_group_id;o.reservation_expires_at=(o.code==='배송비'?null:carry.reservation_expires_at);o.payway=carry.payway;o.meta=carry.meta;});
  let _failed=0;
  for(const {o,s,dq,points} of created){

    if(s&&!noStk)await adjustStockDB(s,-dq,'판매',o.cust);
    if(points)await addPoints(o.cust,points,'적립사용',{item:'주문 사용',amount:Math.abs(points)});
  }
  // 수정모드: 새 주문이 전부 저장된 경우에만 원주문 삭제+재고 원복(부분 실패 시 원주문 보존)
  if(_editOrig.length){if(_failed===0){for(const o of _editOrig){const k=ORD.indexOf(o);if(k>=0)ORD.splice(k,1);await delOrd(o);const s=skuOf(o.code,o.color,o.size);if(!noStk&&s&&o.code!=='낱장'&&o.code!=='배송비'&&o.code!=='적립금')await adjustStockDB(s,o.qty,'주문수정 원복',o.cust);}}else{toast('⚠️ 일부 저장 실패 — 원주문은 그대로 두었습니다. 확인 후 다시 시도하세요');}}
  toast((_failed?'⚠️ ':'✅ ')+'주문서 저장 ('+(_cnt-_failed)+'건)'+(back?' · 미송 '+back+'건 포함':'')+(_failed?' · '+_failed+'건 저장 실패(재고 미차감)':''));
  OE={cust:null,phone:'',addr:'',staff:null,lines:[],date:OE.date};render();
  }catch(e){console.error('commitOrder',e);toast('⚠️ 주문 저장 중 오류 — 새로고침 후 확인하세요');}
  finally{_committing=false;}
}

  const hasReal={};rows.forEach(o=>{if(!_isSvcLine(o))hasReal[(o.date||'')+'|'+(o.cust||'')]=true;});

/* 합배 배송비 통합: 같은 고객 '출고요청' 묶음은 배송비 1줄만. 금·토·일 방송이 월요일 한 박스로 나가므로 각각 배송비 X.
   규칙 = 무료배송 라인이 있거나 상품합계≥무료기준 → 무료(배송비 삭제, 무료배송 1줄), 아니면 배송비 4,000 1줄. 나머지 배송비 행은 삭제. */
async function shipConsolidate(cust){
  if(!cust)return false;
  /* 같은 고객의 미출고 주문 전체 = 한 박스(합배) 대상 — 미송이든 출고요청이든 결국 함께 나감 */
  const set=ORD.filter(o=>o.cust===cust&&o.ship!=='done');
  const ships=set.filter(o=>o.code==='배송비'&&o.id!=null);
  if(ships.length===0)return false;
  const goods=set.filter(o=>o.code!=='배송비'&&o.code!=='적립금'&&o.code!=='낱장');
  const goodsTotal=goods.reduce((a,o)=>a+(o.price||0)*(o.qty||0),0);
  const free=ships.some(o=>(o.price||0)===0)||goodsTotal>=freeThresh();
  const keep=ships[0],drop=ships.slice(1);
  const nP=free?0:4000,nN=free?'무료배송':'배송비';
  let changed=false;
  if((keep.price||0)!==nP||keep.disp!==nN){keep.price=nP;keep.disp=nN;if(await saveOrd(keep)===false)return false;changed=true;}
  for(const o of drop){const k=ORD.indexOf(o);if(k>=0)ORD.splice(k,1);await delOrd(o);changed=true;}
  if(drop.length)toast('🚚 '+cust+' 합배 배송비 통합 → '+(free?'무료배송':'배송비 4,000 1회')+(drop.length?(' (중복 배송비 '+drop.length+'건 정리)'):''));
  return changed;
}

/* ===== 교환·반품·취소 (CS 사후처리) ===== */
const RX_REASONS=[{l:'상품불량',f:'셀러'},{l:'오배송(잘못보냄)',f:'물류'},{l:'누락/빠짐',f:'물류'},{l:'배송지연(회사귀책)',f:'물류'},{l:'사이즈 변경',f:'무과실'},{l:'색상 변경',f:'무과실'},{l:'단순변심',f:'무과실'},{l:'기타',f:'무과실'}];
const RX_TYPES={exchange:{l:'교환',ic:'🔄'},refund:{l:'반품·환불',ic:'↩️'},cancel:{l:'취소',ic:'✖️'}};
const RX_STEPL={req:'접수',recall:'회수신청',gotback:'회수입고',reship:'재발송',refunded:'환불완료',done:'완료'};
function rxFlow(t){return t==='exchange'?['req','recall','gotback','reship','done']:['req','recall','gotback','refunded','done'];}
/* 단계별 날짜 — meta.steps에 각 단계 도달일 기록 (req=요청일, gotback=사무실입고일, refunded/reship=처리일, done=완료일) */
function rxStepDate(o,s){const st=(o.meta&&o.meta.steps)||{};return st[s]||(s==='req'?(o.rxdate||''):s==='done'?(o.rxdone||''):'')||'';}
function rxStampStep(o,s,dt){const m=Object.assign({},o.meta||{});m.steps=Object.assign({},m.steps||{},{[s]:dt});o.meta=m;}
function rxUnstampStep(o,s){if(o.meta&&o.meta.steps){const m=Object.assign({},o.meta);m.steps=Object.assign({},m.steps);delete m.steps[s];o.meta=m;}}
function faultOf(reason){const r=RX_REASONS.find(x=>x.l===reason);return r?r.f:'무과실';}
function faulteeOf(o){return o.fault==='셀러'?(o.staff||'담당셀러'):o.fault==='물류'?'물류팀':'무과실';}
function rxStockFor(o){return STOCK.find(s=>s.code===o.code&&(s.color||'')===(o.color||'')&&(s.size||'')===(o.size||''));}
/* 단계별 재고효과: sign=+1 진입 적용, sign=-1 역산(되돌리기) */
async function rxStepStockEffect(o,step,sign){const q=o.qty||1;
  if(step==='gotback'){const s=rxStockFor(o);if(s){await adjustStockDB(s,sign*q,sign>0?'교환/반품 회수입고':'회수취소',o.cust);return `${o.code} 재고 ${sign>0?'+':'−'}${q}`;}return '';}
  if(step==='reship'){const nw=o.rxnew||{};const s=STOCK.find(x=>x.code===nw.code&&(x.color||'')===(nw.color||'')&&(x.size||'')===(nw.size||''));
    if(sign>0){/* 재발송 진행 */
      const have=(s&&s.qty!=null)?s.qty:0;
      if(!s||have<q){/* 재고 부족 → 미송(사입) 자동 등록 */
        if(!confirm('교환 새상품 재고가 부족합니다 (현재 '+(s?have:0)+'개 · 필요 '+q+'개).\n\n재고 차감 대신 [미송(사입)]으로 등록할까요?\n→ 미송관리·미송사입에 떠서 사입 후 발송합니다.\n\n[취소] 하면 재발송 단계로 넘어가지 않습니다.'))return false;
        const today=(todayStr()).replace(/-/g,'/');
        const mo={date:today,staff:o.staff,cust:o.cust,phone:o.phone||'',addr:o.addr||'',code:nw.code,disp:`${nw.name||nw.code} ${nw.color||''} ${nw.size||''}`.replace(/ +/g,' ').trim(),tag:nw.tag||tagOf(nw.code)||'',color:nw.color||'',size:nw.size||'',qty:q,price:0,pay:'paid',ship:'miss',back:true,req:'미송',prog:'미포장',reason:'교환 재발송(재고부족→미송사입)',meta:{exchangeOf:o.id}};
        ORD.unshift(mo);await saveOrd(mo);
        return `${nw.code||'새상품'} 재고부족 → 미송(사입) 등록`;
      }
      if(s){await adjustStockDB(s,-q,'교환 재발송',o.cust);return `${nw.code||'새상품'} 재고 −${q}`;}
      return '';
    }
    /* 재발송취소(이전단계) — 교환미송 주문이 이미 출고됐으면 되돌리기 차단, 미출고면 제거, 아니면 재고 원복 */
    const moShipped=ORD.find(x=>x.meta&&x.meta.exchangeOf===o.id&&x.ship==='done');
    if(moShipped){toast('⛔ 교환 미송상품이 이미 출고됐습니다 — 되돌릴 수 없어요 (미송관리에서 확인하세요)');return false;}

/* ===== 고객관리 ===== */
let CUSTSEARCH='',CUSTTAB='all',CUSTSORT={f:'amt',d:-1},CUSTPAGE=1,CUSTFILTER='';const CUST_PGSIZE=100;
function daysAgoYmd(n){const d=new Date();d.setDate(d.getDate()-n);return ymd(d);}
function custFilter(k){CUSTFILTER=(CUSTFILTER===k?'':k);CUSTPAGE=1;render();}
function custFilterChips(){const defs=[['vip','⭐ VIP(구매 50만↑)'],['points','💰 적립금 보유'],['back','📦 미송 보유'],['no90','😴 90일 미구매'],['flag','🚩 주의·블랙']];
  return `<div class="filterbar">${defs.map(d=>`<button class="chipf${CUSTFILTER===d[0]?' on':''}" onclick="custFilter('${d[0]}')">${d[1]}</button>`).join('')}${CUSTFILTER?`<button class="chipf reset" onclick="custFilter('')"><i class="ti ti-x"></i> 필터해제</button>`:''}</div>`;}
/* 공통 CSV 다운로드 (엑셀 한글 깨짐 방지 BOM) */
function downloadCSV(rows,name){const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name+'_'+todayStr()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1200);toast('📥 CSV 다운로드');}
/* 정렬 가능한 헤더 */
function sortTh(label,field,cur,fn,cls){const on=cur.f===field;const ar=on?(cur.d<0?' ▼':' ▲'):'';return `<th class="${cls||''} sort-th${on?' on':''}" onclick="${fn}('${field}')" title="정렬">${label}${ar}</th>`;}
function custSort(f){if(CUSTSORT.f===f)CUSTSORT.d*=-1;else{CUSTSORT.f=f;CUSTSORT.d=(f==='name'?1:-1);}CUSTPAGE=1;render();}
function custPage(p){CUSTPAGE=Math.max(1,p);render();}
function custFilterSort(){const stats=custStats();let list=CUSTOMERS.slice();if(!isSeller()&&typeof SELLERVIEW!=='undefined'&&SELLERVIEW)list=list.filter(c=>c.owner===SELLERVIEW);const q=(CUSTSEARCH||'').trim(),qn=custPhoneNorm(q),ql=q.toLowerCase();if(q)list=list.filter(c=>(c.name||'').toLowerCase().includes(ql)||(qn&&custPhoneNorm(c.phone).includes(qn))||(c.addr||'').toLowerCase().includes(ql));
  if(CUSTFILTER){const back=new Set(ORD.filter(o=>o.back&&o.ship!=='done'&&o.cust).map(o=>o.cust));const d90=daysAgoYmd(90);
    list=list.filter(c=>{const s=stats[c.name]||{};switch(CUSTFILTER){
      case 'vip':return (s.amt||0)>=500000;
      case 'points':return (c.points||0)>0;
      case 'back':return back.has(c.name);
      case 'no90':return (s.last||'').replace(/\//g,'-')<d90;/* 마지막 구매 90일 이전(무구매 포함) */
      case 'flag':return !!c.flag;
      default:return true;}});}
  const sv=c=>{const s=stats[c.name]||{};return CUSTSORT.f==='name'?(c.name||''):CUSTSORT.f==='cnt'?(s.cnt||0):CUSTSORT.f==='points'?(c.points||0):CUSTSORT.f==='last'?(s.last||''):(s.amt||0);};
  list.sort((a,b)=>{const va=sv(a),vb=sv(b);return typeof va==='string'?CUSTSORT.d*String(va).localeCompare(String(vb)):CUSTSORT.d*(va-vb);});
  return {list,stats};}
function custCSV(){const {list,stats}=custFilterSort();const rows=[['이름','연락처','주소','구매건','구매액','적립금','최근구매','비고']];list.forEach(c=>{const s=stats[c.name]||{};rows.push([c.name||'',formatPhone(c.phone)||'',c.addr||'',s.cnt||0,s.amt||0,c.points||0,s.last||'',c.flag||'']);});downloadCSV(rows,'고객목록');}
function custStats(){const m={};ORD.forEach(o=>{if(!o.cust)return;if(o.code==='배송비'||o.code==='적립금')return;/* 서비스라인 제외 — 실제 구매 상품만 집계 */const x=m[o.cust]||(m[o.cust]={cnt:0,amt:0,last:'',_dates:new Set()});x.cnt++;x.amt+=amtOf(o);x._dates.add(o.date);if((o.date||'')>x.last)x.last=o.date||'';});Object.values(m).forEach(x=>{x.orders=x._dates.size;});return m;}
/* ===== 고객별 원장(적립금·취소·환불 이력) ===== */
function custPoints(name){const c=CUSTOMERS.find(x=>x.name===name);return (c&&c.points)||0;}
async function logCust(custName,type,opt){opt=opt||{};const c=CUSTOMERS.find(x=>x.name===custName);const owner=(c&&c.owner)||((typeof ME!=='undefined'&&ME&&(ME.owner||ME.name)))||null;
  try{const {error}=await SB.from('cust_log').insert({cust:custName,owner:owner,type:type,item:opt.item||null,amount:opt.amount||0,points_delta:opt.points||0,reason:opt.reason||null,staff:(typeof ME!=='undefined'&&ME&&ME.name)||null});if(error)console.error('logCust',error);}catch(e){console.error('logCust',e);}}
async function addPoints(custName,delta,type,opt){opt=opt||{};const c=CUSTOMERS.find(x=>x.name===custName);if(!c){toast('고객을 찾을 수 없어요');return false;}
  if(c.id!=null){try{const {data,error}=await SB.rpc('adjust_points',{p_id:c.id,p_delta:delta});if(error){console.error('points',error);toast('⚠️ 적립금 저장 실패 — 다시 시도하세요');return false;}if(typeof data==='number')c.points=data;}catch(e){console.error(e);toast('⚠️ 적립금 저장 오류');return false;}}
  else{c.points=Math.max(0,(c.points||0)+delta);}
  await logCust(custName,type,{points:delta,amount:opt.amount||0,item:opt.item||null,reason:opt.reason||null});
  return true;}

async function setCustFlag(id,flag){const c=CUSTOMERS.find(x=>x.id===id);if(!c)return;c.flag=flag||null;try{const {error}=await SB.from('customers').update({flag:c.flag}).eq('id',id);if(error){console.error(error);toast('⚠️ 저장 실패');}}catch(e){console.error(e);}toast(flag?('🚩 '+flag+': '+c.name):'표시 해제: '+c.name);openCustDetail(id);}

async function custAdjustPoints(id,sign){const c=CUSTOMERS.find(x=>x.id===id);if(!c)return;const raw=prompt((sign>0?'적립할':'차감할')+' 금액 (원)');if(raw==null)return;const amt=parseInt(String(raw).replace(/[^\d]/g,''))||0;if(amt<=0){toast('금액을 입력하세요');return;}const reason=prompt('사유 (선택)','')||'';await addPoints(c.name,sign*amt,sign>0?'적립조정':'적립차감',{reason:reason||'수동 조정'});toast((sign>0?'💰 적립 +':'➖ 차감 −')+won(amt)+' · '+c.name);openCustDetail(id);}
function custPhoneNorm(p){return (p||'').replace(/[^0-9]/g,'');}
function formatPhone(p){const d=custPhoneNorm(p);if(d.length===11)return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');if(d.length===10)return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');return p||'';}
function phoneDupGroups(){const m={};CUSTOMERS.forEach(c=>{const p=custPhoneNorm(c.phone);if(p.length>=8)(m[p]=m[p]||[]).push(c);});return Object.values(m).filter(a=>a.length>1).sort((a,b)=>b.length-a.length);}
function custAvatar(name){const ch=(name||'?').trim().charAt(0)||'?';const colors=['#2563eb','#7c3aed','#db2777','#ea580c','#059669','#0891b2','#4f46e5'];let h=0;for(const c of (name||'?'))h=(h*31+c.charCodeAt(0))%colors.length;return `<span style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:${colors[h]};color:#fff;font-weight:800;font-size:14px;flex:0 0 auto">${esc(ch)}</span>`;}

async function mergeGroupInto(keeperName,pnorm){const grp=CUSTOMERS.filter(c=>custPhoneNorm(c.phone)===pnorm);const keeper=grp.find(c=>c.name===keeperName);const others=grp.filter(c=>c.name!==keeperName);if(!keeper||!others.length)return;
  const stats=custStats();let totO=0,totP=0;others.forEach(o=>{totO+=(stats[o.name]||{}).cnt||0;totP+=o.points||0;});
  if(!confirm('동일 연락처 고객을 \''+keeperName+'\' 하나로 통합할까요?\n\n통합 대상: '+others.map(o=>o.name).join(', ')+'\n· 주문 '+totO+'건 → '+keeperName+'\n· 적립금 '+won(totP)+' 합산\n· 나머지 '+others.length+'개 고객기록 삭제\n\n※ 되돌리기 어렵습니다. 신중히.'))return;
  for(const o of others){ORD.forEach(x=>{if(x.cust===o.name)x.cust=keeperName;});if(!keeper.addr&&o.addr)keeper.addr=o.addr;if(!keeper.memo&&o.memo)keeper.memo=o.memo;if(!keeper.flag&&o.flag)keeper.flag=o.flag;const i=CUSTOMERS.indexOf(o);if(i>=0)CUSTOMERS.splice(i,1);}
  keeper.points=(keeper.points||0)+totP;toast('✅ 통합 완료 → '+keeperName+' (주문 '+totO+'건 이동)');render();
  try{for(const o of others){await SB.from('orders').update({cust:keeperName}).eq('cust',o.name);await SB.from('cust_log').update({cust:keeperName}).eq('cust',o.name);if(o.id!=null)await SB.from('customers').delete().eq('id',o.id);}
    if(totP&&keeper.id!=null)await SB.rpc('adjust_points',{p_id:keeper.id,p_delta:totP});
    if(keeper.id!=null)await SB.from('customers').update({addr:keeper.addr,memo:keeper.memo,flag:keeper.flag}).eq('id',keeper.id);
  }catch(e){console.error('merge',e);toast('⚠️ 통합 저장 일부 실패 — 새로고침으로 확인하세요');}}
function pageBar(pg,pages,fn){if(pages<=1)return '';let s='<div class="pagebar">';s+=`<button class="btn sm gray" ${pg<=1?'disabled':''} onclick="${fn}(${pg-1})" aria-label="이전">‹</button>`;
  let a=Math.max(1,pg-3),b=Math.min(pages,a+6);a=Math.max(1,b-6);
  if(a>1){s+=`<button class="btn sm ghost" onclick="${fn}(1)">1</button>`+(a>2?'<span class="muted">…</span>':'');}
  for(let i=a;i<=b;i++)s+=`<button class="btn sm ${i===pg?'':'ghost'}" onclick="${fn}(${i})">${i}</button>`;
  if(b<pages)s+=(b<pages-1?'<span class="muted">…</span>':'')+`<button class="btn sm ghost" onclick="${fn}(${pages})">${pages}</button>`;
  s+=`<button class="btn sm gray" ${pg>=pages?'disabled':''} onclick="${fn}(${pg+1})" aria-label="다음">›</button></div>`;return s;}

function prodSales(){
  const O=ORD.filter(o=>o.pay==='paid'&&!/낱장|배송비|택배|합배|무나|무료나눔|^일반$/.test((o.disp||'')+'|'+(o.code||'')));
  const bar=(lab,frac,val)=>`<div class="pbar-row"><span class="pbar-lab">${esc(lab)}</span><div class="pbar-track"><div class="pbar-fill" style="width:${Math.max(2,Math.round(frac*100))}%"></div></div><span class="pbar-val">${val}</span></div>`;
  const bp={};O.forEach(o=>{const k=o.code+'|'+(o.disp||'');const x=bp[k]||(bp[k]={name:o.disp||o.code,qty:0,amt:0});x.qty+=(o.qty||0);x.amt+=(o.qty||0)*(o.price||0);});
  const best=Object.values(bp).sort((a,b)=>b.qty-a.qty).slice(0,15);

function prodCompose(){
  const isSvc=s=>/배송비|낱장|합배|무료나눔|무나|서비스|택배|^일반$/.test((s.name||''))||/배송비|낱장|합배|무나|택배/.test((s.tag||''));
  const P=STOCK.filter(s=>!isSvc(s));
  const rq=s=>(s.qty>0&&s.qty<50000)?s.qty:0;  // 99999/999999 더미 재고 제외
  const dummy=P.filter(s=>s.qty>=50000).length;
  const codes=new Set(P.map(s=>s.code));
  const totalQty=P.reduce((a,s)=>a+rq(s),0);
  const totalAmt=P.reduce((a,s)=>a+rq(s)*s.price,0);
  const sold=P.filter(s=>s.qty<=0).length, low=P.filter(s=>s.qty>0&&s.qty<=3).length;
  const byCat={}; P.forEach(s=>{const c=s.category||'미분류';const o=byCat[c]||(byCat[c]={sku:0,qty:0,amt:0});o.sku++;o.qty+=rq(s);o.amt+=rq(s)*s.price;});
  const catArr=Object.entries(byCat).sort((a,b)=>b[1].sku-a[1].sku);
  const maxCatSku=Math.max(1,...catArr.map(x=>x[1].sku));
  const bands=[[0,10000,'1만원 미만'],[10000,30000,'1~3만원'],[30000,50000,'3~5만원'],[50000,100000,'5~10만원'],[100000,9e12,'10만원 이상']];
  const bandArr=bands.map(([lo,hi,lab])=>({lab,n:P.filter(s=>s.price>=lo&&s.price<hi).length}));
  const maxBand=Math.max(1,...bandArr.map(x=>x.n));
  const bySub={}; P.forEach(s=>{if(s.subcategory){bySub[s.subcategory]=(bySub[s.subcategory]||0)+1;}});
  const subArr=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const maxSub=Math.max(1,...subArr.map(x=>x[1]));
  const bar=(lab,frac,val)=>`<div class="pbar-row"><span class="pbar-lab">${esc(lab)}</span><div class="pbar-track"><div class="pbar-fill" style="width:${Math.max(2,Math.round(frac*100))}%"></div></div><span class="pbar-val">${val}</span></div>`;
  return `
  <div class="kpis">
    <div class="kpi"><div><div class="lab">총 품목(스타일)</div><div class="num">${codes.size.toLocaleString()}</div><div class="sub">${STOCK.length.toLocaleString()} SKU (색상·사이즈)</div></div><div class="ic ic-b"><i class="ti ti-tag"></i></div></div>
    <div class="kpi"><div><div class="lab">총 재고수량</div><div class="num">${totalQty.toLocaleString()}</div><div class="sub">판매가능 합계</div></div><div class="ic ic-g"><i class="ti ti-stack-2"></i></div></div>
    <div class="kpi"><div><div class="lab">재고 금액</div><div class="num" style="font-size:19px">${won(totalAmt)}</div><div class="sub">출고가 기준</div></div><div class="ic ic-p"><i class="ti ti-coin"></i></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>카테고리별 보유 현황</h2><span class="muted" style="font-size:12px">SKU 수 기준 · 카테고리는 재고관리에서 품목 수정 시 지정</span></div>
    ${catArr.map(([c,v])=>bar(c,v.sku/maxCatSku,`${v.sku.toLocaleString()} SKU · 재고 ${v.qty.toLocaleString()}개 · ${won(v.amt)}`)).join('')}
  </div>
  <div class="card" style="margin-top:14px"><div class="card-h"><h2>가격대별 분포</h2><span class="muted" style="font-size:12px">출고가(판매가) 기준 SKU 수</span></div>
    ${bandArr.map(b=>bar(b.lab,b.n/maxBand,`${b.n.toLocaleString()} SKU`)).join('')}
  </div>
  ${subArr.length?`<div class="card" style="margin-top:14px"><div class="card-h"><h2>종류별 분포 <span class="muted" style="font-size:12px;font-weight:400">상위 12</span></h2></div>
    ${subArr.map(([s,n])=>bar(s,n/maxSub,`${n.toLocaleString()} SKU`)).join('')}
  </div>`:''}
  ${SHIPPING&&SHIPPING.length?`<div class="card" style="margin-top:14px"><div class="card-h"><h2>월별 배송비 합계 <span class="muted" style="font-size:12px;font-weight:400">상품 매출과 별도 집계 · 총 ${won(SHIPPING.reduce((a,s)=>a+(s.amount||0),0))}</span></h2></div>
    <table><thead><tr><th>월</th><th class="num-cell">배송비 합계</th><th class="num-cell">건수</th></tr></thead><tbody>
    ${SHIPPING.map(s=>`<tr><td>${s.month}</td><td class="num-cell">${won(s.amount)}</td><td class="num-cell muted">${s.cnt}건</td></tr>`).join('')}
    <tr style="font-weight:800;border-top:2px solid #e2e8f0"><td>합계</td><td class="num-cell">${won(SHIPPING.reduce((a,s)=>a+(s.amount||0),0))}</td><td class="num-cell muted">${SHIPPING.reduce((a,s)=>a+(s.cnt||0),0)}건</td></tr>
    </tbody></table></div>`:''}`;
}

  let s;
  if(editing){s=STOCK.find(x=>x.id===PRODEDIT);if(s)Object.assign(s,d);}
  else{s=Object.assign({},d);STOCK.unshift(s);}
  await saveStockRow(s);
  const wasEditing=editing;PRODEDIT=null;closeModal();toast(wasEditing?('✅ 수정: '+name):('✅ 품목 등록: '+name));

/* ===== 📸 영수증 자동입고 (사입 영수증 사진 → AI 파싱 → 입고목록) ===== */
const RECEIPT_API='https://n-live.co.kr/api/parse-receipt/';
function openReceiptScan(){const el=$('#receiptFile');if(!el){toast('업로드 준비 실패 — 새로고침 후 다시');return;}el.value='';el.click();}
function receiptPicked(input){const f=input.files&&input.files[0];if(!f)return;receiptScan(f);}
// 폰 사진은 수 MB라 캔버스로 긴 변 1600px·JPEG로 줄여 업로드(속도·비용↓)
function shrinkImage(file,maxSide){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);let{width:w,height:h}=img;const m=maxSide||1600;if(Math.max(w,h)>m){const r=m/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);resolve(cv.toDataURL('image/jpeg',0.82));};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('이미지를 읽지 못했어요'));};img.src=url;});}
async function receiptScan(file){
  let dataUrl;try{dataUrl=await shrinkImage(file,1600);}catch(e){toast('⚠️ '+e.message);return;}
  toast('📸 AI가 영수증을 읽는 중… (10~20초)');
  let res;try{
    const r=await fetch(RECEIPT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl})});
    res=await r.json();
  }catch(e){toast('⚠️ 서버 연결 실패 — 인터넷 확인 후 다시');return;}
  if(!res||!res.ok){toast('⚠️ '+((res&&res.note)||'인식 실패 — 사진을 더 선명하게 찍어보세요'));return;}
  const items=res.items||[];if(!items.length){toast('품목을 못 찾았어요 — 사진이 흐리면 다시');return;}
  // 같은 품목명 = 같은 상품코드(색상만 다름) → 이름별로 코드 하나씩 자동부여
  let base=parseInt(nextProductCode(),10)||1;const codeByName={};
  items.forEach(it=>{const nm=String(it.name||'').trim();if(!codeByName[nm]){codeByName[nm]=String(base).padStart(6,'0');base++;}});
  items.forEach(it=>{const nm=String(it.name||'').trim();
    STAGED.unshift({chk:true,tag:'-',code:codeByName[nm],vendor:null,name:nm,color:String(it.color||'').trim()||'-',size:String(it.size||'').trim()||'F',in_price:parseInt(it.price)||0,price:0,category:null,subcategory:null,season:null,qty:parseInt(it.qty)||1});
  });
  toast('✅ 영수증에서 '+items.length+'개 품목을 입고목록에 담았어요 — 출고가·번호표 확인 후 저장하세요');render();
}

function revenueCSV(){const rp=periodRange(REVPERIOD);let paid=mine(ORD).filter(o=>o.pay==='paid');if(REVPERIOD!=='all')paid=paid.filter(o=>{const d=(o.date||'').replace(/\//g,'-');return d>=rp.from&&d<=rp.to;});

/* ===== 직원·급여 / 사원관리 ===== */
/* 급여 — 사원별 기본급/수당률(매출%) 수정 가능. 미설정 시 직급별 기본값. 판매실적은 당월 자동연동 */
const PAY_BASE={'셀러':2000000,'보조':2300000,'운영':2300000,'물류':2300000,'관리자':3000000};
const PAY_RATE={'셀러':10,'보조':3,'운영':0,'물류':0,'관리자':0};
function _staffSalesBy(field,name){return ORD.filter(o=>o[field]===name&&o.pay==='paid'&&_inRange(o,'month')&&_isGoods(o)).reduce((a,o)=>a+amtOf(o),0);}
function _staffSales(name){return _staffSalesBy('staff',name);}/* 셀러 실적 = 담당(staff) */
function empPay(e){const base=(e.base_salary!=null&&e.base_salary!==''&&+e.base_salary>0)?+e.base_salary:(PAY_BASE[e.role]||0);const rate=(e.comm_rate!=null&&e.comm_rate!==''&&+e.comm_rate>=0&&String(e.comm_rate)!=='')?+e.comm_rate:(PAY_RATE[e.role]||0);
  if(e.role==='보조'){
    const own=_staffSalesBy('staff',e.name);/* 본인 판매(매출귀속=본인) */
    const assist=ORD.filter(o=>o.staff===(e.owner||'')&&e.auth_id&&o.created_by===e.auth_id&&o.pay==='paid'&&_inRange(o,'month')&&_isGoods(o)).reduce((a,o)=>a+amtOf(o),0);/* 담당셀러 라방 중 본인 처리분(created_by=auth_id uuid 매칭) */
    const _pr=(typeof PREFS!=='undefined'&&PREFS.emp_own_rate&&PREFS.emp_own_rate[e.name]);
    const ownRate=(_pr!=null&&_pr!=='')?+_pr:((e.own_rate!=null&&e.own_rate!==''&&+e.own_rate>=0&&String(e.own_rate)!=='')?+e.own_rate:(PAY_RATE['셀러']||10)),assistRate=rate;
    const comm=Math.round(own*ownRate/100+assist*assistRate/100);
    return {base:base,rate:assistRate,sales:own+assist,comm:comm,total:base+comm,own:own,assist:assist,ownRate:ownRate,assistRate:assistRate};
  }
  const sales=e.role==='셀러'?_staffSalesBy('staff',e.name):0;const comm=Math.round(sales*rate/100);return {base:base,rate:rate,sales:sales,comm:comm,total:base+comm};}
function saveEmpPay(idx,field,val){const e=EMPLOYEES[idx];if(!e)return;const nv=(val===''?null:Math.max(0,parseFloat(val)||0));const oldv=e[field];const label=field==='base_salary'?'기본급':field==='comm_rate'?'라이브 수당률':'수당률';

function saveBulk(){const b=BULK;if(!String(b.name).trim()){toast('상품명을 입력하세요');return;}
  const colors=String(b.colors||'').split(',').map(c=>c.trim()).filter(Boolean);const sizes=(b.sizes||[]).slice().sort((a,x)=>sizeRank(a)-sizeRank(x));
  if(!colors.length){toast('색상을 하나 이상 입력하세요');return;}if(!sizes.length){toast('사이즈를 선택하세요');return;}
  const bulkTag=String(b.tag||'').trim()||'-';
  const anyQty=colors.some(c=>sizes.some(sz=>(b.qty[c+'|'+sz]||0)>0));
  let sample=!!b.sample;
  if(!anyQty&&!sample){sample=confirm(SAMPLE_CONFIRM);}/* 수량 0인데 샘플 미체크 → 확인창 fallback */
  /* 선택한 색상×사이즈 전 조합 등록 — 수량 0이어도 등록(샘플·품절/미송 대비) */
  const _base=normCode6(String(b.code).trim());
  /* 중복 방지: 이미 있는 조합은 제외, 메인번호가 이미 있으면 옵션추가 확인 */
  const _combos=[];colors.forEach(c=>sizes.forEach(sz=>_combos.push([c,sz])));
  const _dup=_combos.filter(([c,sz])=>skuExists(b.code,c,sz));
  if(_dup.length===_combos.length){alert('❌ 중복 등록 불가\n\n메인번호 '+_base+' 의 선택한 색상×사이즈 조합이 이미 전부 등록돼 있습니다.');return;}
  if(baseTaken(_base)){if(!confirm('⚠️ 메인번호 '+_base+' 는 이미 등록된 상품이에요.\n\n색상/사이즈 옵션을 추가하는 게 맞나요?\n[확인] = 옵션 추가로 등록'+(_dup.length?(' (이미 있는 조합 '+_dup.length+'개 자동 제외)'):'')+'\n[취소] = 다른 새 상품이면 번호를 바꿔주세요'))return;}
  let n=0,skip=0;colors.forEach(c=>{sizes.forEach(sz=>{if(skuExists(b.code,c,sz)){skip++;return;}const q=b.qty[c+'|'+sz]||0;STAGED.unshift({chk:true,tag:bulkTag,code:String(b.code).trim(),vendor:String(b.vendor).trim()||null,name:String(b.name).trim(),color:c,size:sz,in_price:parseInt(b.inprice)||0,price:parseInt(b.price)||0,category:b.cat||null,subcategory:b.subcat||null,season:(CAT_HASSEASON(b.cat)?b.season:'')||null,qty:q,sample});n++;});});
  if(!n){toast('추가할 새 조합이 없습니다 (모두 이미 등록됨)');return;}
  closeModal();toast('✅ '+n+'개 SKU 입고목록 추가'+(skip?(' · 중복 '+skip+'개 제외'):'')+' — 확인 후 [저장]하세요');render();}
const SAMPLE_CONFIRM='재고 0으로 등록됩니다.\n\n이 상품이 샘플(반납 대상)인가요?\n\n[확인] = 샘플로 체크해서 등록 (주문 시 자동 미송·사입 처리)\n[취소] = 일반 상품(0재고)으로 등록';
function stagedAdd(){
  if(!SFORM.code.trim()||!SFORM.name.trim()){toast('품목코드·품목명은 필수');return;}
  {const _c=SFORM.code.trim(),_col=SFORM.color.trim()||'-',_sz=SFORM.size.trim()||'F';
   if(skuExists(_c,_col,_sz)){alert('❌ 중복 등록 불가\n\n품번 '+baseOfCode(_c)+' · 색상 '+_col+' · 사이즈 '+_sz+' 은(는) 이미 등록됐거나 목록에 있습니다.');return;}
   if(baseTaken(baseOfCode(_c))){if(!confirm('⚠️ 메인번호 '+baseOfCode(_c)+' 는 이미 등록된 상품이에요.\n\n색상/사이즈 옵션을 추가하는 게 맞나요?\n[확인] 옵션 추가 · [취소] 번호 변경'))return;}}
  const q=parseInt(SFORM.qty)||0;let sample=!!SFORM.sample;
  if(q<=0&&!sample){sample=confirm(SAMPLE_CONFIRM);}/* 재고 0인데 샘플 미체크 → 확인창 fallback */
  STAGED.unshift({chk:true,tag:SFORM.tag.trim()||'-',code:SFORM.code.trim(),vendor:SFORM.vendor.trim()||null,name:SFORM.name.trim(),color:SFORM.color.trim()||'-',size:SFORM.size.trim()||'F',in_price:parseInt(SFORM.inprice)||0,price:parseInt(SFORM.price)||0,category:SFORM.cat||null,subcategory:SFORM.subcat||null,season:(CAT_HASSEASON(SFORM.cat)?SFORM.season:'')||null,qty:q,sample});
  SFORM.code='';SFORM.name='';SFORM.color='';SFORM.size='';SFORM.inprice='';SFORM.price='';SFORM.qty='';SFORM.sample=false;
  toast('목록에 추가 ('+STAGED.length+'건 대기)'+(sample?' · 🔖샘플':''));render();setTimeout(()=>$('#sf_code')?.focus(),40);
}
function stagedSampleToggle(i){if(STAGED[i]){STAGED[i].sample=!STAGED[i].sample;render();}}
function stagedToggle(i){if(STAGED[i])STAGED[i].chk=!STAGED[i].chk;render();}
function stagedAllToggle(c){STAGED.forEach(x=>x.chk=c);render();}
function stagedDel(i){STAGED.splice(i,1);render();}
async function stagedSave(){
  const sel=STAGED.filter(x=>x.chk);if(!sel.length){toast('저장할 항목을 체크하세요');return;}
  for(const x of sel){const s={tag:x.tag,code:x.code,vendor:x.vendor,name:x.name,color:x.color,size:x.size,in_price:x.in_price,price:x.price,category:x.category,subcategory:x.subcategory,season:x.season,qty:x.qty,sample:!!x.sample};STOCK.unshift(s);await saveStockRow(s);}
  STAGED=STAGED.filter(x=>!x.chk);
  toast('✅ '+sel.length+'건 재고현황에 등록 완료');render();
}
async function setTag(code,val){const t=val.trim();STOCK.filter(s=>s.code===code).forEach(s=>s.tag=t);toast('🏷️ 번호표 변경: '+prodName(code)+' → '+t);render();try{const {error}=await SB.from('stock').update({tag:t}).eq('code',code);if(error){console.error('setTag',error);toast('⚠️ 번호표 저장 실패 — 다시 시도하세요');}}catch(e){console.error(e);toast('⚠️ 번호표 저장 오류');}}
async function scanMove(dir){const raw=$('#scan').value.trim().replace(/\s/g,''),q=parseInt($('#scanQty').value)||1;
  const s=STOCK.find(x=>(x.code+x.color+x.size).replace(/\s/g,'')===raw)||STOCK.find(x=>(x.code+x.color+x.size).replace(/\s/g,'').includes(raw));
  if(!s){toast('❌ 일치 품목 없음: '+raw);return;}if(dir<0&&s.qty<q){toast('⚠️ 재고 부족! 현재고 '+s.qty);return;}
  await adjustStockDB(s,dir*q,dir>0?'바코드 입고':'바코드 출고');toast((dir>0?'＋입고 ':'－출고 ')+s.name+' '+s.color+' '+Math.abs(dir*q)+'개 → 현재고 '+s.qty);$('#scan').value='';render();}

async function addEmp(){const name=$('#f_name').value.trim(),id=$('#f_id').value.trim(),pw=$('#f_pw').value.trim();
  if(!name||!id||!pw){toast('이름·아이디·비밀번호를 입력하세요');return;}
  if(!/^[A-Za-z0-9._-]+$/.test(id)){toast('아이디는 영문/숫자로만 입력하세요');return;}
  if(pw.length<6){toast('비밀번호는 6자 이상이어야 합니다');return;}
  if(EMPLOYEES.some(u=>u.login_id===id)){toast('❌ 이미 있는 아이디입니다');return;}
  const team=$('#f_team').value,scope=$('#f_scope').value,owner=$('#f_owner').value.trim();
  const roleMap={운영팀:'운영',물류팀:'물류',셀러팀:(scope==='self'&&owner)?'보조':'셀러'};
  toast('🔐 로그인 계정 생성 중...');
  let authId=null;
  try{const ac=_authClient();const {data,error}=await ac.auth.signUp({email:id+SB_DOMAIN,password:pw});
    if(error){toast('❌ 계정 생성 실패: '+error.message);return;}
    authId=data&&data.user?data.user.id:null;
    try{await ac.auth.signOut();}catch(e){}
  }catch(e){toast('❌ 계정 생성 오류: '+e.message);return;}
  const row={login_id:id,name,team,role:roleMap[team],scope,owner:owner||null,auth_id:authId,active:true};
  try{const {data,error}=await SB.from('employees').insert(row).select('*').single();
    if(error){toast('⚠️ 계정은 생성됐으나 직원정보 저장 실패: '+error.message);return;}
    EMPLOYEES.push(data);
  }catch(e){toast('⚠️ 직원정보 저장 오류: '+e.message);return;}
  ['f_name','f_id','f_pw','f_owner'].forEach(x=>{const el=$('#'+x);if(el)el.value='';});
  toast('✅ 사원 등록 완료: '+name+' — 아이디 "'+id+'"로 바로 로그인 가능');render();}

/* ===== 사원별 메뉴 권한 편집기 (대분류+소분류 체크박스) ===== */
let PERMEDIT=null;
function effPerms(u){const m={},s={};PERM_MENUS.forEach(mm=>{let on;if(u.perms&&u.perms.menus)on=u.perms.menus[mm.k]===true;else on=(mm.k==='dash')||(PERM[mm.k]||['all']).includes(u.scope)||(u.role==='보조'&&SUBMGR_MENUS.includes(mm.k));m[mm.k]=on;if(mm.subs){s[mm.k]={};mm.subs.forEach(sub=>{let son=true;if(u.perms&&u.perms.subs&&u.perms.subs[mm.k])son=u.perms.subs[mm.k][sub.k]!==false;s[mm.k][sub.k]=son;});}});return {menus:m,subs:s};}
function openPermEdit(i){const u=EMPLOYEES[i];if(!u)return;PERMEDIT={i,perms:effPerms(u)};renderPermEdit();}
function renderPermEdit(){const u=EMPLOYEES[PERMEDIT.i];if(!u)return;const p=PERMEDIT.perms;
  const rows=PERM_MENUS.map(mm=>{const on=p.menus[mm.k];
    const subHtml=(mm.subs&&on)?`<div style="margin:3px 0 2px 28px;display:flex;flex-wrap:wrap;gap:3px 16px">${mm.subs.map(sub=>`<label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#475569;cursor:pointer"><input type="checkbox" ${p.subs[mm.k][sub.k]?'checked':''} onchange="permToggleSub('${mm.k}','${sub.k}',this.checked)" style="width:15px;height:15px"> ${sub.l}</label>`).join('')}</div>`:'';
    return `<div style="padding:5px 0;border-bottom:1px solid #f1f5f9"><label style="display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;cursor:pointer"><input type="checkbox" ${on?'checked':''} onchange="permToggleMenu('${mm.k}',this.checked)" style="width:17px;height:17px"> ${mm.l}${mm.k==='users'?' <span class="muted" style="font-size:10px;font-weight:400">(권한관리 포함)</span>':''}</label>${subHtml}</div>`;}).join('');
  $('#modalBox').innerHTML=`<h3>🔑 ${esc(u.name)} 메뉴 권한 <span style="font-size:12px;color:#64748b;font-weight:500">체크한 메뉴/세부탭만 이 사원에게 보임</span></h3>
   <div class="ms" style="margin-bottom:6px">대분류(메뉴) 켜면 그 안 소분류(세부탭)도 조절 가능. <b>관리자(전체권한)는 항상 전부</b> 열립니다. 아무것도 저장 안 하면 기존 팀 기본권한 그대로.</div>
   <div style="display:flex;gap:6px;margin-bottom:8px"><button class="btn sm gray" onclick="permAll(true)">전체 선택</button><button class="btn sm gray" onclick="permAll(false)">전체 해제</button></div>
   <div style="max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 12px">${rows}</div>
   <div class="modal-foot"><button class="btn gray" onclick="editUser(${PERMEDIT.i})">← 뒤로</button><span style="flex:1"></span><button class="btn" onclick="savePerms()">권한 저장</button></div>`;
  $('#modal').classList.remove('hide');}
function permToggleMenu(k,on){PERMEDIT.perms.menus[k]=on;renderPermEdit();}
function permToggleSub(mk,sk,on){PERMEDIT.perms.subs[mk][sk]=on;renderPermEdit();}
function permAll(on){PERM_MENUS.forEach(mm=>{PERMEDIT.perms.menus[mm.k]=on;if(mm.subs)mm.subs.forEach(s=>PERMEDIT.perms.subs[mm.k][s.k]=on);});renderPermEdit();}
async function savePerms(){const u=EMPLOYEES[PERMEDIT.i];if(!u)return;const perms=JSON.parse(JSON.stringify(PERMEDIT.perms));
  toast('저장 중…');
  /* SQL 불필요 — 이미 열린 work_schedules 테이블의 _emp_perms 행에 사원별 맵으로 저장. DB 성공 확인 후에만 저장됨 표시 */
  const map=Object.assign({},EMP_PERMS,{[u.login_id]:perms});
  try{const {error}=await SB.from('work_schedules').upsert({id:'_emp_perms',data:map,owner:'_perms',updated_at:new Date().toISOString()});
    if(error){console.error('perms',error);toast('❌ 저장 실패: '+(error.message||'')+' (적용 안 됨)');return;}
  }catch(e){console.error(e);toast('❌ 저장 오류 — 적용 안 됨');return;}
  EMP_PERMS=map;u.perms=perms;if(ME&&ME.id===u.login_id)ME.perms=perms;
  closeModal();toast('✅ '+u.name+' 메뉴 권한 저장됨 (DB 반영 확인)');buildNav();render();}
async function saveUser(i){const u=EMPLOYEES[i];if(!u)return;const name=$('#eu_name').value.trim();
  if(!name){toast('이름은 필수입니다');return;}
  const team=$('#eu_team').value,scope=$('#eu_scope').value,owner=$('#eu_owner').value.trim();
  const roleMap={운영팀:'운영',물류팀:'물류',셀러팀:(scope==='self'&&owner)?'보조':'셀러'};
  const stockEdit=!!($('#eu_stock')&&$('#eu_stock').checked);
  const patch={name,team,role:roleMap[team],scope,owner:owner||null,stock_edit:stockEdit};
  const wasMe=ME&&ME.id===u.login_id;
  Object.assign(u,patch);closeModal();toast('✅ 수정: '+name);
  if(wasMe){ME.name=u.name;ME.team=u.team;ME.role=u.role;ME.scope=u.scope;ME.owner=u.owner;ME.stock_edit=u.stock_edit;}
  render();
  try{const {error}=await SB.from('employees').update(patch).eq('id',u.id);if(error)toast('⚠️ 저장 오류: '+error.message);}catch(e){toast('⚠️ 저장 오류');}}

function loginErr(m){const e=$('#loginErr');if(e){if(m){e.textContent='⚠️ '+m;e.style.display='block';}else{e.textContent='';e.style.display='none';}}if(m)toast('❌ '+m);}
function loginLoading(on){const b=$('#loginBtn');if(!b)return;if(on){b.disabled=true;if(!b.dataset.t)b.dataset.t=b.textContent;b.innerHTML='<span class="lspin"></span>로그인 중…';}else{b.disabled=false;b.textContent=b.dataset.t||'로그인';}}
let _logging=false;
async function doLogin(){
  if(_logging)return;
  const id=$('#loginId').value.trim(), pw=$('#loginPw').value.trim();
  loginErr('');
  if(!id||!pw){loginErr('아이디와 비밀번호를 모두 입력해 주세요');(!id?$('#loginId'):$('#loginPw')).focus();return;}
  const email = id.includes('@')? id : id+SB_DOMAIN;
  _logging=true;loginLoading(true);
  try{
  const {error} = await SB.auth.signInWithPassword({email, password:pw});
  if(error){loginErr('아이디 또는 비밀번호가 틀렸습니다. 다시 확인해 주세요.');$('#loginPw').value='';$('#loginPw').focus();loginLoading(false);_logging=false;return;}
