name: 주1회 브랜드 상품 자동 갱신

# 매주 월요일 10:00 KST (01:00 UTC) 자동 실행 + 수동 실행 가능
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "특정 브랜드만 (예: b01,b04) — 비워두면 전체"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: brand-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: 브랜드 상품 재수집 (상품만 갱신·보강필드 보존)
        id: refresh
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: python scripts/refresh_brands.py

      - name: 변경 시 커밋·푸시 (→ Vercel 자동배포)
        run: |
          git config user.name "nlive-bot"
          git config user.email "bot@n-live.co.kr"
          if [ -n "$(git status --porcelain data/pool-brands.full.json public/brand-images)" ]; then
            git add data/pool-brands.full.json public/brand-images
            git commit -m "자동: 브랜드 대표상품 주간 갱신 (${{ steps.refresh.outputs.summary }})"
            git push
            echo "변경사항 푸시 완료"
          else
            echo "변경 없음 — 커밋 생략"
          fi
